    this.filterInput = h("input", { type: "text", placeholder: "Filter workspaces", oninput: () => { this.filter = this.filterInput.value; this.buildEntries(); this.renderDrawer(); } });
    this.drawerList = h("div", { class: "list" });
    this.drawer = h("div", { class: "drawer", hidden: true },
      h("h2", { class: "serif" }, "Workspaces"),
      this.filterInput,
      this.drawerList,
      h("div", { class: "actions" },
        h("button", { class: "primary block", onclick: () => this.app.showNewWorkspace(this.connection, this) }, "New workspace"),
        h("button", { class: "block", onclick: () => this.app.showCloneWorkspace(this.connection, this) }, "Clone workspace"),
        h("button", { class: "block", onclick: () => this.beginNewGroup(null) }, "New group"),
        h("button", { class: "block", onclick: () => this.app.changeServer() }, "Change server")));
    this.scrim = h("div", { class: "overlay", hidden: true, onclick: () => this.setDrawer(false) });
    this.dialogHost = h("div", { class: "dialog-wrap", hidden: true });
    this.element = h("div", { class: "home" }, this.topbar, this.content, this.usageWrap, this.scrim, this.drawer, this.dialogHost);
    this.drawerOpen = false;
  }

  get active() {
    return this.selected ? this.opened.get(this.selected.id) ?? null : null;
  }

  setDrawer(open) {
    this.drawerOpen = open;
    this.drawer.hidden = !open;
    this.scrim.hidden = !open;
  }

  toggleUsage(open = this.usageWrap.hidden) {
    this.usageWrap.hidden = !open;
  }

  async showUsage(service) {
    if (service !== this.usageService) {
      this.usageService = service;
      this.usage = null;
      this.renderUsage();
    }

    clearInterval(this.usageTimer);
    this.usageTimer = null;

    if (!service) {
      return;
    }

    this.usageTimer = setInterval(() => this.refreshUsage(), 60000);
    await this.refreshUsage();
  }

  async refreshUsage() {
    const service = this.usageService;

    if (!service) {
      return;
    }

    try {
      const usage = await this.connection.getUsage(service);

      if (service === this.usageService) {
        this.usage = usage;
        this.renderUsage();
      }
    } catch (exception) {
    }
  }

  renderUsage() {
    const usage = this.usage;
    const session = usage?.session;
    const week = usage?.week;
    this.usageButton.dataset.pace = session ? paceOf(session) : "Even";
    const section = (label, period) => {
      if (!period) {
        return [];
      }

      const value = h("div", { class: "value" }, `${Math.round(period.percentUsed)}% used`);
      value.dataset.pace = paceOf(period);
      return [h("div", { class: "stack tight" }, h("div", { class: "muted" }, label), value, h("div", { class: "muted small" }, resetText(period)))];
    };
    this.usageCard.replaceChildren(
      h("h3", { class: "serif" }, `${services[this.usageService ?? "ClaudeCode"].label} usage limits`),
      ...section("Session", session),
      ...section("Week", week),
      ...(session || week ? [] : [h("div", { class: "muted" }, "The service reports no usage limits.")]));
  }

  updateWorking(view) {
    if (view === this.active) {
      this.topbar.classList.toggle("working", view.state() !== "Ready");
    }
  }

  async start(focus = null, focusFirst = true) {
    const result = await attempt(() => this.connection.listWorkspaces(), this.error);

    if (!result.ok) {
      return;
    }

    this.workspaces = result.value.workspaces;
    this.groups = result.value.groups;

    for (const id of [...this.collapsed]) {
      if (!this.groups.some(group => group.id === id)) {
        this.collapsed.delete(id);
      }
    }

    for (const [id, view] of [...this.opened]) {
      if (!this.workspaces.some(workspace => workspace.id === id)) {
        view.dispose();
        view.element.remove();
        this.opened.delete(id);
      }
    }

    this.buildEntries();
    this.closeDialog();
    this.select(null);
    const first = focusFirst ? this.entries.find(entry => entry.workspace)?.workspace ?? null : null;
    this.select(this.workspaces.find(workspace => workspace.id === focus) ?? first);
    this.setDrawer(this.selected === null);
  }

  async reload() {
    const open = this.drawerOpen;
    await this.start(this.selected?.id ?? null);
    this.setDrawer(open || this.selected === null);
  }

  select(workspace) {
    this.selected = workspace;
    this.setDrawer(false);
    this.closeDialog();

    for (const view of this.opened.values()) {
      view.element.hidden = true;
      view.blur();
    }

    this.empty.hidden = workspace !== null;
    this.tools.hidden = workspace === null;
    this.toggleUsage(false);
    this.showUsage(workspace?.service ?? null);
    this.title.textContent = workspace ? folderName(workspace.folder) : "Auto Remote";
    this.topbar.classList.remove("working");

    if (workspace) {
      let view = this.opened.get(workspace.id);

      if (!view) {
        view = new WorkspaceView(this.connection, workspace, this);
        this.opened.set(workspace.id, view);
        this.content.append(view.element);
      }

      view.info = workspace;
      view.element.hidden = false;
      view.focus();
      this.updateWorking(view);
    }

    this.renderDrawer();
  }

  replace(updated) {
    const index = this.workspaces.findIndex(workspace => workspace.id === updated.id);

    if (index >= 0) {
      this.workspaces[index] = updated;
    }

    if (this.selected?.id === updated.id) {
      const changed = this.selected.service !== updated.service;
      this.selected = updated;

      if (changed) {
        this.showUsage(updated.service);
      }
    }

    this.buildEntries();
    this.renderDrawer();
  }

  parentOf(id) {
    return id && this.groups.some(group => group.id === id) ? id : null;
  }

  children(parent) {
    return this.groups.filter(group => this.parentOf(group.parentId) === parent);
  }

  buildEntries() {
    this.entries = [];
    this.addEntries(null, 0, false);
  }

  get filtering() {
    return this.filter.trim() !== "";
  }

  matchesText(text) {
    return text.toLowerCase().includes(this.filter.trim().toLowerCase());
  }

  matchesWorkspace(workspace) {
    return this.matchesText(folderName(workspace.folder)) || this.matchesText(workspace.folder);
  }

  holdsMatch(id) {
    return this.workspaces.some(item => this.parentOf(item.groupId) === id && this.matchesWorkspace(item))
      || this.children(id).some(child => this.matchesText(child.name) || this.holdsMatch(child.id));
  }

  addEntries(parent, depth, showAll) {
    for (const group of this.children(parent)) {
      const shown = !this.filtering || showAll || this.matchesText(group.name);

      if (!shown && !this.holdsMatch(group.id)) {
        continue;
      }

      const collapsed = !this.filtering && this.collapsed.has(group.id);
      this.entries.push({ group, collapsed, depth });

      if (!collapsed) {
        this.addEntries(group.id, depth + 1, shown && this.filtering);
      }
    }

    for (const workspace of this.workspaces.filter(item => this.parentOf(item.groupId) === parent && (!this.filtering || showAll || this.matchesWorkspace(item)))) {
      this.entries.push({ workspace, depth });
    }
  }

  renderDrawer() {
    if (this.filtering && this.entries.length === 0) {
      this.drawerList.replaceChildren(h("div", { class: "muted", style: "padding:8px" }, "No workspaces match."));
      return;
    }

    this.drawerList.replaceChildren(...this.entries.map(entry => {
      const indent = `margin-left:${entry.depth * 18}px`;

      if (entry.group) {
        const group = entry.group;
        const tool = (label, title, action) => h("button", { class: "flat", title, onclick: event => { event.stopPropagation(); action(); } }, label);
        return h("div", { class: "row group", style: indent, onclick: () => this.toggleGroup(group.id) },
          h("div", { class: "name" }, `${entry.collapsed ? "▸" : "▾"} ${group.name}`),
          tool("▲", "Move up", () => this.shift(() => this.connection.shiftGroup(group.id, -1))),
          tool("▼", "Move down", () => this.shift(() => this.connection.shiftGroup(group.id, 1))),
          tool("+", "New group inside", () => this.beginNewGroup(group)),
          tool("✎", "Rename group", () => this.beginRenameGroup(group)),
          tool("↪", "Move group", () => this.beginMove(null, group)),
          tool("✕", "Delete group", () => this.beginDeleteGroup(group)));
      }

      const workspace = entry.workspace;
      return h("div", { class: `row${workspace.id === this.selected?.id ? " on" : ""}`, style: indent, onclick: () => this.select(workspace) },
        h("div", { class: "name" }, folderName(workspace.folder), h("small", {}, workspace.folder)),
        h("button", { class: "flat", title: "Move up", onclick: event => { event.stopPropagation(); this.shift(() => this.connection.shiftWorkspace(workspace.id, -1)); } }, "▲"),
        h("button", { class: "flat", title: "Move down", onclick: event => { event.stopPropagation(); this.shift(() => this.connection.shiftWorkspace(workspace.id, 1)); } }, "▼"),
        h("button", { class: "flat", title: "Move workspace", onclick: event => { event.stopPropagation(); this.beginMove(workspace, null); } }, "↪"));
    }));
  }

  toggleGroup(id) {
    if (!this.collapsed.delete(id)) {
      this.collapsed.add(id);
    }

    this.buildEntries();
    this.renderDrawer();
  }

  closeDialog() {
    this.dialogHost.hidden = true;
    this.dialogHost.replaceChildren();
    this.dialogError.set(null);
  }

  dialog(title, body, ...controls) {
    this.dialogError.set(null);
    this.dialogHost.replaceChildren(h("div", { class: "dialog" },
      h("h3", { class: "serif" }, title),
      body ? h("div", { class: "muted" }, body) : null,
      ...controls,
      this.dialogError.element,
      h("button", { class: "block", onclick: () => this.closeDialog() }, "Cancel")));
    this.dialogHost.hidden = false;
    this.dialogHost.querySelector("input[type=text]")?.focus();
  }

  refuseEdit() {
    if (this.active && this.active.state() !== "Ready") {
      this.notice("Workspace busy", "Wait for the work in this workspace to finish first.");
      return true;
    }

    return false;
  }

  notice(title, body) {
    this.dialogError.set(null);
    this.dialogHost.replaceChildren(h("div", { class: "dialog" },
      h("h3", { class: "serif" }, title),
      h("div", { class: "muted" }, body),
      h("button", { class: "primary block", onclick: () => this.closeDialog() }, "OK")));
    this.dialogHost.hidden = false;
  }

  nameBox(text, confirm) {
    return h("input", { type: "text", value: text, onkeydown: event => { if (event.key === "Enter") { confirm(); } } });
  }

  async shift(action) {
    const result = await attempt(async () => { await action(); return this.connection.listWorkspaces(); }, this.error);

    if (result.ok) {
      this.workspaces = result.value.workspaces;
      this.groups = result.value.groups;
      this.buildEntries();
      this.renderDrawer();
    }
  }

  async submit(action, afterwards) {
    const result = await attempt(action, this.dialogError);

    if (result.ok) {
      await afterwards(result.value);
    }
  }

  beginRename() {
    const workspace = this.selected;

    if (!workspace) {
      return;
    }

    if (this.refuseEdit()) {
      return;
    }

    const confirm = () => {
      const name = box.value;

      if (!name.trim()) {
        this.dialogError.set("Enter a name.");
        return;
      }

      this.submit(() => this.connection.renameWorkspace(workspace.id, name), renamed => this.start(renamed.id));
    };
    const box = this.nameBox(folderName(workspace.folder), confirm);
    this.dialog("Rename workspace", "This renames the workspace's folder on the server.", box, h("button", { class: "primary block", onclick: confirm }, "Rename"));
  }

  beginDelete() {
    const workspace = this.selected;

    if (!workspace) {
      return;
    }

    if (this.refuseEdit()) {
      return;
    }

    const folder = h("input", { type: "checkbox", checked: true });
    this.dialog("Delete workspace?", `${folderName(workspace.folder)} will be removed from the server.`,
      h("label", { class: "check" }, folder, "Also delete the workspace folder and everything in it"),
      h("button", { class: "danger block", onclick: () => this.submit(() => this.connection.deleteWorkspace(workspace.id, folder.checked), () => this.start()) }, "Delete"));
  }

  beginNewGroup(parent) {
    const confirm = () => {
      const name = box.value;

      if (!name.trim()) {
        this.dialogError.set("Enter a name.");
        return;
      }

      this.submit(() => this.connection.createGroup(name, parent?.id), () => this.reload());
    };
    const box = this.nameBox("", confirm);
    this.dialog("New group", (parent ? `It will be created inside ${parent.name}. ` : "") + "Groups only organize workspaces in Auto Remote. They are not created on the server's disk.", box, h("button", { class: "primary block", onclick: confirm }, "Create"));
  }

  beginRenameGroup(group) {
    const confirm = () => {
      const name = box.value;

      if (!name.trim()) {
        this.dialogError.set("Enter a name.");
        return;
      }

      this.submit(() => this.connection.renameGroup(group.id, name), () => this.reload());
    };
    const box = this.nameBox(group.name, confirm);
    this.dialog("Rename group", null, box, h("button", { class: "primary block", onclick: confirm }, "Rename"));
  }

  beginDeleteGroup(group) {
    this.dialog("Delete group?", `${group.name} will be removed. The workspaces and groups in it are kept and move up into its parent.`,
      h("button", { class: "danger block", onclick: () => this.submit(() => this.connection.deleteGroup(group.id), () => this.reload()) }, "Delete"));
  }

  descendants(id) {
    return this.groups.filter(group => group.parentId === id).flatMap(child => [child.id, ...this.descendants(child.id)]);
  }

  destinations(parent, path, blocked, into) {
    for (const group of this.children(parent).filter(item => !blocked.has(item.id))) {
      const name = path ? `${path} / ${group.name}` : group.name;
      into.push({ id: group.id, name });
      this.destinations(group.id, name, blocked, into);
    }

    return into;
  }

  beginMove(workspace, group) {
    const blocked = new Set(group ? [group.id, ...this.descendants(group.id)] : []);
    const choices = this.destinations(null, "", blocked, [{ id: null, name: "Top level" }]);
    const current = workspace ? workspace.groupId ?? null : group.parentId ?? null;
    const select = h("select", {}, choices.map((choice, index) => h("option", { value: index }, choice.name)));
    select.value = Math.max(0, choices.findIndex(choice => choice.id === current));
    const name = workspace ? folderName(workspace.folder) : group.name;
    const text = workspace ? `Choose where ${name} goes in the list.` : `Choose where ${name} goes in the list, with everything in it.`;
    const apply = () => {
      const destination = choices[Number(select.value)].id;
      return workspace ? this.connection.moveWorkspace(workspace.id, destination) : this.connection.moveGroup(group.id, destination);
    };
    this.dialog(workspace ? "Move workspace" : "Move group", text, select, h("button", { class: "primary block", onclick: () => this.submit(apply, () => this.reload()) }, "Move"));
  }

  dispose() {
    for (const view of this.opened.values()) {
      view.dispose();
    }

    this.opened.clear();
  }
}

class NewWorkspace {
  constructor(app, connection, home) {
    this.app = app;
    this.connection = connection;
    this.home = home;
    this.listing = null;
    this.folderError = new ErrorLine();
    this.error = new ErrorLine();
    this.build();
    this.open(null);
  }

  build() {
    this.upButton = h("button", { disabled: true, onclick: () => this.open(this.listing?.parent) }, "↑ Up");
    this.pathLabel = h("span", {}, "Computer");
    this.folders = h("div", { class: "folders" });
    this.nameBox = h("input", { type: "text", placeholder: "New folder name", onkeydown: event => { if (event.key === "Enter") { this.createFolder(); } } });
    this.startButton = h("button", { class: "primary block", disabled: true, onclick: () => this.start() }, "Start workspace in this folder");
    this.element = h("div", { class: "newws" },
      h("header", {}, h("h1", { class: "serif" }, "New workspace"), h("button", { class: "flat", onclick: () => this.app.showHome(this.home) }, "Cancel")),
      h("div", { class: "muted", style: "margin-top:4px" }, "Choose the folder on the server that will host the workspace. The workspace is named after it."),
      h("div", { class: "path" }, this.upButton, this.pathLabel),
      this.folders,
      h("div", { class: "create" }, this.nameBox, h("button", { onclick: () => this.createFolder() }, "Create")),
      h("div", { style: "margin-top:8px" }, this.folderError.element),
      h("div", { class: "foot" }, this.error.element, this.startButton));
  }

  get canChoose() {
    return !!this.listing && this.listing.path.length > 0;
  }

  async open(path) {
    if (path === undefined) {
      return;
    }

    const result = await attempt(() => this.connection.listFolders(path), this.folderError);

    if (result.ok) {
      this.show(result.value);
    }
  }

  show(listing) {
    this.listing = listing;
    this.pathLabel.textContent = listing.path || "Computer";
    this.upButton.disabled = listing.parent === undefined || listing.parent === null;
    this.startButton.disabled = !this.canChoose;
    this.folders.replaceChildren(...listing.folders.map(folder => h("div", { class: "row", onclick: () => this.open(folder.path) },
      h("div", { class: "name" }, folder.name),
      h("span", { class: "muted" }, "›"))));
  }

  async createFolder() {
    const name = this.nameBox.value;

    if (!name.trim()) {
      this.folderError.set("Enter a name for the new folder.");
      return;
    }

    if (!this.canChoose) {
      this.folderError.set("Open a folder first.");
      return;
    }

    const result = await attempt(() => this.connection.createFolder(this.listing.path, name), this.folderError);

    if (result.ok) {
      this.nameBox.value = "";
      this.show(result.value);
    }
  }

  async start() {
    const result = await attempt(() => this.connection.createWorkspace(this.listing.path), this.error);

    if (result.ok) {
      this.app.showHome(this.home, result.value.id);
    }
  }
}

class CloneWorkspace {
  constructor(app, connection, home) {
    this.app = app;
    this.connection = connection;
    this.home = home;
    this.listing = null;
    this.folderError = new ErrorLine();
    this.error = new ErrorLine();
    this.build();
    this.open(null);
  }

  build() {
    this.upButton = h("button", { disabled: true, onclick: () => this.open(this.listing?.parent) }, "↑ Up");
    this.pathLabel = h("span", {}, "Computer");
    this.folders = h("div", { class: "folders" });
    this.urlBox = h("input", { type: "text", placeholder: "Repository URL", autocapitalize: "off", spellcheck: false, oninput: () => this.update() });
    this.folderBox = h("input", { type: "text", placeholder: "Folder name (optional, defaults to the repository name)", autocapitalize: "off", spellcheck: false });
    this.nameBox = h("input", { type: "text", placeholder: "New folder name", onkeydown: event => { if (event.key === "Enter") { this.createFolder(); } } });
    this.progress = h("div", { class: "muted", hidden: true }, "Cloning, this can take a while…");
    this.startButton = h("button", { class: "primary block", disabled: true, onclick: () => this.start() }, "Clone into this folder");
    this.element = h("div", { class: "newws" },
      h("header", {}, h("h1", { class: "serif" }, "Clone workspace"), h("button", { class: "flat", onclick: () => this.app.showHome(this.home) }, "Cancel")),
      h("div", { class: "muted", style: "margin-top:4px" }, "The server clones the repository into a new folder inside the folder you pick, and a workspace is created in it."),
      h("div", { class: "fields" }, this.urlBox, this.folderBox),
      h("div", { class: "path" }, this.upButton, this.pathLabel),
      this.folders,
      h("div", { class: "create" }, this.nameBox, h("button", { onclick: () => this.createFolder() }, "Create")),
      h("div", { style: "margin-top:8px" }, this.folderError.element),
      h("div", { class: "foot" }, this.error.element, this.progress, this.startButton));
  }

  get canChoose() {
    return !!this.listing && this.listing.path.length > 0;
  }

  update() {
    this.startButton.disabled = !this.canChoose || !this.urlBox.value.trim();
  }

  async open(path) {
    if (path === undefined) {
      return;
    }

    const result = await attempt(() => this.connection.listFolders(path), this.folderError);

    if (result.ok) {
      this.show(result.value);
    }
  }

  show(listing) {
    this.listing = listing;
    this.pathLabel.textContent = listing.path || "Computer";
    this.upButton.disabled = listing.parent === undefined || listing.parent === null;
    this.update();
    this.folders.replaceChildren(...listing.folders.map(folder => h("div", { class: "row", onclick: () => this.open(folder.path) },
      h("div", { class: "name" }, folder.name),
      h("span", { class: "muted" }, "›"))));
  }

  async createFolder() {
    const name = this.nameBox.value;

    if (!name.trim()) {
      this.folderError.set("Enter a name for the new folder.");
      return;
    }

    if (!this.canChoose) {
      this.folderError.set("Open a folder first.");
      return;
    }

    const result = await attempt(() => this.connection.createFolder(this.listing.path, name), this.folderError);

    if (result.ok) {
      this.nameBox.value = "";
      this.show(result.value);
    }
  }

  async start() {
    this.progress.hidden = false;
    this.startButton.disabled = true;
    const result = await attempt(() => this.connection.cloneWorkspace(this.urlBox.value.trim(), this.listing.path, this.folderBox.value.trim()), this.error);
    this.progress.hidden = true;
    this.update();

    if (result.ok) {
      this.app.showHome(this.home, result.value.id);
    }
  }
}

class ConnectScreen {
  constructor(app, saved, error) {
    this.app = app;
    this.error = new ErrorLine();
    this.progress = h("div", { class: "progress", hidden: true });
    const defaults = saved ?? { host: ["localhost", "127.0.0.1"].includes(location.hostname) ? location.hostname : "", port: "52679", accessKey: "" };
    this.host = h("input", { type: "text", placeholder: "192.168.1.20", value: defaults.host, autocapitalize: "off", spellcheck: false });
    this.port = h("input", { type: "text", placeholder: "52679", value: String(defaults.port ?? ""), inputMode: "numeric" });
    this.key = h("input", { type: "password", value: defaults.accessKey ?? "", autocomplete: "current-password" });
    this.trust = h("a", { target: "_blank", rel: "noopener" });
    const trustLine = h("div", { class: "muted small trust" }, "Self-signed certificate? Open ", this.trust, " once and accept it, then connect.");
    this.updateTrust = () => {
      const host = this.host.value.trim();
      const port = this.port.value.trim();
      const address = `https://${host.includes(":") ? `[${host}]` : host}:${port}`;
      trustLine.hidden = !host || !/^\d+$/.test(port);
      this.trust.href = address;
      this.trust.textContent = address;
    };
    this.button = h("button", { class: "primary block", style: "margin-top:8px", onclick: () => this.connect() }, "Connect");
    const submit = event => { if (event.key === "Enter") { this.connect(); } };
    [this.host, this.port, this.key].forEach(box => box.addEventListener("keydown", submit));
    [this.host, this.port].forEach(box => box.addEventListener("input", this.updateTrust));
    this.element = h("div", { class: "connect" },
      h("div", { class: "form" },
        h("h1", { class: "serif" }, "Auto Remote"),
        h("div", { class: "muted sub" }, "Connect to your AI server"),
        h("div", { class: "muted" }, "Host"), this.host,
        h("div", { class: "muted" }, "Port"), this.port,
        h("div", { class: "muted" }, "Access key"), this.key,
        this.error.element,
        this.button,
        this.progress,
        trustLine));
    this.updateTrust();
    this.error.set(error);
  }

  async connect() {
    const host = this.host.value.trim();
    const port = Number.parseInt(this.port.value, 10);

    if (!host) {
      this.error.set("Enter the server host.");
      return;
    }

    if (!/^\d+$/.test(this.port.value.trim()) || port < 1 || port > 65535) {
      this.error.set("The port must be a number from 1 to 65535.");
      return;
    }

    if (!this.key.value) {
      this.error.set("Enter the access key.");
      return;
    }

    const settings = { host, port, accessKey: this.key.value };
    this.progress.hidden = false;
    this.button.disabled = true;
    const result = await attempt(() => Connection.open(settings), this.error);
    this.progress.hidden = true;
    this.button.disabled = false;

    if (result.ok) {
      localStorage.setItem(storageKey, JSON.stringify(settings));
      this.app.open(result.value);
    }
  }
}

class App {
  constructor(root) {
    this.root = root;
    this.connection = null;
    this.home = null;
  }

  show(element) {
    this.root.replaceChildren(element);
  }

  saved() {
    try {
      return JSON.parse(localStorage.getItem(storageKey));
    } catch (exception) {
      return null;
    }
  }

  async start() {
    const saved = this.saved();

    if (!saved) {
      this.showConnect(null, null);
      return;
    }

    try {
      await this.open(await Connection.open(saved));
    } catch (exception) {
      this.showConnect(saved, exception.message);
    }
  }

  showConnect(saved, error) {
    this.show(new ConnectScreen(this, saved, error).element);
  }

  async open(connection) {
    this.close();
    this.connection = connection;
    this.home = new Home(this, connection);
    connection.onclose = () => {
      if (this.connection === connection) {
        this.close();
        this.showConnect(this.saved(), "The connection to the server was lost.");
      }
    };
    this.show(this.home.element);
    await this.home.start(null, false);
  }

  showHome(home, focus = null) {
    this.show(home.element);

    if (focus) {
      home.start(focus);
    }
  }

  showNewWorkspace(connection, home) {
    this.show(new NewWorkspace(this, connection, home).element);
  }

  showCloneWorkspace(connection, home) {
    this.show(new CloneWorkspace(this, connection, home).element);
  }

  changeServer() {
    this.close();
    this.showConnect(this.saved(), null);
  }

  close() {
    this.home?.dispose();
    this.home = null;

    if (this.connection) {
      const old = this.connection;
      this.connection = null;
      old.close();
    }
  }
}

new App(document.getElementById("app")).start();
</script>

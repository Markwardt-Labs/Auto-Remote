    } else if (kind === "autocommit") {
      this.withIdentity(() => this.autoCommit());
    } else if (kind === "branch") {
      this.askGit({ title: "New branch", confirm: "Create Branch", input: "Branch name", empty: "Enter a name.", action: text => this.connection.gitCreateBranch(id, text) });
    } else if (kind === "tag") {
      this.withIdentity(() => this.askGit({ title: "New tag", confirm: "Create Tag", input: "Tag name", empty: "Enter a name.", action: text => this.connection.gitCreateTag(id, text) }));
    } else {
      this.askGit({ title: "Git remote", confirm: "Set Remote", input: status.isRepo ? "Remote URL" : "Remote URL (makes the workspace a git repository)", text: status.remote ?? "", empty: "Enter the remote URL.", capitalize: false, action: text => this.connection.gitSetRemote(id, text) });
    }
  }

  async autoCommit() {
    if (this.refuseWork()) {
      return;
    }

    this.localBusy = true;
    this.renderGit();

    try {
      const id = this.info.id;
      await this.connection.gitCommit(id, await this.connection.generateCommitMessage(id));
    } catch (exception) {
      this.gitNotice("Auto Commit", exception.message);
    } finally {
      this.localBusy = false;
      this.refreshGit(true);
    }
  }

  checkout(name) {
    const discard = this.gitStatus.hasChanges === true;
    const shown = /^[0-9a-f]{12,}$/i.test(name) ? name.slice(0, 7) : name;
    this.askGit({
      title: "Checkout",
      body: discard ? `Check out '${shown}'? This will discard your pending changes.` : `Check out '${shown}'?`,
      confirm: discard ? "Discard and Checkout" : "Checkout",
      destructive: discard,
      action: () => this.connection.gitCheckout(this.info.id, name, discard),
    });
  }

  deleteBranch(name) {
    this.askGit({ title: "Delete branch", body: `Delete branch '${name}'? This cannot be undone.`, confirm: "Delete", destructive: true, action: () => this.connection.gitDeleteBranch(this.info.id, name) });
  }

  deleteTag(name) {
    this.askGit({ title: "Delete tag", body: `Delete tag '${name}'? This cannot be undone.`, confirm: "Delete", destructive: true, action: () => this.connection.gitDeleteTag(this.info.id, name) });
  }

  gitNotice(title, message) {
    if (this.home.active === this) {
      this.home.notice(title, message);
    } else {
      this.historyError.set(message);
    }
  }

  async compare(branch, base) {
    this.localBusy = true;
    this.renderGit();

    try {
      return await this.connection.getGitBranchState(this.info.id, branch, base);
    } catch (exception) {
      this.gitNotice("Git", exception.message);
      return null;
    } finally {
      this.localBusy = false;
      this.renderGit();
    }
  }

  askSquash(title, branch, base, state, confirm, run) {
    const commits = state.unique === 1 ? "1 commit" : `${state.unique} commits`;
    this.askGit({ title: `${title} '${branch}'`, body: `Message for the one commit replacing the ${commits} on '${branch}' that aren't on '${base}'`, confirm, input: "Message", text: state.subject ?? "", empty: "Enter a commit message.", action: run });
  }

  squash(branch, base) {
    this.withIdentity(async () => {
      const state = await this.compare(branch, base);

      if (!state || this.home.active !== this) {
        return;
      }

      if (state.unique === 0) {
        this.home.notice("Squash", `'${branch}' has no commits that aren't already on '${base}'.`);
        return;
      }

      this.askSquash("Squash", branch, base, state, "Squash", message => this.connection.gitSquash(this.info.id, branch, base, message));
    });
  }

  rebase(branch, onto) {
    this.withIdentity(async () => {
      if (this.gitStatus.hasChanges) {
        this.home.notice("Rebase", "Commit or reset your pending changes first - this needs a clean working tree.");
        return;
      }

      const state = await this.compare(branch, onto);

      if (!state || this.home.active !== this) {
        return;
      }

      if (state.unique === 0 && state.isBased) {
        this.home.notice("Rebase", `'${branch}' is already up to date with '${onto}'.`);
      } else if (state.unique > 1) {
        this.askSquash("Rebase", branch, onto, state, "Rebase", message => this.connection.gitRebase(this.info.id, branch, onto, message));
      } else {
        this.askGit({ title: "Rebase", body: `Rebase '${branch}' onto '${onto}'? Conflicts are resolved by the AI.`, confirm: "Rebase", action: () => this.connection.gitRebase(this.info.id, branch, onto, null) });
      }
    });
  }

  merge(source, target) {
    this.withIdentity(async () => {
      if (this.gitStatus.hasChanges) {
        this.home.notice("Merge", "Commit or reset your pending changes first - this needs a clean working tree.");
        return;
      }

      const state = await this.compare(source, target);

      if (!state || this.home.active !== this) {
        return;
      }

      if (state.unique === 0) {
        this.home.notice("Merge", `'${source}' has no commits that aren't already on '${target}'.`);
      } else if (state.unique > 1) {
        this.askSquash("Merge", source, target, state, "Merge", message => this.connection.gitMerge(this.info.id, source, target, message));
      } else {
        this.askGit({ title: "Merge", body: `Merge '${source}' into '${target}'? '${source}' is deleted afterwards.`, confirm: "Merge", action: () => this.connection.gitMerge(this.info.id, source, target, null) });
      }
    });
  }

  async fetchGit() {
    if (this.refuseWork()) {
      return;
    }

    this.localBusy = true;
    this.renderGit();

    try {
      await this.connection.gitFetch(this.info.id);
    } catch (exception) {
      this.historyError.set(exception.message);
    } finally {
      this.localBusy = false;
      this.refreshGit(true);
    }
  }

  async cancelGit() {
    try {
      await this.connection.gitCancel(this.info.id);
    } catch (exception) {
    }
  }

  showMenu(event, items) {
    event.stopPropagation();
    document.querySelector(".ctx-menu")?.remove();
    const menu = h("div", { class: "menu-list ctx-menu", style: `position:fixed;left:${Math.min(event.clientX, innerWidth - 260)}px;top:${Math.min(event.clientY, innerHeight - 300)}px` },
      items.filter(item => item !== null).map(item => item === "-" ? h("hr") : h("button", { disabled: item.disabled === true, onclick: () => { menu.remove(); item.action(); } }, item.label)));
    document.body.append(menu);
    const close = () => { menu.remove(); document.removeEventListener("click", close); };
    setTimeout(() => document.addEventListener("click", close), 0);
  }

  refMenu(event, ref, current) {
    // The branches of side sessions are theirs alone, and a side session changes no refs at all.
    if (this.sideInfo || ref.kind === "Session") {
      return;
    }

    const target = ref.kind === "Remote" && ref.name.includes("/") ? ref.name.slice(ref.name.indexOf("/") + 1) : ref.name;
    const tag = ref.kind === "Tag";
    const relative = !tag && !ref.isCurrent && current && target !== current;
    const quote = (name, suffix = "") => `'${name}'${suffix}`;
    const cur = quote(current ?? "", " (current)");
    const sel = quote(target);
    this.showMenu(event, [
      ref.isCurrent ? null : { label: "Checkout", action: () => this.checkout(target) },
      relative ? "-" : null,
      relative ? { label: `Squash ${cur} since ${sel}`, action: () => this.squash(current, target) } : null,
      relative ? { label: `Squash ${sel} since ${cur}`, action: () => this.squash(target, current) } : null,
      relative ? "-" : null,
      relative ? { label: `Rebase ${cur} onto ${sel}`, action: () => this.rebase(current, target) } : null,
      relative ? { label: `Rebase ${sel} onto ${cur}`, action: () => this.rebase(target, current) } : null,
      relative ? "-" : null,
      relative ? { label: `Merge ${cur} into ${sel}`, action: () => this.merge(current, target) } : null,
      relative ? { label: `Merge ${sel} into ${cur}`, action: () => this.merge(target, current) } : null,
      ref.isCurrent ? null : "-",
      ref.isCurrent ? null : { label: "Delete", action: () => tag ? this.deleteTag(target) : this.deleteBranch(target) },
    ]);
  }
}

class Home {
  constructor(app, connection) {
    this.app = app;
    this.connection = connection;
    this.resources = new ResourceFeed(() => this.connection, () => this.element?.isConnected === true && (this.drawerOpen || !!(this.active?.settingsOpen && this.active.resourcesSection.open)), () => this.showResources());
    this.workspaces = [];
    this.sideSessions = [];
    this.shownSessions = new Map();
    this.activeId = null;
    this.awaited = null;
    this.tasked = new Set();
    this.sessionExpanded = null;
    this.sessionAsk = null;
    this.groups = [];
    this.expanded = new Set();
    this.opened = new Map();
    this.selected = null;
    this.refreshing = false;
    this.refreshAgain = false;
    this.error = new ErrorLine();
    this.dialogError = new ErrorLine();
    this.busy = new Set();
    this.busyHeard = new Map();
    this.looping = new Set();
    this.queued = new Set();
    this.delegations = new Map();
    this.swarmTasks = [];
    this.followed = new Set();
    this.held = new Set();
    this.catalogListener = event => {
      if (event.kind === "WorkspacesChanged") {
        this.refreshCatalog();
      } else if (event.kind === "SwarmChanged") {
        this.refreshSwarm();
      } else if (event.kind === "QueueChanged") {
        const had = this.queued.has(event.workspaceId);

        if (event.queue) {
          this.queued.add(event.workspaceId);
        } else {
          this.queued.delete(event.workspaceId);
        }

        if (had !== this.queued.has(event.workspaceId)) {
          this.buildEntries();
          this.renderDrawer();
        }
      } else if (event.kind === "StateChanged") {
        const had = this.busy.has(event.workspaceId);
        this.busyHeard.set(event.workspaceId, event.state !== "Ready");
        this.markBusy(event.workspaceId, event.state !== "Ready");

        if (had !== this.busy.has(event.workspaceId)) {
          this.buildEntries();
          this.renderDrawer();
        }
      } else if (event.kind === "LoopChanged") {
        const had = this.looping.has(event.workspaceId);

        if (event.loop) {
          this.looping.add(event.workspaceId);
        } else {
          this.looping.delete(event.workspaceId);
        }

        if (had !== this.looping.has(event.workspaceId)) {
          this.buildEntries();
          this.renderDrawer();
        }
      }
    };
    connection.listeners.add(this.catalogListener);
    this.build();
  }

  build() {
    this.menuButton = h("button", { class: "flat menu", title: "Workspaces", onclick: () => this.setDrawer(!this.drawerOpen) }, "☰");
    this.titleText = h("span", { class: "name" }, "Auto Remote");
    this.sideMarker = h("span", { class: "side-marker", hidden: true, title: "A side session" }, icon("session"), "Side");
    this.chevron = h("span", { class: "chevron", hidden: true }, "▾");
    this.sessionsButton = h("button", { class: "sessions", title: "Sessions of this workspace", disabled: true, onclick: () => this.toggleSessions() }, this.titleText, this.sideMarker, this.chevron);
    this.loopIndicator = h("button", { class: "flat icon loop-indicator", hidden: true, onclick: () => this.showLoopNext() }, icon("loop"));
    this.limitIndicator = h("button", { class: "flat icon loop-indicator limit-indicator", hidden: true, onclick: () => this.showLimitPause() }, icon("pause"));
    this.notifyButton = h("button", { class: "flat icon loop-indicator notify", hidden: true, onclick: () => this.toggleNotify() }, icon("bell"));
    this.title = h("div", { class: "title serif" }, this.sessionsButton, this.loopIndicator, this.limitIndicator, this.notifyButton);
    this.gearButton = h("button", { class: "flat gear", title: "Workspace settings", onclick: () => this.active?.toggleSettings() }, "\u2699\uFE0E");
    this.usageButton = h("button", { class: "flat usage", title: "AI usage limits", onclick: () => this.toggleUsage() });
    this.usageButton.innerHTML = '<svg viewBox="0 0 16 16" width="18" height="18"><path d="M3,13 L3,8 M8,13 L8,3 M13,13 L13,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
    this.tools = h("div", { class: "tools", hidden: true }, this.usageButton, this.gearButton);
    this.topbar = h("div", { class: "topbar" }, this.menuButton, this.title, this.tools);
    this.content = h("div", { class: "content" });
    this.usageCard = h("div", { class: "usage-card" });
    this.usageWrap = h("div", { class: "usage-wrap", hidden: true, onclick: event => event.target === this.usageWrap && this.toggleUsage(false) }, this.usageCard);
    this.sessionRows = h("div", { class: "rows" });
    this.sessionError = new ErrorLine();
    this.sessionsCard = h("div", { class: "sessions-card" },
      h("h3", { class: "serif" }, "Sessions"),
      this.sessionRows,
      this.sessionError.element,
      h("button", { class: "block", onclick: () => this.beginNewSession() }, "New Session"));
    this.sessionsWrap = h("div", { class: "sessions-wrap", hidden: true, onclick: event => event.target === this.sessionsWrap && this.toggleSessions(false) }, this.sessionsCard);
    this.usage = null;
    this.usageService = null;
    this.usageTimer = null;
    this.empty = h("div", { class: "empty" },
      h("h2", { class: "serif" }, "No workspace selected"),
      this.error.element);
    this.content.append(this.empty);

    this.filter = "";
    this.filterInput = h("input", { type: "text", placeholder: "Filter workspaces", oninput: () => { this.filter = this.filterInput.value; this.buildEntries(); this.renderDrawer(); } });
    this.drawerList = h("div", { class: "list" });
    this.drawer = h("div", { class: "drawer", hidden: true },
      h("div", { class: "drawer-head" }, h("h2", { class: "serif" }, "Workspaces"), h("button", { class: "flat gear", title: "AI environment settings", onclick: () => this.app.showEnvironment(this.connection, this) }, "\u2699\uFE0E")),
      this.filterInput,
      this.drawerList,
      h("div", { class: "actions" },
        h("button", { class: "block", onclick: () => this.app.showNewWorkspace(this.connection, this) }, "New Workspace"),
        h("button", { class: "block", onclick: () => this.app.showCloneWorkspace(this.connection, this) }, "Clone Workspace"),
        h("button", { class: "block", onclick: () => this.beginNewGroup() }, "New Group"),
        h("button", { class: "block", onclick: () => this.app.showSwarm(this.connection, this, null, this.selected?.id ?? null) }, "Swarm"),
        h("button", { class: "block", onclick: () => this.app.changeServer() }, "Change Server")));
    this.scrim = h("div", { class: "overlay", hidden: true, onclick: () => this.setDrawer(false) });
    this.dialogHost = h("div", { class: "dialog-wrap", hidden: true });
    this.dialogKeyListener = event => this.dialogKey(event);
    document.addEventListener("keydown", this.dialogKeyListener);
    this.element = h("div", { class: "home" }, this.topbar, this.content, this.usageWrap, this.sessionsWrap, this.scrim, this.drawer, this.dialogHost);
    this.drawerOpen = false;
  }

  get active() {
    return this.activeId ? this.opened.get(this.activeId) ?? null : null;
  }

  // The main workspace of what the identifier names, which is itself unless it names a side session.
  mainOf(id) {
    return this.sideSessions.find(session => session.id === id)?.side.parentId ?? id;
  }

  // The session of a workspace that is on screen when it is selected.
  shownOf(workspace) {
    const id = this.shownSessions.get(workspace.id);
    return this.sideSessions.find(session => session.id === id && session.side.state === "Ready") ?? workspace;
  }

  known(id) {
    return this.workspaces.find(item => item.id === id) ?? this.sideSessions.find(item => item.id === id) ?? null;
  }

  // A workspace counts as working, looping or queued when any of its sessions does.
  anySession(workspaceId, ids) {
    return ids.has(workspaceId) || this.sideSessions.some(session => session.side.parentId === workspaceId && ids.has(session.id));
  }

  showSession(id) {
    if (!this.selected || this.mainOf(id) !== this.selected.id) {
      return false;
    }

    if (id === this.selected.id) {
      this.shownSessions.delete(id);
    } else if (this.sideSessions.some(session => session.id === id && session.side.state === "Ready")) {
      this.shownSessions.set(this.selected.id, id);
    } else {
      return false;
    }

    this.awaited = null;
    this.swap();
    this.renderSessions();
    return true;
  }

  // Main shown in the place of a session that cannot be shown stays, rather than giving way to it again later.
  forgetUnshowable(workspace) {
    if (this.shownSessions.has(workspace.id) && this.shownOf(workspace).id === workspace.id) {
      this.shownSessions.delete(workspace.id);
    }
  }

  // Work that is thrown away does not end in a notification that it is ready.
  disarm(id) {
    this.tasked.delete(id);
    this.held.delete(id);
    const view = this.opened.get(id);

    if (view) {
      view.notifyWhenReady = false;
      view.clearReady();
    }
  }

  // The server sends a first task once the session is set up, and the user is told when it is done as for one typed here.
  followTasks() {
    for (const id of [...this.tasked]) {
      const session = this.sideSessions.find(item => item.id === id);

      if (!session || session.side.state === "Deleting") {
        this.disarm(id);
      } else if (session.side.state === "Ready") {
        this.tasked.delete(id);

        if (!session.side.error) {
          this.viewOf(session).notifyWhenReady = true;
        }
      }
    }
  }

  viewOf(info) {
    let view = this.opened.get(info.id);

    if (!view) {
      view = new WorkspaceView(this.connection, info, this);
      view.element.hidden = true;
      this.opened.set(info.id, view);
      this.content.append(view.element);
    }

    return view;
  }

  // History shows the branches of sessions by their names, which a rename changes without git changing.
  followRenames(before) {
    const renamed = new Set(this.sideSessions.filter(session => before.has(session.id) && before.get(session.id) !== session.side.name).map(session => session.side.parentId));

    for (const [id, view] of this.opened) {
      if (renamed.has(this.mainOf(id)) && view.history.loaded) {
        view.loadHistory(true);
      }
    }
  }

  // Puts the view of the session that is to be on screen there, when it is not already.
  swap() {
    if (!this.selected || this.activeId === this.shownOf(this.selected).id) {
      return;
    }

    this.active?.applySettings();

    // Only what is about the view that goes is closed with it; the rest may hold what is being typed.
    if (this.dialogHost.firstChild?.getAttribute("data-view")) {
      this.closeDialog();
    }

    this.activate(this.shownOf(this.selected));
  }

  activate(info) {
    for (const view of this.opened.values()) {
      view.element.hidden = true;
      view.blur();
    }

    this.activeId = info?.id ?? null;
    this.loopIndicator.hidden = true;
    this.limitIndicator.hidden = true;
    this.notifyButton.hidden = true;
    this.topbar.classList.remove("working");
    this.updateTitle();

    if (!info) {
      this.resources.sync();
      return;
    }

    const view = this.viewOf(info);
    view.info = info;
    view.updateSide(info);
    view.element.hidden = false;
    view.focus();
    this.resources.sync();
    view.showResources();
    this.updateWorking(view);
    this.updateLoop(view);
    this.updateLimit(view);
    this.updateNotify(view);
  }

  updateTitle() {
    const info = this.selected ? this.known(this.activeId) ?? this.selected : null;
    this.titleText.textContent = info ? workspaceName(info) : "Auto Remote";
    this.sessionsButton.disabled = !info;
    this.sideMarker.hidden = !info?.side;
    this.chevron.hidden = !info;
  }

  toggleSessions(open = this.sessionsWrap.hidden) {
    this.sessionsWrap.hidden = !open || !this.selected;
    this.sessionError.set(null);

    if (!open) {
      this.sessionExpanded = null;
    }

    this.renderSessions();
  }

  sessionStatus(session) {
    const states = { Creating: "Setting Up", Integrating: "Integrating", Deleting: "Deleting" };
    return states[session.side?.state] ?? (this.busy.has(session.id) ? "Working" : this.queued.has(session.id) ? "Queued" : this.looping.has(session.id) ? "Loop" : "Ready");
  }

  renderSessions() {
    const main = this.selected;
    const rows = main ? [main, ...this.sideSessions.filter(session => session.side.parentId === main.id)] : [];
    this.closeStaleSessionDialog(rows);

    if (!main) {
      this.sessionsWrap.hidden = true;
    }

    if (this.sessionsWrap.hidden) {
      return;
    }

    this.sessionRows.replaceChildren(...rows.map(session => {
      const side = session.side;
      const ready = side?.state === "Ready";
      const removable = ready || side?.state === "Creating";
      const status = this.sessionStatus(session);
      const detail = side?.integrateWhenFinished && ready ? `${status} - Integrates when finished` : status;
      const pick = h("button", { class: `pick${(this.activeId ?? main?.id) === session.id ? " on" : ""}`, disabled: !!side && !ready, onclick: () => { this.toggleSessions(false); this.showSession(session.id); } },
        h("div", { class: "name" }, ...(side ? [icon("session")] : []), h("span", {}, side ? side.name : "Main"), ...(this.busy.has(session.id) ? [h("span", { class: "dot" }, "●")] : [])),
        h("div", { class: "muted small" }, detail));
      const row = h("div", { class: "session-row" },
        pick,
        ...(side?.state === "Integrating" ? [h("button", { class: "small", onclick: () => this.beginCancelIntegration(session) }, "Cancel Integration")] : []),
        ...(side && removable ? [h("button", { class: "flat small", title: "Session actions", onclick: () => { this.sessionExpanded = this.sessionExpanded === session.id ? null : session.id; this.renderSessions(); } }, "⋯")] : []));

      if (!side || !removable || this.sessionExpanded !== session.id) {
        return row;
      }

      return h("div", {}, row, h("div", { class: "session-actions" },
        ...(ready ? [
          h("button", { onclick: () => this.beginIntegrate(session) }, "Integrate"),
          h("button", { onclick: () => this.switchWhenFinished(session) }, side.integrateWhenFinished ? "✓ Integrate When Finished" : "Integrate When Finished"),
          h("button", { onclick: () => this.showChangesOf(session.id) }, "Changes Since Session Start"),
          h("button", { onclick: () => this.beginRenameSession(session) }, "Rename")] : []),
        h("button", { class: "danger", onclick: () => this.beginDeleteSession(session) }, "Delete")));
    }));
  }

  showChangesOf(id) {
    this.toggleSessions(false);

    if (this.showSession(id)) {
      this.active.showSessionChanges();
    }
  }

  // A dialog about sessions: what it asks closes when the session it is about stops being what it was asked about.
  askSession({ title, body = null, controls = [], confirm, destructive = false, dismiss = "Cancel", id = null, holds = () => true, action, then, enter = false }) {
    this.dialogError.set(null);
    const failure = new ErrorLine();
    const go = h("button", { class: `${destructive ? "danger" : "primary"} block`, onclick: async () => {
      go.disabled = true;
      failure.set(null);

      try {
        const value = await action();

        if (this.dialogHost.firstChild === element) {
          this.closeDialog();
        }

        then?.(value);
      } catch (exception) {
        if (this.dialogHost.firstChild === element) {
          failure.set(exception.message);
        } else {
          this.active?.chatError.set(exception.message);
        }
      } finally {
        go.disabled = false;
      }
    } }, confirm);
    // Enter confirms only what asks for a name; what cannot be undone takes its button.
    const element = h("div", { class: "dialog", "data-button-only": enter ? undefined : "true" },
      h("h3", { class: "serif" }, title),
      body ? h("div", { class: "muted" }, body) : null,
      ...controls,
      failure.element,
      go,
      h("button", { class: "block", onclick: () => this.closeDialog() }, dismiss));
    this.sessionAsk = { element, id, holds, main: this.selected?.id };
    this.dialogHost.replaceChildren(element);
    this.dialogHost.hidden = false;
    this.dialogHost.querySelector("input[type=text]")?.focus();
  }

  closeStaleSessionDialog(rows) {
    const ask = this.sessionAsk;

    if (!ask || this.dialogHost.firstChild !== ask.element) {
      return;
    }

    const session = ask.id ? rows.find(row => row.id === ask.id) : null;

    if (ask.main !== this.selected?.id || ask.id && (!session || !ask.holds(session))) {
      this.closeDialog();
    }
  }

  beginNewSession() {
    const main = this.selected;

    if (!main) {
      return;
    }

    // Decided as the dialog opens and left alone after that: unfinished work of a busy AI is best left behind.
    const working = this.busy.has(main.id) || !!this.opened.get(main.id)?.working;
    const choice = (label, checked) => {
      const box = h("input", { type: "radio", name: "session-start", checked });
      return { box, element: h("label", { class: "check" }, box, label) };
    };
    const commit = choice("Current Commit", working);
    const files = choice("Current Files", !working);
    const name = h("input", { type: "text", placeholder: "Name" });
    const task = h("textarea", { rows: 3, placeholder: "Work the session starts on once it is set up" });
    let hasTask = false;
    const create = async () => {
      if (!name.value.trim()) {
        throw new RemoteError("Enter a name.");
      }

      const given = name.value.trim();
      const start = files.box.checked ? "Files" : "Commit";
      const first = task.value.trim();
      hasTask = !!first;

      // Browsers ask only while the user is clicking.
      if (hasTask) {
        requestNotifications();
      }

      // What was edited in main's settings applies to the session made next.
      const settings = this.opened.get(main.id);

      if (settings && !await settings.applySettings()) {
        throw new RemoteError("The workspace's settings could not be saved.");
      }

      return this.connection.createSideSession(main.id, given, start, first);
    };
    this.askSession({
      title: "New session",
      controls: [name,
        h("div", { class: "stack tight" },
          h("div", { class: "muted" }, "Starting files"),
          commit.element,
          files.element,
          h("div", { class: "muted small" }, "Current Files includes changes that are not committed, new files too."),
          h("div", { class: "muted", style: "margin-top:8px" }, "First Task (optional)"),
          task)],
      confirm: "Create Session",
      enter: true,
      action: create,
      then: made => this.awaitSession(made, hasTask)
    });
    name.addEventListener("keydown", event => { if (event.key === "Enter") { this.dialogHost.querySelector("button.primary")?.click(); } });
  }

  beginRenameSession(session) {
    const name = h("input", { type: "text", value: session.side.name });
    name.addEventListener("keydown", event => { if (event.key === "Enter") { this.dialogHost.querySelector("button.primary")?.click(); } });
    this.askSession({ title: "Rename session", controls: [name], confirm: "Rename", enter: true, id: session.id, action: () => name.value.trim() ? this.connection.renameSideSession(session.id, name.value.trim()) : Promise.reject(new RemoteError("Enter a name.")) });
  }

  beginDeleteSession(session) {
    this.askSession({ title: "Delete session?", body: `"${session.side.name}" and all of its changes will be permanently discarded.`, confirm: "Delete", destructive: true, id: session.id, action: () => { this.disarm(session.id); return this.connection.deleteSideSession(session.id); } });
  }

  beginIntegrate(session) {
    this.askSession({ title: "Integrate session?", body: `The main session's AI brings the changes of "${session.side.name}" into the main session, and the session is then permanently removed. This cannot be undone.`, confirm: "Integrate", id: session.id, holds: now => now.side.state === "Ready", action: () => this.connection.integrateSideSession(session.id) });
  }

  async switchWhenFinished(session) {
    if (session.side.integrateWhenFinished) {
      await attempt(() => this.connection.setIntegrateWhenFinished(session.id, false), this.sessionError);
      return;
    }

    this.askSession({ title: "Integrate When Finished?", body: `Once its AI marks its task complete and nothing of it runs any more, "${session.side.name}" is integrated into the main session by itself and permanently removed. This cannot be undone.`, confirm: "Turn On", id: session.id, holds: now => now.side.state === "Ready", action: () => this.connection.setIntegrateWhenFinished(session.id, true) });
  }

  beginCancelIntegration(session) {
    this.askSession({ title: "Cancel Integration?", body: "Main may already contain some of this session's changes. They will not be undone, and you may need to clean up main yourself. The AI may make a few more edits before it stops.", confirm: "Cancel Integration", dismiss: "Keep Integrating", id: session.id, holds: now => now.side.state === "Integrating", action: () => this.connection.cancelIntegration(session.id) });
  }

  // A new session is switched to as soon as it is set up, unless the user went somewhere else in the meantime.
  awaitSession(made, hasTask) {
    if (hasTask) {
      this.tasked.add(made.id);
    }

    if (this.selected && made.side?.parentId === this.selected.id) {
      this.awaited = made.id;
    }

    // The list may have said by now that the session is set up.
    if (this.sideSessions.some(session => session.id === made.id)) {
      this.followTasks();
      this.showAwaited();
    }
  }

  showAwaited() {
    const ready = this.awaited && this.sideSessions.find(session => session.id === this.awaited && session.side.state === "Ready");

    if (!ready) {
      return;
    }

    this.awaited = null;

    // Choosing a session meanwhile ends the wait, so only another workspace is left to look out for. The list would cover the session that was just made.
    if (this.selected?.id === ready.side.parentId && this.showSession(ready.id)) {
      this.toggleSessions(false);
    }
  }

  setOffline(offline) {
    this.topbar.classList.toggle("offline", offline);
  }

  async refreshCatalog() {
    if (this.refreshing) {
      this.refreshAgain = true;
      return;
    }

    this.refreshing = true;

    try {
      do {
        this.refreshAgain = false;
        let catalog;

        try {
          catalog = await this.listWorkspaces();
        } catch (exception) {
          return;
        }

        this.applyCatalog(catalog);
      } while (this.refreshAgain);
    } finally {
      this.refreshing = false;
    }
  }

  // The AI is told about a job whose remaining tasks wait on a lost one, so nothing of it is under way any more.
  isUnderWay(task) {
    return activeTaskStates.includes(task.state) && !(task.state === "Waiting" && this.swarmTasks.some(other => other.jobId === task.jobId && other.state === "Lost"));
  }

  async refreshSwarm() {
    if (this.refreshingSwarm) {
      this.refreshSwarmAgain = true;
      return;
    }

    this.refreshingSwarm = true;

    try {
      do {
        this.refreshSwarmAgain = false;
        let status;

        try {
          status = await this.connection.swarm("GetSwarm");
        } catch (exception) {
          return;
        }

        for (const task of status.tasks ?? []) {
          if (!activeTaskStates.includes(task.state) && this.followed.delete(task.id)) {
            this.announce(task.workspaceId, `Delegated task "${task.title}": ${task.state}`);
          }
        }

        this.swarmTasks = (status.tasks ?? []).filter(task => !task.isIncoming);

        // Tasks that were all discarded are never reported to the AI, so nothing more would end the wait.
        for (const id of [...this.held].filter(held => !this.swarmTasks.some(task => task.workspaceId === held && !task.isManual))) {
          this.held.delete(id);
          const view = this.opened.get(id);

          if (view) {
            view.notifyWhenReady = false;
          }
        }

        this.buildEntries();
        this.renderDrawer();
        this.updateNotify(this.active);
      } while (this.refreshSwarmAgain);
    } finally {
      this.refreshingSwarm = false;
    }
  }

  follow(taskIds) {
    taskIds.forEach(id => this.followed.add(id));
    this.refreshSwarm();
  }

  announce(workspaceId, message) {
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        const note = new Notification(message);
        note.onclick = () => {
          window.focus();
          this.app.showWorkspace(this, workspaceId);
          note.close();
        };
      }
    } catch (exception) {
    }
  }

  setDelegations(delegations) {
    this.delegations = new Map((delegations ?? []).map(delegation => [delegation.workspaceId, delegation]));

    for (const view of this.opened.values()) {
      view.applyState();
    }
  }

  applyCatalog(catalog) {
    const before = this.selected;
    const named = new Map(this.sideSessions.map(session => [session.id, session.side.name]));
    this.workspaces = catalog.workspaces;
    this.sideSessions = (catalog.sessions ?? []).filter(session => session.side);

    // Announced before the session's work is ended, which would otherwise be told as ready.
    for (const session of this.sideSessions.filter(item => item.side.state === "Deleting")) {
      this.disarm(session.id);
    }
    this.groups = catalog.groups;
    this.setBusy(catalog.busy);
    this.looping = new Set(catalog.looping ?? []);
    this.queued = new Set(catalog.queued ?? []);
    this.setDelegations(catalog.delegations);

    for (const id of [...this.expanded]) {
      if (!this.groups.some(group => group.id === id)) {
        this.expanded.delete(id);
      }
    }

    let reopen = false;

    for (const [id, view] of [...this.opened]) {
      const now = this.known(id);

      if (!now || now.folder !== view.info.folder || now.service !== view.info.service) {
        if (!now) {
          this.disarm(id);
        }

        view.dispose();
        view.element.remove();
        this.opened.delete(id);
        reopen = reopen || id === before?.id;

        if (id === this.activeId) {
          this.activeId = null;
        }
      } else {
        view.info = now;
        view.updateSide(now);
      }
    }

    this.followRenames(named);
    this.followTasks();
    this.buildEntries();
    this.renderDrawer();

    if (!before) {
      return;
    }

    const current = this.workspaces.find(workspace => workspace.id === before.id);

    if (!current) {
      this.select(null);
      this.setDrawer(true);
    } else if (reopen) {
      this.select(null);
      this.select(current);
    } else {
      this.selected = current;
    }

    if (this.selected) {
      // A session that went, or that is being integrated, gives way to the main one.
      this.forgetUnshowable(this.selected);

      this.swap();
      this.updateTitle();
      this.showAwaited();
      this.renderSessions();
    }
  }

  reconnected(connection) {
    this.connection.listeners.delete(this.catalogListener);
    this.connection = connection;
    connection.listeners.add(this.catalogListener);
    this.setOffline(false);
    this.refreshCatalog();
    this.refreshSwarm();
    // What is shown is from before the connection was lost.
    this.refreshUsage();

    for (const view of this.opened.values()) {
      view.reconnected(connection);
    }
  }

  setDrawer(open) {
    this.drawerOpen = open;
    this.drawer.hidden = !open;
    this.scrim.hidden = !open;
    this.resources.sync();
  }

  showResources() {
    for (const line of this.drawerList.querySelectorAll("[data-resources]")) {
      const id = line.getAttribute("data-resources");
      line.textContent = this.resources.brief(id, this.anySession(id, this.busy));
      line.hidden = line.textContent === "";
    }

    this.active?.showResources();
  }

  toggleUsage(open = this.usageWrap.hidden) {
    this.usageWrap.hidden = !open;
  }

  async showUsage(service) {
    if (service !== this.usageService) {
      this.usageService = service;
      this.usage = null;
      this.renderUsage();
    }

    clearInterval(this.usageTimer);
    this.usageTimer = null;

    if (!service) {
      return;
    }

    this.usageTimer = setInterval(() => this.refreshUsage(), 60000);
    await this.refreshUsage();
  }

  async refreshUsage() {
    const service = this.usageService;

    if (!service) {
      return;
    }

    try {
      const usage = await this.connection.getUsage(service);

      if (service === this.usageService) {
        this.usage = usage;
        this.renderUsage();
      }
    } catch (exception) {
    }
  }

  renderUsage() {
    const windows = this.usage?.windows ?? [];
    const shortest = windows.reduce((best, period) => !best || period.windowMinutes < best.windowMinutes ? period : best, null);
    this.usageButton.dataset.pace = shortest ? paceOf(shortest) : "Even";
    const section = period => {
      const value = h("div", { class: "value" }, `${Math.round(period.percentUsed)}% used`);
      value.dataset.pace = paceOf(period);
      const reset = resetText(period);
      return h("div", { class: "stack tight" }, h("div", { class: "muted" }, period.name), value, ...(reset ? [h("div", { class: "muted small" }, reset)] : []));
    };
    this.usageCard.replaceChildren(
      h("h3", { class: "serif" }, `${services[this.usageService ?? "ClaudeCode"].label} usage limits`),
      ...windows.map(section),
      ...(windows.length ? [] : [h("div", { class: "muted" }, "The service reports no usage limits.")]));
  }

  showLoopNext() {
    const view = this.active;

    if (!view || view.loop === null) {
      return;
    }

    const text = h("div", { class: "muted" }, view.loopNext());
    const timer = setInterval(() => {
      if (!this.dialogHost.contains(text)) {
        clearInterval(timer);
        return;
      }

      if (view.loop === null) {
        close();
        return;
      }

      text.textContent = view.loopNext();
    }, 1000);
    const close = () => {
      clearInterval(timer);
      this.closeDialog();
    };
    this.dialogError.set(null);
    this.dialogHost.replaceChildren(h("div", { class: "dialog", "data-view": view.info.id }, h("h3", { class: "serif" }, "Loop"), text, h("button", { class: "block", onclick: close }, "Close")));
    this.dialogHost.hidden = false;
  }

  showLimitPause() {
    const view = this.active;

    if (!view || view.limitPause === null) {
      return;
    }

    this.dialogError.set(null);
    this.dialogHost.replaceChildren(h("div", { class: "dialog", "data-view": view.info.id }, h("h3", { class: "serif" }, "Paused automatically"), h("div", { class: "muted" }, view.limitPauseText()), h("button", { class: "block", onclick: () => this.closeDialog() }, "Close")));
    this.dialogHost.hidden = false;
  }

  updateLimit(view) {
    if (view === this.active) {
      this.limitIndicator.hidden = view.limitPause === null;
      this.limitIndicator.title = view.limitPauseText();
    }
  }

  updateLoop(view) {
    if (view === this.active) {
      this.loopIndicator.hidden = view.loop === null;
      this.loopIndicator.title = view.loopTip();
      this.updateNotify(view);
    }
  }

  updateWorking(view) {
    if (view === this.active) {
      this.topbar.classList.toggle("working", view.state() !== "Ready");
      this.updateNotify(view);
    }
  }

  // The button shows where the browser can notify and the workspace has work that is not over, or its notification is on.
  updateNotify(view) {
    if (view && view === this.active) {
      const on = view.notifyWhenReady && !this.notificationsBlocked();
      this.notifyButton.hidden = !("Notification" in window) || !(view.notifyWhenReady || view.state() !== "Ready" || view.loop !== null || !!view.queue || view.hasActiveQueued() || view.hasTasksUnderWay());
      this.notifyButton.classList.toggle("on", on);
      this.notifyButton.title = on ? "You will be notified when this workspace is ready. Press to turn the notification off." : "Notify me when this workspace is ready";
    }
  }

  notificationsBlocked() {
    return "Notification" in window && Notification.permission === "denied";
  }

  async toggleNotify() {
    const view = this.active;

    if (!view) {
      return;
    }

    if (view.notifyWhenReady && !this.notificationsBlocked()) {
      this.held.delete(view.info.id);
      view.notifyWhenReady = false;
      return;
    }

    if (this.notificationsBlocked()) {
      view.chatError.set("Notifications are blocked for this page. Allow them in the browser's site settings to be notified.");
      return;
    }

    const asked = requestNotifications();
    view.notifyWhenReady = true;

    // One that is ready while tasks it delegated are under way waits for them as if it had been waited for all along.
    if (view.state() === "Ready" && view.hasTasksUnderWay()) {
      this.held.add(view.info.id);
    }

    await asked;
    this.updateNotify(view);
  }

  // States change often, so one heard while the list was on its way may be newer than what the list says.
  listWorkspaces() {
    this.busyHeard.clear();
    return this.connection.listWorkspaces();
  }

  markBusy(id, working) {
    if (working) {
      this.busy.add(id);
    } else {
      this.busy.delete(id);
    }
  }

  setBusy(busy) {
    this.busy = new Set(busy ?? []);

    for (const [id, working] of this.busyHeard) {
      this.markBusy(id, working);
    }
  }

  async start(focus = null, focusFirst = true) {
    const result = await attempt(() => this.listWorkspaces(), this.error);

    if (!result.ok) {
      return;
    }

    this.workspaces = result.value.workspaces;
    this.sideSessions = (result.value.sessions ?? []).filter(session => session.side);
    this.groups = result.value.groups;
    this.setBusy(result.value.busy);
    this.looping = new Set(result.value.looping ?? []);
    this.queued = new Set(result.value.queued ?? []);
    this.setDelegations(result.value.delegations);
    this.refreshSwarm();

    for (const id of [...this.expanded]) {
      if (!this.groups.some(group => group.id === id)) {
        this.expanded.delete(id);
      }
    }

    for (const [id, view] of [...this.opened]) {
      if (!this.known(id)) {
        this.disarm(id);
        view.dispose();
        view.element.remove();
        this.opened.delete(id);
      }
    }

    this.buildEntries();
    this.closeDialog();
    this.select(null);
    const first = focusFirst ? this.entries.find(entry => entry.workspace)?.workspace ?? null : null;
    const side = this.sideSessions.find(session => session.id === focus);

    if (side) {
      this.shownSessions.set(side.side.parentId, side.id);
    }

    this.select(this.workspaces.find(workspace => workspace.id === this.mainOf(focus)) ?? first);
    this.setDrawer(this.selected === null);
  }

  // Shows a workspace or one of its side sessions, as a notification of it asks.
  show(id) {
    const workspace = this.workspaces.find(item => item.id === this.mainOf(id));

    if (!workspace) {
      return false;
    }

    if (this.selected?.id !== workspace.id) {
      this.select(workspace);
    }

    this.showSession(id);
    this.toggleSessions(false);
    this.setDrawer(false);
    return true;
  }

  async reload() {
    const open = this.drawerOpen;
    await this.start(this.selected?.id ?? null);
    this.setDrawer(open || this.selected === null);
  }

  select(workspace) {
    if (this.selected?.id !== workspace?.id) {
      this.active?.applySettings();
    }

    const changed = this.selected?.id !== workspace?.id;
    this.selected = workspace;
    this.setDrawer(false);
    this.closeDialog();

    if (changed) {
      this.sessionsWrap.hidden = true;
      this.sessionExpanded = null;
    }

    this.empty.hidden = workspace !== null;
    this.tools.hidden = workspace === null;
    this.toggleUsage(false);
    this.showUsage(workspace?.service ?? null);

    if (workspace) {
      this.forgetUnshowable(workspace);
    }

    this.activate(workspace ? this.shownOf(workspace) : null);

    if (workspace) {
      let opened = false;

      for (let group = this.parentOf(workspace.groupId); group; group = this.parentOf(this.groups.find(item => item.id === group).parentId)) {
        opened = !this.expanded.has(group) || opened;
        this.expanded.add(group);
      }

      if (opened) {
        this.buildEntries();
      }
    }

    this.renderDrawer();
  }

  parentOf(id) {
    return id && this.groups.some(group => group.id === id) ? id : null;
  }

  children(parent) {
    return this.groups.filter(group => this.parentOf(group.parentId) === parent);
  }

  buildEntries() {
    this.entries = [];
    this.addEntries(null, 0, false);
  }

  get filtering() {
    return this.filter.trim() !== "";
  }

  matchesText(text) {
    return text.toLowerCase().includes(this.filter.trim().toLowerCase());
  }

  matchesWorkspace(workspace) {
    return this.matchesText(folderName(workspace.folder)) || this.matchesText(workspace.folder);
  }

  holdsMatch(id) {
    return this.workspaces.some(item => this.parentOf(item.groupId) === id && this.matchesWorkspace(item))
      || this.children(id).some(child => this.matchesText(child.name) || this.holdsMatch(child.id));
  }

  holdsBusy(id) {
    return this.workspaces.some(item => this.parentOf(item.groupId) === id && this.anySession(item.id, this.busy))
      || this.children(id).some(child => this.holdsBusy(child.id));
  }

  addEntries(parent, depth, showAll) {
    for (const group of this.children(parent)) {
      const shown = !this.filtering || showAll || this.matchesText(group.name);

      if (!shown && !this.holdsMatch(group.id)) {
        continue;
      }

      const collapsed = !this.filtering && !this.expanded.has(group.id);
      this.entries.push({ group, collapsed, depth });

      if (!collapsed) {
        this.addEntries(group.id, depth + 1, shown && this.filtering);
      }
    }

    for (const workspace of this.workspaces.filter(item => this.parentOf(item.groupId) === parent && (!this.filtering || showAll || this.matchesWorkspace(item))).sort((left, right) => this.anySession(right.id, this.busy) - this.anySession(left.id, this.busy) || this.anySession(right.id, this.looping) - this.anySession(left.id, this.looping) || (Date.parse(right.lastUpdated) || 0) - (Date.parse(left.lastUpdated) || 0) || folderName(left.folder).localeCompare(folderName(right.folder), undefined, { sensitivity: "base" }))) {
      this.entries.push({ workspace, depth });

      for (const task of this.swarmTasks.filter(item => this.mainOf(item.workspaceId) === workspace.id && (activeTaskStates.includes(item.state) || item.state === "Lost")).sort((left, right) => Date.parse(left.createdAt) - Date.parse(right.createdAt))) {
        this.entries.push({ task, depth: depth + 1 });
      }
    }
  }

  renderDrawer() {
    this.renderSessions();

    if (this.filtering && this.entries.length === 0) {
      this.drawerList.replaceChildren(h("div", { class: "muted", style: "padding:8px" }, "No workspaces match."));
      return;
    }

    this.drawerList.replaceChildren(...this.entries.map(entry => {
      const indent = `margin-left:${entry.depth * 18}px`;

      if (entry.group) {
        const group = entry.group;
        const tool = (label, title, action) => h("button", { class: "flat", title, onclick: event => { event.stopPropagation(); action(); } }, label);
        return h("div", { class: `row group${this.holdsBusy(group.id) ? " working" : ""}`, style: indent, onclick: () => this.toggleGroup(group.id) },
          h("div", { class: "name" }, `${entry.collapsed ? "▸" : "▾"} ${group.name}`),
          tool("▲", "Move up", () => this.shift(() => this.connection.shiftGroup(group.id, -1))),
          tool("▼", "Move down", () => this.shift(() => this.connection.shiftGroup(group.id, 1))),
          tool("✎", "Rename group", () => this.beginRenameGroup(group)),
          tool("↪", "Move group", () => this.beginMove(null, group)),
          tool("✕", "Delete group", () => this.beginDeleteGroup(group)));
      }

      if (entry.task) {
        return h("div", { class: "row", style: indent, onclick: () => this.app.showSwarm(this.connection, this, entry.task.id, this.mainOf(entry.task.workspaceId)) },
          h("div", { class: "name" }, `\u21B3 ${entry.task.title}`, h("small", {}, taskLine(entry.task))));
      }

      const workspace = entry.workspace;
      const delegatedBy = this.delegations.get(workspace.id)?.from;
      const detail = [this.anySession(workspace.id, this.queued) ? "Queued" : null, delegatedBy ? `Delegated by ${delegatedBy}` : null, workspace.folder].filter(part => part).join(" - ");
      const taken = this.resources.brief(workspace.id, this.anySession(workspace.id, this.busy));
      return h("div", { class: `row${this.anySession(workspace.id, this.busy) ? " working" : ""}${workspace.id === this.selected?.id ? " on" : ""}`, style: indent, onclick: () => this.select(workspace) },
        h("div", { class: "name" }, folderName(workspace.folder), ...(this.anySession(workspace.id, this.looping) ? [h("span", { class: "ws-loop", title: "A loop is running" }, icon("loop"))] : []), h("small", {}, detail), h("small", { "data-resources": workspace.id, hidden: taken === "" }, taken)),
        h("button", { class: "flat", title: "Move to a group", onclick: event => { event.stopPropagation(); this.beginMove(workspace, null); } }, "↪"));
    }));
  }

  toggleGroup(id) {
    if (this.filtering) {
      return;
    }

    if (!this.expanded.delete(id)) {
      this.expanded.add(id);
    }

    this.buildEntries();
    this.renderDrawer();
  }

  confirmHalt(view) {
    this.dialogError.set(null);
    const go = () => {
      this.closeDialog();
      view.halt(() => view.connection.stopWorkspace(view.info.id));
    };
    this.haltView = view;
    this.haltNote = h("div", { class: "muted" });
    this.updateHaltNote(view);
    this.haltDialog = h("div", { class: "dialog", "data-view": view.info.id },
      h("h3", { class: "serif" }, "Stop the work?"),
      this.haltNote,
      h("button", { class: "primary block", onclick: go }, "Stop"),
      this.dialogError.element,
      h("button", { class: "block", onclick: () => this.closeDialog() }, "Keep Working"));
    this.dialogHost.replaceChildren(this.haltDialog);
    this.dialogHost.hidden = false;
  }

  updateHaltNote(view) {
    if (view === this.haltView) {
      const delegation = view.delegation();
      this.haltNote.textContent = delegation ? `This cancels the task delegated by ${delegation.from}, which is told.` : "";
      this.haltNote.hidden = !delegation;
    }
  }

  closeHaltDialogUnlessRunning(state) {
    if (this.haltDialog && this.dialogHost.firstChild === this.haltDialog && state !== "Working" && state !== "Managing") {
      this.closeDialog();
    }
  }

  dialogKey(event) {
    if (event.key === "Escape" && this.dialogHost.hidden && !this.sessionsWrap.hidden && !event.defaultPrevented) {
      event.preventDefault();
      this.toggleSessions(false);
      return;
    }

    if (this.dialogHost.hidden || event.defaultPrevented || event.isComposing) {
      return;
    }

    if (event.key === "Escape") {
      event.preventDefault();
      this.closeDialog();
    } else if (event.key === "Enter" && !this.dialogHost.firstChild?.getAttribute("data-button-only") && !["INPUT", "TEXTAREA", "BUTTON", "SELECT"].includes(event.target.tagName)) {
      const submit = this.dialogHost.querySelector("button.primary");

      if (submit) {
        event.preventDefault();
        submit.click();
      }
    }
  }

  closeDialog() {
    this.dialogHost.hidden = true;
    this.dialogHost.replaceChildren();
    this.dialogError.set(null);
  }

  dialog(title, body, ...controls) {
    this.dialogError.set(null);
    this.dialogHost.replaceChildren(h("div", { class: "dialog" },
      h("h3", { class: "serif" }, title),
      body ? h("div", { class: "muted" }, body) : null,
      ...controls,
      this.dialogError.element,
      h("button", { class: "block", onclick: () => this.closeDialog() }, "Cancel")));
    this.dialogHost.hidden = false;
    this.dialogHost.querySelector("input[type=text]")?.focus();
  }

  refuseEdit() {
    if (this.active && this.active.state() !== "Ready") {
      this.notice("Workspace busy", "Wait for the work in this workspace to finish first.");
      return true;
    }

    return false;
  }

  notice(title, body) {
    this.dialogError.set(null);
    this.dialogHost.replaceChildren(h("div", { class: "dialog" },
      h("h3", { class: "serif" }, title),
      h("div", { class: "muted" }, body),
      h("button", { class: "primary block", onclick: () => this.closeDialog() }, "OK")));
    this.dialogHost.hidden = false;
  }

  nameBox(text, confirm) {
    return h("input", { type: "text", value: text, onkeydown: event => { if (event.key === "Enter") { confirm(); } } });
  }

  async shift(action) {
    const result = await attempt(async () => { await action(); return this.listWorkspaces(); }, this.error);

    if (result.ok) {
      this.workspaces = result.value.workspaces;
      this.sideSessions = (result.value.sessions ?? []).filter(session => session.side);
      this.groups = result.value.groups;
      this.setBusy(result.value.busy);
      this.looping = new Set(result.value.looping ?? []);
      this.queued = new Set(result.value.queued ?? []);
      this.setDelegations(result.value.delegations);
      this.buildEntries();
      this.renderDrawer();
    }
  }

  async submit(action, afterwards) {
    const result = await attempt(action, this.dialogError);

    if (result.ok) {
      await afterwards(result.value);
    }
  }

  async beginRelocate() {
    const workspace = this.selected;

    if (!workspace || this.refuseEdit() || this.active && !await this.active.applySettings()) {
      return;
    }

    this.app.showMoveWorkspace(this.connection, this, workspace);
  }

  beginRename() {
    const workspace = this.selected;

    if (!workspace) {
      return;
    }

    if (this.refuseEdit()) {
      return;
    }

    const confirm = () => {
      const name = box.value;

      if (!name.trim()) {
        this.dialogError.set("Enter a name.");
        return;
      }

      this.submit(() => this.connection.renameWorkspace(workspace.id, name), renamed => this.start(renamed.id));
    };
    const box = this.nameBox(folderName(workspace.folder), confirm);
    this.dialog("Rename workspace", null, box, h("button", { class: "primary block", onclick: confirm }, "Rename"));
  }

  beginDelete() {
    const workspace = this.selected;

    if (!workspace) {
      return;
    }

    if (this.refuseEdit()) {
      return;
    }

    const folder = h("input", { type: "checkbox", checked: true });
    this.dialog("Delete workspace?", `${folderName(workspace.folder)} will be removed from the server.`,
      ...(this.sideSessions.some(session => session.side.parentId === workspace.id) ? [h("div", { class: "muted" }, "Its side sessions and their changes are permanently deleted too.")] : []),
      h("label", { class: "check" }, folder, "Also delete the workspace folder and everything in it"),
      h("button", { class: "danger block", onclick: () => this.submit(() => this.connection.deleteWorkspace(workspace.id, folder.checked), () => this.start()) }, "Delete"));
  }

  beginNewGroup() {
    const confirm = () => {
      const name = box.value;

      if (!name.trim()) {
        this.dialogError.set("Enter a name.");
        return;
      }

      this.submit(() => this.connection.createGroup(name, picker.value()), () => { const parent = picker.value(); if (parent) { this.expanded.add(parent); } return this.reload(); });
    };
    const box = this.nameBox("", confirm);
    const picker = groupPicker(this.groups, "Create inside");
    this.dialog("New group", null, box, picker.element, h("button", { class: "primary block", onclick: confirm }, "Create"));
  }

  beginRenameGroup(group) {
    const confirm = () => {
      const name = box.value;

      if (!name.trim()) {
        this.dialogError.set("Enter a name.");
        return;
      }

      this.submit(() => this.connection.renameGroup(group.id, name), () => this.reload());
    };
    const box = this.nameBox(group.name, confirm);
    this.dialog("Rename group", null, box, h("button", { class: "primary block", onclick: confirm }, "Rename"));
  }

  beginDeleteGroup(group) {
    this.dialog("Delete group?", `${group.name} will be removed. What is in it moves up a level.`,
      h("button", { class: "danger block", onclick: () => this.submit(() => this.connection.deleteGroup(group.id), () => this.reload()) }, "Delete"));
  }

  descendants(id) {
    return this.groups.filter(group => group.parentId === id).flatMap(child => [child.id, ...this.descendants(child.id)]);
  }

  destinations(parent, path, blocked, into) {
    for (const group of this.children(parent).filter(item => !blocked.has(item.id))) {
      const name = path ? `${path} / ${group.name}` : group.name;
      into.push({ id: group.id, name });
      this.destinations(group.id, name, blocked, into);
    }

    return into;
  }

  beginMove(workspace, group) {
    const blocked = new Set(group ? [group.id, ...this.descendants(group.id)] : []);
    const choices = this.destinations(null, "", blocked, [{ id: null, name: "Top level" }]);
    const current = workspace ? workspace.groupId ?? null : group.parentId ?? null;
    const select = h("select", {}, choices.map((choice, index) => h("option", { value: index }, choice.name)));
    select.value = Math.max(0, choices.findIndex(choice => choice.id === current));
    const name = workspace ? folderName(workspace.folder) : group.name;
    const text = name;
    const apply = () => {
      const destination = choices[Number(select.value)].id;
      return workspace ? this.connection.moveWorkspace(workspace.id, destination) : this.connection.moveGroup(group.id, destination);
    };
    this.dialog(workspace ? "Move workspace" : "Move group", text, select, h("button", { class: "primary block", onclick: () => this.submit(apply, () => this.reload()) }, "Move"));
  }

  dispose() {
    this.resources.dispose();
    document.removeEventListener("keydown", this.dialogKeyListener);
    this.connection.listeners.delete(this.catalogListener);

    for (const view of this.opened.values()) {
      view.dispose();
    }

    this.opened.clear();
  }
}

function groupPicker(groups, label = "Group") {
  const choices = [{ id: "", name: "Top level" }];
  const add = (parent, path) => {
    for (const group of groups.filter(item => (groups.some(other => other.id === item.parentId) ? item.parentId : null) === parent)) {
      const name = path ? `${path} / ${group.name}` : group.name;
      choices.push({ id: group.id, name });
      add(group.id, name);
    }
  };
  add(null, "");
  const select = h("select", {}, choices.map(choice => h("option", { value: choice.id }, choice.name)));
  return { element: h("div", { class: "stack tight", style: "margin-top:8px" }, h("div", { class: "muted" }, label), select), value: () => select.value || undefined };
}

function providerPicker(connection) {
  const select = h("select", {}, Object.entries(services).map(([key, service]) => h("option", { value: key }, service.label)));
  const key = h("input", { type: "password", placeholder: "API key for just this workspace (optional)", autocomplete: "off", autocapitalize: "off", spellcheck: false });
  const sync = () => { key.hidden = !services[select.value].takesKey; };
  let chosen = false;
  select.onchange = () => {
    chosen = true;
    sync();
  };
  sync();

  return {
    element: h("div", { class: "stack tight" },
      h("div", { class: "muted" }, "AI provider"),
      select,
      key),
    service: () => select.value,
    key: () => services[select.value].takesKey && key.value.trim() ? key.value.trim() : undefined,
    async load() {
      try {
        const environment = await connection().getAiEnvironment();

        if (!chosen && environment?.defaultService in services) {
          select.value = environment.defaultService;
          sync();
        }
      } catch (exception) {
      }
    }
  };
}

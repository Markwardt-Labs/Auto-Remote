<style>
:root {
  --background: #1E1E1E;
  --surface: #252526;
  --elevated: #2D2D2D;
  --border: #3C3C3C;
  --hover: #2A2D2E;
  --selection: #094771;
  --text: #CCCCCC;
  --muted: #969696;
  --accent: #007ACC;
  --accent-hover: #1F8AD2;
  --working: #007ACC;
  --on-working: #FFFFFF;
  --danger: #C74E39;
  --warning: #D7A52B;
  --scrim: #00000099;
  --pace-very-low: #6FBF73;
  --pace-low: #569CD6;
  --pace-high: #E0A458;
  --pace-very-high: #E57373;
  --git-added: #73C991;
  --git-modified: #E2C08D;
  --diff-added: #1E4620;
  --diff-removed: #4B1E1E;
  --syn-keyword: #569CD6;
  --syn-string: #CE9178;
  --syn-comment: #6A9955;
  --syn-number: #B5CEA8;
  --syn-function: #DCDCAA;
  --syn-type: #4EC9B0;
  --syn-property: #9CDCFE;
  --syn-tag: #569CD6;
  --syn-variable: #9CDCFE;
  --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--background); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#app { height: 100dvh; display: flex; flex-direction: column; }
.serif { font-weight: 600; margin: 0; }
.muted { color: var(--muted); }
.error { color: var(--danger); overflow-wrap: anywhere; }
.small { font-size: 12px; }

button, input, textarea, select { font: inherit; color: inherit; }
button { background: var(--hover); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--selection); }
button:disabled { opacity: .5; cursor: default; }
button.flat { background: transparent; border: 0; }
button.flat:hover:not(:disabled) { background: var(--hover); }
button.primary { background: var(--accent); color: #fff; border: 0; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); }
button.primary:disabled { background: var(--elevated); color: var(--muted); opacity: 1; }
button.danger { background: var(--danger); color: #fff; border: 0; }
button.danger:hover:not(:disabled) { background: #D9604B; }
button.block { width: 100%; text-align: center; }
input[type=text], input[type=password], textarea, select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; min-height: 40px; outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
label.check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 8px; }
.progress { height: 4px; background: var(--elevated); border-radius: 2px; overflow: hidden; position: relative; }
.progress::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); animation: slide 1.1s infinite ease-in-out; }
@keyframes slide { from { left: -40%; } to { left: 100%; } }

.connect { flex: 1; overflow-y: auto; }
.connect .form { max-width: 440px; margin: 0 auto; padding: 48px 24px; min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.connect h1 { font-size: 34px; text-align: center; }
.connect .sub { text-align: center; margin-bottom: 18px; }
.connect .trust { text-align: center; margin-top: 8px; overflow-wrap: anywhere; }
.connect a { color: var(--accent-hover); }

.home { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.topbar { display: flex; align-items: center; padding: 8px; gap: 8px; background: var(--elevated); border-bottom: 1px solid var(--border); }
.topbar .menu { font-size: 20px; width: 48px; padding: 8px 0; margin-right: 96px; }
.topbar .title { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; white-space: nowrap; overflow: hidden; }
.topbar .tools { display: flex; width: 144px; justify-content: flex-end; }
.topbar .gear, .topbar .usage { width: 48px; font-size: 20px; padding: 8px 0; display: flex; align-items: center; justify-content: center; }
@media (max-width: 600px) {
  .topbar .menu { margin-right: 48px; }
  .topbar .tools { width: 96px; }
}
.usage[data-pace=VeryLow], .usage-card [data-pace=VeryLow] { color: var(--pace-very-low); }
.usage[data-pace=Low], .usage-card [data-pace=Low] { color: var(--pace-low); }
.usage[data-pace=High], .usage-card [data-pace=High] { color: var(--pace-high); }
.usage[data-pace=VeryHigh], .usage-card [data-pace=VeryHigh] { color: var(--pace-very-high); }
.topbar.working .usage[data-pace=Low] { color: var(--on-working); }
.usage-wrap { position: absolute; inset: 0; z-index: 12; }
.usage-card { position: absolute; top: 56px; right: 8px; width: min(300px, calc(100% - 16px)); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.usage-card h3 { font-size: 16px; margin: 0; }
.usage-card .value { font-size: 18px; }
.topbar button:hover:not(:disabled) { background: #ffffff40; }
.topbar.working { background: var(--working); color: var(--on-working); border-bottom-color: var(--working); }
.topbar.working button { color: var(--on-working); }
.topbar.working button:hover:not(:disabled) { background: #ffffff40; }
.content { flex: 1; min-height: 0; position: relative; }
.empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 32px; text-align: center; }
.empty h2 { font-size: 24px; }

.workspace { position: absolute; inset: 0; }
.panels { position: absolute; inset: 0; display: flex; }
.panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.panel.files { flex: 0 0 14.3%; min-width: 120px; background: var(--surface); }
.panel.content { flex: 0 0 42.85%; min-width: 160px; }
.panel.chat { flex: 1 1 0; min-width: 240px; }
.separator { flex: none; width: 1px; touch-action: none; position: relative; z-index: 1; background: var(--border); }
.separator::before { content: ""; position: absolute; inset: 0 -2px; cursor: col-resize; }
.placeholder { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; }
.pane { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; background: var(--background); }
.pane-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tabs { display: flex; flex: none; }
.tabs button { flex: 1; background: var(--elevated); border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 7px 12px; font-size: 12px; }
.tabs button:hover:not(:disabled) { background: var(--hover); }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); background: var(--background); }
.script-pick { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--elevated); border-bottom: 1px solid var(--border); }
.script-pick select { flex: 1; min-height: 32px; padding: 4px 8px; }
.script-children { display: flex; gap: 2px; padding: 4px 6px; background: var(--elevated); border-bottom: 1px solid var(--border); overflow-x: auto; }
.script-children button { background: transparent; border: 0; font-size: 11px; padding: 4px 8px; white-space: nowrap; }
.script-children button.on { background: var(--selection); }
.script-bar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--elevated); }
.script-bar .spacer { flex: 1; }
.script-bar button { font-size: 11px; padding: 4px 8px; min-height: 0; }
.script-bar .state { font-size: 11px; }
.script-bar .state.ok { color: var(--accent); }
.script-bar .state.bad { color: crimson; }
.script-scroll { flex: 1; min-height: 0; overflow: auto; position: relative; display: flex; flex-direction: column; }
.script-output { margin: 0; padding: 10px 14px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px Menlo, Consolas, "DejaVu Sans Mono", monospace; user-select: text; }
.script-input { display: flex; gap: 8px; padding: 6px 10px; background: var(--elevated); border-top: 1px solid var(--border); }
.script-input input { flex: 1; }
.row.running .name { font-weight: 700; }
.topbar .title .loop-indicator { display: inline-flex; flex: none; margin-left: 4px; }
.topbar .title .limit-indicator { color: var(--warning); }
.topbar .title .notify.on { background: #ffffff30; }
.topbar .title .notify.on path { fill: currentColor; }
.selectable { user-select: text; }
.swarm-code { font-family: monospace; font-size: 16px; overflow-wrap: anywhere; }
.swarm-pairing { border: 1px solid var(--accent); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.swarm-tasks button { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 10px 6px; color: inherit; cursor: pointer; }
.swarm-tasks button:hover { background: var(--hover, rgba(128, 128, 128, 0.15)); }
.swarm-detail-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.swarm-detail-view[hidden] { display: none; }
.swarm-detail-view header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.swarm-detail { display: flex; flex-direction: column; gap: 8px; }
.swarm-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.swarm-work { opacity: 0.6; font-size: 12px; }
.swarm-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
.queue-banner { display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; font-size: 12px; background: var(--elevated); border-bottom: 1px solid var(--accent); flex: none; }
.queue-banner[hidden] { display: none; }
.queue-banner .info { flex: 1; min-width: 0; }
.queue-banner .prompt { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
.limit-banner { display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; font-size: 12px; background: var(--elevated); border-bottom: 1px solid var(--warning); flex: none; }
.limit-banner svg { flex: none; margin-top: 1px; color: var(--warning); }
.limit-banner > div { flex: 1; }
.limit-banner button { flex: none; font-size: 12px; padding: 2px 8px; }
.limit-banner[hidden] { display: none; }
.paused-banner, .loop-banner { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 12px; background: var(--elevated); flex: none; }
.paused-banner { border-bottom: 1px solid var(--warning); }
.loop-banner { border-bottom: 1px solid var(--accent); }
.paused-banner[hidden], .loop-banner[hidden] { display: none; }
.paused-banner .info, .loop-banner > div { flex: 1; min-width: 0; }
.paused-banner button { flex: none; font-size: 12px; padding: 5px 10px; }
.loop-banner svg { flex: none; }
.row-check { display: flex; align-items: center; gap: 6px; cursor: pointer; }

function detectSyntax(path, text) {
  const file = path.slice(Math.max(path.lastIndexOf("/"), path.lastIndexOf("\\")) + 1).toLowerCase();
  let name = null;

  if (syntaxNames[file]) {
    name = syntaxNames[file];
  } else if (file === ".env" || file.startsWith(".env.")) {
    name = "env";
  } else if (file.startsWith("dockerfile.")) {
    name = "dockerfile";
  } else if (file.includes(".") && syntaxExtensions[file.slice(file.lastIndexOf(".") + 1)]) {
    name = syntaxExtensions[file.slice(file.lastIndexOf(".") + 1)];
  }

  return syntaxLanguages[name ?? sniffSyntax(text)] ?? null;
}

function sniffSyntax(text) {
  const end = text.indexOf("\n");
  const first = (end < 0 ? text : text.slice(0, end)).replace(/^﻿/, "").trim();

  if (first.startsWith("#!")) {
    if (first.includes("python")) { return "py"; }
    if (first.includes("node") || first.includes("deno") || first.includes("bun")) { return "js"; }
    if (first.includes("ruby")) { return "rb"; }
    if (first.includes("perl")) { return "pl"; }
    if (first.includes("php")) { return "php"; }
    if (first.includes("pwsh") || first.includes("powershell")) { return "ps1"; }
    return first.includes("sh") ? "sh" : null;
  }

  const lower = first.toLowerCase();

  if (lower.startsWith("<?xml")) {
    return "xml";
  }

  return lower.startsWith("<!doctype html") || lower.startsWith("<html") ? "html" : null;
}

  const tokens = [];

  if (language) {
    scanSyntax(language, text, 0, text.length, tokens);
  }

  return tokens;

function scanSyntax(language, text, start, end, tokens) {
  if (language.markup) {
    scanMarkup(language, text, start, end, tokens);
  } else if (language.delimiter !== null) {
    scanDelimited(language.delimiter, text, start, end, tokens);
  } else {

const isWordChar = c => /[\p{L}\p{N}_]/u.test(c);

function scanDelimited(delimiter, text, start, end, tokens) {

      i++;

        } else {

        }

      i = close;
    } else {
      let stop = i;

      while (stop < end && text[stop] !== delimiter && text[stop] !== "\n" && text[stop] !== "\r") {

      } else if (syntaxNumber.test(text.slice(i, stop).trim())) {

function scanMarkup(language, text, start, end, tokens) {
  let i = start;

  while (i < end) {
    const open = text.indexOf("<", i);

    if (open < 0 || open >= end) {
      return;
    }

    if (startsAt(text, open, end, "<!--")) {
      const close = text.indexOf("-->", open + 4);

    const closing = nameStart < end && text[nameStart] === "/";

      continue;

    let j = nameStart;

    while (j < end && (isWordChar(text[j]) || ":.-".includes(text[j]))) {
      j++;

    const name = text.slice(nameStart, j);
    tokens.push(["tag", nameStart, j - nameStart]);
    let afterEquals = false;

    while (j < end && text[j] !== ">") {

function syntaxNodes(path, text) {
  const nodes = [];
  let position = 0;

  for (const [kind, start, length] of highlightSyntax(path, text)) {
    if (start > position) {
      nodes.push(text.slice(position, start));
    }

    nodes.push(h("span", { class: `syn-${kind}` }, text.slice(start, start + length)));
    position = start + length;
  }

  nodes.push(text.slice(position));
  return nodes;
}

class Diagrams {
  constructor(connection) {
    this.connection = connection;
    this.drawn = new Map();
    this.drawing = new Map();
  }

  block(source) {
    const text = source.trim();
    const host = h("div", { class: "mddiagram" });

    if (this.drawn.has(text)) {
      host.append(this.picture(this.drawn.get(text)));
      return host;
    }

    const button = h("button", { type: "button" }, "Show Diagram");
    button.addEventListener("click", () => {
      host.replaceChildren(h("div", { class: "muted small" }, "Drawing the diagram..."));
      this.draw(text).then(
        svg => host.replaceChildren(this.picture(svg)),
        error => host.replaceChildren(h("div", { class: "error small" }, error.message), h("pre", { class: "mdcode" }, h("code", {}, source))));
    });
    host.append(button);
    return host;
  }

  draw(text) {
    if (this.drawing.has(text)) {
      return this.drawing.get(text);
    }

    const task = this.connection.renderDiagram(text).then(svg => {
      if (this.drawn.size >= 16) {
        this.drawn.clear();
      }

      this.drawn.set(text, svg);
      return svg;
    }).finally(() => this.drawing.delete(text));
    this.drawing.set(text, task);
    return task;
  }

  picture(svg) {
    const image = h("img", { alt: "Diagram", src: `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}` });
    const scroller = h("div", { class: "mdscroll" }, image);
    const reset = h("button", { type: "button", title: "Reset Zoom" }, "100%");
    const smaller = h("button", { type: "button", title: "Zoom Out" }, "-");
    const larger = h("button", { type: "button", title: "Zoom In" }, "+");
    let zoom = 1;
    let natural = null;
    const apply = value => {
      zoom = Math.min(4, Math.max(0.25, value));
      reset.textContent = `${Math.round(zoom * 100)}%`;

      if (natural) {
        image.style.width = `${natural.width * zoom}px`;
        image.style.height = `${natural.height * zoom}px`;
      }
    };

    image.addEventListener("load", () => {
      natural = { width: image.naturalWidth, height: image.naturalHeight };
      apply(zoom);
    });
    smaller.addEventListener("click", () => apply(zoom / 1.25));
    larger.addEventListener("click", () => apply(zoom * 1.25));
    reset.addEventListener("click", () => apply(1));
    scroller.addEventListener("wheel", event => {
      if (event.ctrlKey) {
        event.preventDefault();
        apply(event.deltaY < 0 ? zoom * 1.25 : zoom / 1.25);
      }
    }, { passive: false });
    return h("div", { class: "mdpicture" }, h("div", { class: "mdzoom" }, smaller, reset, larger), scroller);
  }
}

function renderMarkdown(source, folds, diagrams) {
  const root = h("div", { class: "md" });
  markdownBlocks(source.replace(/\r\n?/g, "\n").split("\n"), root, diagrams);

  if (folds) {
    foldMarkdown(root, folds);
  }

  return root;
}

function foldMarkdown(root, folds) {
  const open = [];
  const sections = [];
  const headings = [];
  const siblings = new Map();

  for (const node of [...root.childNodes]) {
    const level = /^H([1-6])$/.exec(node.tagName)?.[1];

    if (!level) {
      (open.at(-1)?.body ?? root).append(node);
      continue;
    }

    while (open.length > 0 && open.at(-1).level >= Number(level)) {
      open.pop();
    }

    const index = sections.length;
    const parent = open.at(-1)?.index ?? -1;
    const depth = open.length;
    siblings.set(parent, (siblings.get(parent) ?? 0) + 1);
    const toggle = h("button", { class: "flat mdfold", onclick: () => folds.toggle(index) });
    const number = h("span", { class: "mdnum" });
    const head = h("div", { class: "mdhead" }, toggle, number, node);
    const body = h("div", { class: "mdbody", style: `--indent:${Math.max(6, 16 - 2 * depth)}px` });
    const section = h("div", { class: `mdsec l${level}` }, head, body);
    section.toggle = toggle;
    section.head = head;
    section.number = number;
    (open.at(-1)?.body ?? root).append(section);
    open.push({ level: Number(level), body, section, index });
    sections.push(section);
    headings.push({ index, title: node.textContent.trim(), level: Number(level), depth, parent, own: siblings.get(parent) });
  }

  const titled = headings.length > 1 && headings.filter(heading => heading.parent < 0).length === 1;

  for (const heading of headings) {
    const parentNumber = heading.parent >= 0 ? headings[heading.parent].number : "";
    heading.number = titled && heading.index === 0 ? "" : parentNumber === "" ? String(heading.own) : `${parentNumber}.${heading.own}`;
    sections[heading.index].number.textContent = heading.number;
  }

  folds.sections = sections;
  folds.headings = headings;
  folds.apply();
}

function folderName(folder) {
  const trimmed = folder.replace(/[\\/]+$/, "");
  const name = trimmed.split(/[\\/]/).pop();
  return name || folder;

class RemoteError extends Error {
  constructor(message, overLimit) {
    super(message);
    this.overLimit = overLimit ?? null;
  }
}

class Connection {
  constructor(socket) {
    this.socket = socket;
    this.nextId = 1;
    this.pending = new Map();
    this.listeners = new Set();
    this.onclose = null;
    this.closed = false;
    socket.onmessage = message => this.receive(message.data);
    socket.onclose = () => this.fail();
    socket.onerror = () => this.fail();
  }

  static open(settings) {
    const url = `wss://${settings.host.includes(":") && !settings.host.startsWith("[") ? `[${settings.host}]` : settings.host}:${settings.port}`;

    return new Promise((resolve, reject) => {
      let socket;
      let opened = false;
      log(`Connecting to ${url}`);

      try {
        socket = new WebSocket(url);
      } catch (exception) {
        log(`Connection to ${url} failed: ${exception.message}`);
        reject(new Error(`Could not connect to ${url}.`));
        return;
      }

      let settled = false;
      const finish = (action, value) => {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          log(action === resolve ? `Connected to ${url}` : `Connection to ${url} failed ${opened ? "during the key handshake" : "before the WebSocket opened"}: ${value.message}`);
          action(value);
        }
      };
      const timer = setTimeout(() => {
        socket.close();
        finish(reject, new Error(`Timed out connecting to ${url}.`));
      }, 8000);

      socket.onopen = () => {
        opened = true;
        log(`WebSocket and TLS established with ${url}`);
        socket.send(JSON.stringify({ accessKey: settings.accessKey }));
      };
      socket.onerror = () => finish(reject, new Error(`Could not connect to ${url}. If the server uses a self-signed certificate, open https://${url.slice(6)} once and accept it.`));
      socket.onclose = () => finish(reject, new Error(`The server at ${url} closed the connection.`));
      socket.onmessage = message => {
        let reply = null;

        try {
          reply = JSON.parse(message.data);
        } catch (exception) {
        }

        if (reply && reply.accepted === true) {
          finish(resolve, new Connection(socket));
        } else {
          socket.onclose = null;
          socket.close();
          finish(reject, new Error("The server refused the access key."));
        }
      };
    });
  }

  receive(data) {
    let response;

    try {
      response = JSON.parse(data);
    } catch (exception) {
      return;
    }

    if (response.id === 0 && response.event) {
      for (const listener of [...this.listeners]) {
        listener(response.event);
      }

      return;
    }

    const request = this.pending.get(response.id);

    if (request) {
      this.pending.delete(response.id);

      if (response.error) {
        request.reject(new RemoteError(response.error, response.overLimit));
      } else {
        request.resolve(response);
      }
    }
  }

  drop() {
    try {
      this.socket.close();
    } catch (exception) {
    }

    this.fail();
  }

  fail() {
    if (this.closed) {
      return;
    }

    this.closed = true;
    log("Connection to the server was lost");

    for (const request of this.pending.values()) {
      request.reject(new Error("The connection to the server was lost."));
    }

    this.pending.clear();

    if (this.onclose) {
      this.onclose();
    }
  }

  request(command, fields = {}) {
    if (this.closed || this.socket.readyState !== WebSocket.OPEN) {
      return Promise.reject(new Error("The connection to the server was lost."));
    }

    const id = this.nextId++;

    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      this.socket.send(JSON.stringify({ id, command, ...fields }));
    });
  }

  close() {
    this.onclose = null;
    this.closed = true;
    this.socket.close();
  }

let audio = null;

function unlockAudio() {
  audio ??= new (window.AudioContext ?? window.webkitAudioContext)();
  audio.resume();
}

for (const name of ["pointerdown", "keydown"]) {
  document.addEventListener(name, unlockAudio, { once: true, capture: true });
}

function ding() {
  if (audio === null || audio.state !== "running") {
    return;
  }

  const start = audio.currentTime;
  const master = audio.createGain();
  master.gain.value = 0.35;
  master.connect(audio.destination);

  for (const [frequency, level, decay] of [[880, 1, 5], [1320, 0.45, 7], [2640, 0.2, 10]]) {
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(level, start + 0.005);
    gain.gain.setTargetAtTime(0, start + 0.005, 1 / decay);
    oscillator.connect(gain).connect(master);
    oscillator.start(start);
    oscillator.stop(start + 0.8);
  }
}

async function attempt(action, errors) {
  errors.set(null);

  try {
    return { ok: true, value: await action() };
  } catch (exception) {
    errors.set(exception.message);
    return { ok: false };
  }
}

async function recordingToWav(blob) {
  const rate = 16000;
  const context = new AudioContext();
  let decoded;

  try {
    decoded = await context.decodeAudioData(await blob.arrayBuffer());
  } finally {
    context.close();
  }

  const offline = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * rate)), rate);
  const source = offline.createBufferSource();
  source.buffer = decoded;
  source.connect(offline.destination);
  source.start();
  const samples = (await offline.startRendering()).getChannelData(0);
  const view = new DataView(new ArrayBuffer(44 + samples.length * 2));
  const text = (at, value) => [...value].forEach((c, i) => view.setUint8(at + i, c.charCodeAt(0)));
  text(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  text(8, "WAVEfmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  text(36, "data");
  view.setUint32(40, samples.length * 2, true);
  samples.forEach((sample, i) => view.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, sample)) * 32767), true));
  return new Blob([view], { type: "audio/wav" });
}

function splitAttachments(text) {
  const prefix = "Attached file: ";
  const lines = text.split("\n").map(line => line.replace(/\r$/, ""));
  const files = [];

  while (lines.length > 0 && lines[lines.length - 1].startsWith(prefix) && lines[lines.length - 1].length > prefix.length) {
    const path = lines.pop().slice(prefix.length);
    files.unshift({ path, name: path.slice(Math.max(path.lastIndexOf("/"), path.lastIndexOf("\\")) + 1).replace(/^[0-9a-f]{8}-(?=.)/, "") });
  }

  return { body: lines.join("\n").trimEnd(), files };
}

const activeTaskStates = ["Waiting", "Pending", "InTransit", "Queued", "Running"];

function taskStateText(task) {
  const names = { InTransit: "In transit", Pending: "Waiting for a worker", Waiting: "Waiting for other tasks" };
  return task.state === "Done" && task.isApplied ? "Done, applied" : names[task.state] ?? task.state;
}

function taskLine(task) {
  return [taskStateText(task), task.peerName ? `${task.isIncoming ? "from" : "on"} ${task.peerName}` : null, !task.isIncoming && task.workspaceName ? task.workspaceName : null].filter(part => part).join(" - ");
}

function bytesText(bytes) {
  const megabytes = bytes / (1024 * 1024);
  return megabytes >= 1024 ? `${(megabytes / 1024).toFixed(1)} GB` : bytes > 0 && megabytes < 1 ? "<1 MB" : `${Math.round(megabytes)} MB`;
}

function percentText(percent) {
  return percent > 0 && percent < 1 ? "<1%" : `${Math.round(percent)}%`;
}

function takenText(memory, cpu) {
  return cpu === undefined || cpu === null ? bytesText(memory) : `${bytesText(memory)} · ${percentText(cpu)} CPU`;
}

// What the server's computer has and what the workspaces take of it, read over and over while any of it is on screen.
class ResourceFeed {
  constructor(connection, isWanted, updated) {
    this.connection = connection;
    this.isWanted = isWanted;
    this.updated = updated;
    this.report = null;
    this.failure = null;
    this.timer = null;
    this.run = 0;
    this.disposed = false;
  }

  sync() {
    const wanted = !this.disposed && this.isWanted();

    if (wanted && this.timer === null) {
      this.timer = setInterval(() => this.refresh(), 3000);
      this.refresh();
    } else if (!wanted && this.timer !== null) {
      clearInterval(this.timer);
      this.timer = null;
      this.run++;
      // What was read is not kept, since it would be old by the time it is shown again.
      this.report = null;
      this.failure = null;

      if (!this.disposed) {
        this.updated();
      }
    }
  }

  async refresh() {
    const run = this.run;

    try {
      const report = await this.connection().getResources();

      if (run === this.run) {
        this.report = report;
        this.failure = null;
        this.updated();
      }
    } catch (exception) {
      // Whatever a read fails with, the reading goes on, since the connection reopens by itself.
      if (run === this.run) {
        this.report = null;
        this.failure = exception.message;
        this.updated();
      }
    }
  }

  dispose() {
    this.disposed = true;
    this.sync();
  }

  brief(id, isWorking) {
    const found = this.report?.workspaces.find(item => item.id === id);
    return found && found.total.processes > 0 && (isWorking || found.isWorking) ? takenText(found.total.memory, found.total.cpu) : "";
  }

  // Fills a resources section: with the sessions of a workspace, or with every workspace when none is given.
  render(box, id) {
    const report = this.report;
    const shown = report?.workspaces.find(item => item.id === id);
    const notice = this.failure !== null ? `Resources could not be read: ${this.failure}`
      : !report ? "Reading…"
      : !report.supported ? "This server can only measure resources on Linux."
      : id !== null && !shown ? "Nothing is running in this workspace."
      : id === null && report.workspaces.length === 0 ? "No workspace is working."
      : null;
    const machine = report?.machine;
    const lines = [];

    if (machine) {
      lines.push(`Server computer memory: ${bytesText(machine.totalMemory - machine.availableMemory)} of ${bytesText(machine.totalMemory)} used, ${bytesText(machine.availableMemory)} available`);

      if (machine.totalSwap > 0) {
        lines.push(`Swap: ${bytesText(machine.totalSwap - machine.freeSwap)} of ${bytesText(machine.totalSwap)} used`);
      }

      if (machine.cpu !== undefined && machine.cpu !== null) {
        lines.push(`Processor: ${percentText(machine.cpu)} of ${machine.cores} ${machine.cores === 1 ? "core" : "cores"}`);
      }
    }

    const rows = !report?.supported ? [] : id === null ? this.allRows(report) : shown ? this.sessionRows(shown) : [];
    const low = machine && machine.availableMemory < machine.totalMemory * 0.1;
    box.replaceChildren(...[
      low ? h("div", { class: "error" }, "The server computer is low on memory. Stop work that takes much of it, or the system may end the server.") : null,
      ...lines.map(line => h("div", { class: "muted small" }, line)),
      notice === null ? null : h("div", { class: "muted small" }, notice),
      ...rows.map(row => h("div", { class: `res-row${row.part ? " part" : ""}` },
        h("div", { class: "res-head" }, h("b", {}, row.name), row.state ? h("span", { class: "muted small" }, row.state) : null),
        h("div", { class: "small" }, row.summary),
        ...(row.processes ?? []).map(process => h("div", { class: "res-process muted" }, h("span", { title: process.command }, process.command), h("span", {}, takenText(process.memory, process.cpu))))))
    ].filter(node => node !== null));
  }

  sessionRows(shown) {
    const several = shown.sessions.length > 1;
    return [
      ...(several ? [{ name: "All sessions", summary: this.summary(shown.total) }] : []),
      ...shown.sessions.map(session => ({ name: session.name, state: this.state(session.isWorking), summary: this.summary(session.usage), part: several, processes: session.usage.heaviest }))
    ];
  }

  allRows(report) {
    const rows = [];

    for (const workspace of report.workspaces) {
      rows.push({ name: workspace.name, state: this.state(workspace.isWorking), summary: this.summary(workspace.total), processes: workspace.total.heaviest });

      // The sessions are only worth listing when there is more to the workspace than its main session.
      if (workspace.sessions.some(session => session.id !== workspace.id)) {
        rows.push(...workspace.sessions.map(session => ({ name: session.name, state: this.state(session.isWorking), summary: this.summary(session.usage), part: true })));
      }
    }

    rows.push({ name: "Server itself", summary: this.summary(report.server) });

    if (report.other.processes > 0) {
      rows.push({ name: "Other server processes", summary: this.summary(report.other), processes: report.other.heaviest });
    }

    return rows;
  }

  state(isWorking) {
    return isWorking ? "Working" : "Not working";
  }

  summary(usage) {
    return usage.processes === 0 ? "No processes" : `${takenText(usage.memory, usage.cpu)} · ${usage.processes} ${usage.processes === 1 ? "process" : "processes"}`;
  }
}

function icon(name) {

function findMatches(text, query, matchCase, wholeWord) {
  const starts = [];

  if (query) {
    const haystack = matchCase ? text : text.toLowerCase();
    const needle = matchCase ? query : query.toLowerCase();
    const word = c => c !== undefined && /[\p{L}\p{N}_]/u.test(c);

    for (let at = haystack.indexOf(needle); at >= 0; at = haystack.indexOf(needle, at + needle.length)) {
      if (!wholeWord || (!word(text[at - 1]) && !word(text[at + needle.length]))) {
        starts.push(at);
      }
    }
  }

  return starts;
}

const graphColors = ["#0085d9", "#d9008f", "#00d90a", "#d98500", "#a300d9", "#ff0000", "#00d9cc", "#e138e8", "#85d900", "#dc5b23", "#6f24d6", "#ffcc00"];

function layoutGraph(commits) {
  let lanes = [];
  let nextColor = 0;
  let widest = 0;
  const free = () => { const at = lanes.findIndex(item => item === null); return at >= 0 ? at : lanes.length; };
  const put = (lane, value) => { while (lanes.length <= lane) { lanes.push(null); } lanes[lane] = value; };
  const rows = [];

  for (const commit of commits) {
    const before = [...lanes];
    const merging = before.map((item, index) => item && item.hash === commit.hash ? index : -1).filter(index => index >= 0);
    const lane = merging.length > 0 ? merging[0] : free();
    const color = merging.length > 0 ? before[lane].color : nextColor++ % graphColors.length;
    const lines = [];

    before.forEach((open, index) => {
      if (open) {
        lines.push(merging.includes(index) ? [index, 0, lane, 0.5, open.color] : [index, 0, index, 1, open.color]);
      }
    });

    for (const index of merging) {
      lanes[index] = null;
    }

    (commit.parents ?? []).forEach((parent, number) => {
      const existing = lanes.findIndex(item => item && item.hash === parent);

      if (existing >= 0) {
        lines.push([lane, 0.5, existing, 1, lanes[existing].color]);
      } else if (number === 0) {
        put(lane, { hash: parent, color });
        lines.push([lane, 0.5, lane, 1, color]);
      } else {
        const target = free();
        const parentColor = nextColor++ % graphColors.length;
        put(target, { hash: parent, color: parentColor });
        lines.push([lane, 0.5, target, 1, parentColor]);
      }
    });

    while (lanes.length > 0 && lanes[lanes.length - 1] === null) {
      lanes.pop();
    }

    widest = Math.max(widest, before.length, lanes.length, lane + 1);
    rows.push({ lane, color, lines, continuing: lanes.map((item, index) => item ? [index, item.color] : null).filter(Boolean) });
  }

  return { rows, lanes: widest };
}

const graphRow = 28;
const graphLane = 14;
const graphMargin = 6;

function graphCell(row, lanes) {
  const width = Math.max(lanes, 1) * graphLane + graphMargin * 2;
  const x = lane => graphMargin + lane * graphLane + graphLane / 2;
  const paths = row.lines.map(([from, fromY, to, toY, color]) => {
    const y1 = fromY * graphRow;
    const y2 = toY * graphRow;
    const d = from === to ? `M${x(from)},${y1} L${x(to)},${y2}` : `M${x(from)},${y1} C${x(from)},${(y1 + y2) / 2} ${x(to)},${(y1 + y2) / 2} ${x(to)},${y2}`;
    return `<path d="${d}" fill="none" stroke="${graphColors[color % graphColors.length]}" stroke-width="2" stroke-linecap="round"/>`;
  }).join("");
  const template = document.createElement("template");
  template.innerHTML = `<svg width="${width}" height="${graphRow}" viewBox="0 0 ${width} ${graphRow}">${paths}<circle cx="${x(row.lane)}" cy="${graphRow / 2}" r="4.5" fill="${graphColors[row.color % graphColors.length]}" stroke="#1E1E1E" stroke-width="1.5"/></svg>`;
  const cont = h("div", { class: "cont" }, row.continuing.map(([lane, color]) => { const bar = h("i", {}); bar.style.left = `${x(lane)}px`; bar.style.background = graphColors[color % graphColors.length]; return bar; }));
  return h("div", { class: "graph", style: `width:${width}px` }, template.content.firstChild, cont);
}

function codeNodes(text, tokens, starts, length, current, lines = false) {
  const cuts = new Set([0, text.length]);

  if (lines) {
    for (let at = text.indexOf("\n"); at >= 0; at = text.indexOf("\n", at + 1)) {
      cuts.add(at);
      cuts.add(at + 1);
    }
  }

  for (const [, start, size] of tokens) {
    cuts.add(start);
    cuts.add(start + size);
  }

  for (const start of starts) {
    cuts.add(start);
    cuts.add(start + length);
  }

  const points = [...cuts].sort((a, b) => a - b);
  const nodes = [];
  let line = [];
  let tokenAt = 0;
  let matchAt = 0;
  const finish = () => {
    const element = h("span", { class: "ln" }, line);
    element.dataset.n = nodes.length + 1;
    nodes.push(element);
    line = [];
  };

  for (let i = 0; i + 1 < points.length; i++) {
    const from = points[i];

    while (tokenAt < tokens.length && tokens[tokenAt][1] + tokens[tokenAt][2] <= from) {
      tokenAt++;
    }

    while (matchAt < starts.length && starts[matchAt] + length <= from) {
      matchAt++;
    }

    const kind = tokenAt < tokens.length && tokens[tokenAt][1] <= from ? tokens[tokenAt][0] : null;
    const matched = matchAt < starts.length && starts[matchAt] <= from;
    const part = text.slice(from, points[i + 1]);

    if (lines && part === "\n") {
      finish();
    } else if (kind || matched) {
      (lines ? line : nodes).push(h("span", { class: [kind ? `syn-${kind}` : "", matched ? (matchAt === current ? "find current" : "find") : ""].join(" ").trim() }, part));
    } else {
      (lines ? line : nodes).push(part);
    }
  }

  if (lines) {
    finish();
  }

  return nodes;
}

  separator(left, right) {
    const bar = h("div", { class: "separator" });

    bar.onpointerdown = event => {
      bar.setPointerCapture(event.pointerId);
      bar.classList.add("dragging");
      const start = event.clientX;
      const leftWidth = left.offsetWidth;
      const rightWidth = right ? right.offsetWidth : 0;
      const room = right ? leftWidth + rightWidth : leftWidth + this.chatPane.offsetWidth;
      const leftMin = left === this.filesPane ? 120 : 160;
      const rightMin = right ? 160 : 240;

      bar.onpointermove = move => {
        const width = Math.min(Math.max(leftWidth + move.clientX - start, leftMin), room - rightMin);
        left.style.flex = `0 0 ${width}px`;

        if (right) {
          right.style.flex = `0 0 ${room - width}px`;
        }
      };

      bar.onpointerup = () => {
        bar.classList.remove("dragging");
        bar.onpointermove = null;
        bar.onpointerup = null;
      };
    };

    return bar;
  }

  async loadErrors() {
    const result = await attempt(() => this.connection.getErrors(this.info.id), this.errorsError);

    if (result.ok) {
      this.showErrors(result.value);
    }
  }

  showErrors(errors) {
    this.errorsBox.replaceChildren(...(errors.length === 0
      ? [h("div", { class: "muted small" }, "No errors in the last 30 days.")]
      : errors.map(entry => h("div", { style: "margin-bottom:8px" },
        h("div", { class: "muted", style: "font-size:11px", title: new Date(entry.time).toLocaleString([], { dateStyle: "full", timeStyle: "medium" }) }, messageStamp(entry.time)),
        h("div", { class: "small", style: "white-space:pre-wrap;overflow-wrap:anywhere;user-select:text" }, entry.message)))));
  }

  async syncSettings() {
    this.providerLabel.textContent = services[this.info.service]?.label ?? this.info.service;
    const edits = this.settingsEdits;
    const result = await attempt(() => this.connection.getWorkspaceSettings(this.info.id), this.settingsError);

    if (!result.ok) {
      return;
    }

    if (edits === this.settingsEdits || !this.formShown) {
      this.showSettings(result.value);
    } else {
      this.current = result.value;
    }
  }

  showSettings(settings) {
    this.formShown = true;
    this.current = settings;
    this.capabilitySelect.value = settings.capability;
    this.effortSelect.value = settings.effort;

    for (const [key, box] of Object.entries(this.switches)) {
      box.checked = !!settings[key];
    }

    this.instructionsBox.value = settings.instructions ?? "";
    this.statusBox.value = settings.statusMinutes ?? "";
    this.statusBox.placeholder = settings.globalStatusMinutes ?? "";
    this.reviewPromptBox.value = settings.reviewPrompt ?? "";
    this.expandPromptBox.value = settings.expandPrompt ?? "";
    this.reviewPromptBox.placeholder = settings.globalReviewPrompt ?? "";
    this.expandPromptBox.placeholder = settings.globalExpandPrompt ?? "";
    this.sessionFilesBox.value = settings.sessionFiles ?? "";
    this.setupScriptBox.value = settings.sessionSetupScript ?? "";
    const details = Object.entries(settings.descriptors ?? {});
    this.detailsSection.hidden = details.length === 0;
    this.detailsBox.replaceChildren(...details.map(([name, value]) => h("div", { class: "row small", style: "display:flex;gap:12px" }, h("span", { class: "muted" }, name), h("span", {}, value))));
  }

  editedSettings() {
    return {
      ...this.current,
      capability: this.capabilitySelect.value,
      effort: this.effortSelect.value,
      ...Object.fromEntries(Object.entries(this.switches).map(([key, box]) => [key, box.checked])),
      instructions: this.instructionsBox.value.trim(),
      statusMinutes: this.statusBox.value.trim() === "" ? undefined : Math.min(1440, Math.max(1, Math.round(Number(this.statusBox.value)))),
      reviewPrompt: this.reviewPromptBox.value.trim() || undefined,
      expandPrompt: this.expandPromptBox.value.trim() || undefined,
      sessionFiles: this.sessionFilesBox.value.trim() || undefined,
      sessionSetupScript: this.setupScriptBox.value.trim() || undefined
    };
  }

  hasPendingSettings() {
    if (!this.current || !this.formShown) {
      return false;
    }

    const edited = this.editedSettings();
    return edited.capability !== this.current.capability
      || edited.effort !== this.current.effort
      || ["isShellAllowed", "isSystemAccessAllowed", "isWebAllowed", "isImageGenerationAllowed", "isDelegationAllowed"].some(key => !!edited[key] !== !!this.current[key])
      || edited.instructions !== (this.current.instructions ?? "").trim()
      || (edited.statusMinutes ?? null) !== (this.current.statusMinutes ?? null)
      || (edited.reviewPrompt ?? "") !== (this.current.reviewPrompt ?? "").trim()
      || (edited.expandPrompt ?? "") !== (this.current.expandPrompt ?? "").trim()
      || (edited.sessionFiles ?? "") !== (this.current.sessionFiles ?? "").trim()
      || (edited.sessionSetupScript ?? "") !== (this.current.sessionSetupScript ?? "").trim();
  }

  async applySettings() {
    if (this.delegation() || !this.hasPendingSettings()) {
      return true;
    }

    const result = await attempt(() => this.connection.setWorkspaceSettings(this.info.id, this.editedSettings()), this.settingsError);

    if (result.ok) {
      this.showSettings(result.value);
    }

    return result.ok;
  }

  async toggleSettings() {
    if (this.settingsOpen) {
      if (!await this.applySettings()) {
        return;
      }
    }

    this.settingsOpen = !this.settingsOpen;

    if (this.settingsOpen && !this.hasPendingSettings()) {
      this.syncSettings();
    }

    if (this.settingsOpen) {
      this.loadErrors();
    }

    this.settingsPane.hidden = !this.settingsOpen;
    this.panels.hidden = this.settingsOpen;
    this.home.resources.sync();
    this.showResources();

    if (!this.settingsOpen) {
      this.scrollToEnd();
    }
  }

  showResources() {
    this.home.resources.render(this.resourcesBox, this.home.mainOf(this.info.id));
  }

  focus() {
    this.watch();
    this.loadRoot(this.files?.path ?? "", false);
    this.refreshGit();
    this.startSync();
    this.scrollToEnd();
    this.restoreDraft();
    this.keepUnsentTask();
  }

  // Takes what the server knows about the side session now.
  updateSide(info) {
    this.sideInfo = info.side ?? null;
    this.sideErrorBanner.textContent = this.sideInfo?.error ?? "";
    this.sideErrorBanner.hidden = !this.sideInfo?.error;
    this.keepUnsentTask();

    if (this.missedReconnect && this.sideInfo?.state === "Ready") {
      this.missedReconnect = false;
      this.resync();
    }
  }

  // A first task that was never sent goes into the message box when it is first heard of, unless something else is being written there.
  keepUnsentTask() {
    const side = this.sideInfo;

    if (this.draftRestored && side?.state === "Ready" && side.error && side.unsentTask && this.keptTask !== side.unsentTask) {
      this.keptTask = side.unsentTask;

      if (!this.input.value) {
        this.input.value = side.unsentTask;
        this.inputChanged();
      }
    }
  }

  showSessionChanges() {
    if (!this.sideInfo) {
      return;
    }

    if (this.settingsOpen) {
      this.toggleSettings();
    }

    this.setSearch(false);
    this.setChangesMode(true, true);
  }

  restoreDraft() {
    if (this.draftRestored) {
      return;
    }

    this.draftRestored = true;

    try {
      const saved = localStorage.getItem(`${draftKey}${this.info.id}`);
      const commit = localStorage.getItem(`${draftCommitKey}${this.info.id}`);

      if (saved && !this.input.value) {
        this.input.value = saved;
        // A loaded input is not taken for a typed one after a restart.
        this.loadedAutoCommit = commit === "on" ? true : commit === "off" ? false : null;
        this.inputChanged();
      }
    } catch (exception) {
    }
  }

  saveDraft() {
    try {
      if (this.input.value) {
        localStorage.setItem(`${draftKey}${this.info.id}`, this.input.value);
      } else {
        localStorage.removeItem(`${draftKey}${this.info.id}`);
      }

      if (this.input.value && this.loadedAutoCommit !== null) {
        localStorage.setItem(`${draftCommitKey}${this.info.id}`, this.loadedAutoCommit ? "on" : "off");
      } else {
        localStorage.removeItem(`${draftCommitKey}${this.info.id}`);
      }
    } catch (exception) {
    }
  }

  reconnected(connection) {
    this.connection.listeners.delete(this.listener);
    this.connection = connection;
    this.diagrams.connection = connection;
    connection.listeners.add(this.listener);

    // The server refuses what is read of a session that is being set up, integrated or removed; it is read once it is ready.
    if (this.sideInfo && this.sideInfo.state !== "Ready") {
      this.missedReconnect = true;
      return;
    }

    this.resync();
  }

  resync() {
    // The server watches one workspace for a connection, which is to be the one on screen.
    if (this === this.home.active) {
      this.watch();
    }

    this.reloadChat();
    this.refreshGit(true);
    this.loadScripts();
    this.loadState();
    this.loadLoop();
    this.loadErrors();
    this.loadRoot(this.files?.path ?? "", false);
  }

  blur() {
    this.stopSync();
  }

  startSync() {
    if (this.syncTimer === null) {
      this.syncOnce();
      this.syncTimer = setInterval(() => this.syncOnce(), 60000);
    }
  }

  stopSync() {
    clearInterval(this.syncTimer);
    this.syncTimer = null;
  }

  async syncOnce() {
    if (!this.gitStatus.isRepo || !this.gitStatus.remote || this.gitWorking()) {
      return;
    }

    try {
      await this.connection.gitSync(this.info.id);
    } catch (exception) {
    }
  }

  gitWorking() {
    return this.localBusy || this.gitStatus.busy === true;
  }

  state() {
    return this.forced ?? this.workState();
  }

  workState() {
    return this.gitWorking() || this.autoCommitState === "Committing" ? "Managing" : this.working ? "Working" : "Ready";
  }

  setAutoCommitState(state) {
    this.autoCommitState = state;
    this.applyState();
  }

  hasContent() {
    return this.input.value.trim().length > 0 || this.attachments.length > 0;
  }

  toggleLoadedAutoCommit() {
    // While the current work is to be committed whatever the input says, there is nothing to choose for sending it.
    if (this.autoCommitState === "On") {
      return;
    }

    this.loadedAutoCommit = !this.loadedAutoCommit;
    this.renderLoaded();
    this.saveDraft();
  }

  // A loaded input keeps what it was loaded with for as long as any of it is in the box.
  renderLoaded() {
    if (!this.hasContent()) {
      this.loadedAutoCommit = null;
    }

    this.loadedButton.hidden = this.loadedAutoCommit === null || !this.gitStatus.isRepo || !!this.delegation();
    const already = this.autoCommitState === "On";
    this.loadedButton.disabled = already;
    this.loadedButton.classList.toggle("toggled", already || this.loadedAutoCommit === true);
    this.loadedText.textContent = already ? "Auto Commit Already On for Current Work" : this.loadedAutoCommit === true ? "Auto Commit This Input: On" : "Auto Commit This Input: Off";
    const note = this.loadedButton.hidden ? "" : already ? this.loadedAutoCommit === false ? "Queuing or saving it keeps its own setting: off." : ""
      : this.loadedAutoCommit === true && this.loop?.isRunning === true ? "Sent now, it joins the loop's run, which is not committed. Queue it to have it committed." : "";
    this.loadedNote.textContent = note;
    this.loadedNote.hidden = note === "";
    const commits = this.gitStatus.isRepo && this.loadedAutoCommit !== false;
    this.queueButton.title = `Queue: send once the current work is done, at once if there is none${commits ? ", and auto commit afterwards" : ""}`;
    this.renderAutoCommitCaption();
  }

  // The button beside the message box says that it is about the current work while the one about a loaded input shows too.
  renderAutoCommitCaption() {
    const labelled = !this.autoCommitButton.hidden && !this.loadedButton.hidden;
    this.autoCommitCaption.hidden = !labelled;
    this.autoCommitButton.classList.toggle("labelled", labelled);
  }

  // What the loop waits for besides its interval, or what goes before its next run, in words, or empty when nothing does.
  loopWaiting() {
    if (!this.loop) {
      return "";
    }

    const queued = this.activeQueued();
    const inputs = queued === 1 ? "1 queued input" : `${queued} queued inputs`;
    const state = this.state();

    if (this.loop.isRunning) {
      return queued > 0 ? `${inputs} will run when this loop run ends.` : "";
    }

    // A loop only waits once its next run is due; until then it counts down, which queued inputs do not change.
    if (!this.isRunDue()) {
      return queued > 0 ? `${inputs} ${queued === 1 ? "goes" : "go"} before the loop's next run.` : "";
    }

    if (this.autoCommitState === "Committing") {
      return queued > 0 ? `Loop waiting for the commit and ${inputs}.` : "Loop waiting for the commit.";
    }

    if (queued > 0) {
      return state === "Ready" ? `Loop waiting for ${inputs}.` : `Loop waiting for the current work and ${inputs}.`;
    }

    return state === "Working" || state === "Managing" ? "Loop waiting for the current work to finish." : "";
  }

  activeQueued() {
    return this.savedInputs.filter(entry => entry.isQueued && !entry.isPaused).length;
  }

  isRunDue() {
    return !this.loop?.nextRunAt || new Date(this.loop.nextRunAt).getTime() <= Date.now();
  }

  renderLoopWaiting() {
    const waiting = this.loopWaiting();
    this.loopWaitingText.textContent = waiting;
    this.loopBanner.hidden = waiting === "";
    clearTimeout(this.runDueTimer);

    // What it waits for changes as its next run comes due.
    if (this.loop && !this.isRunDue()) {
      this.runDueTimer = setTimeout(() => this.renderLoopWaiting(), Math.min(new Date(this.loop.nextRunAt).getTime() - Date.now() + 50, 2 ** 31 - 1));
    }
  }

  renderQueueState() {
    const queued = this.savedInputs.filter(entry => entry.isQueued);
    const paused = queued.filter(entry => entry.isPaused).length;
    this.queuedBadge.textContent = String(queued.length);
    this.queuedBadge.hidden = queued.length === 0;
    this.queuedBadge.classList.toggle("paused", paused > 0);
    this.pausedText.textContent = `Queue paused (${paused})`;
    this.pausedBanner.hidden = paused === 0;
    this.renderLoopWaiting();
  }

  // Resuming gives the workspace work like queuing does, so its end is waited for in the same way.
  async resumeQueue() {
    this.chatNotice.hidden = true;
    const waited = this.notifyWhenReady;
    this.notifyWhenReady = true;
    this.clearReady();
    requestNotifications().then(() => this.home.updateNotify(this));

    if (!(await attempt(() => this.connection.resumeQueue(this.info.id), this.chatError)).ok) {
      this.settleNotify(waited);
    }
  }

  restoreLoaded(loaded) {
    if (loaded !== null && this.hasContent()) {
      this.loadedAutoCommit = loaded;
      this.renderLoaded();
      this.saveDraft();
    }
  }

  async toggleSavedAutoCommit(entry) {
    // The list is left to what the server tells, since it may send a queued input meanwhile.
    await attempt(() => this.connection.setSavedInputAutoCommit(this.info.id, entry.id, !entry.autoCommit), this.chatError);
  }

  async toggleAutoCommit() {
    await attempt(() => this.connection.setAutoCommit(this.info.id, this.autoCommitState !== "On"), this.chatError);
  }

  hasActiveQueued() {
    return this.savedInputs.some(entry => entry.isQueued && !entry.isPaused);
  }

  // Whether the user is told once the work is over, which giving it work from here turns on and the user can also turn on or off.
  get notifyWhenReady() {
    return this.notifying;
  }

  set notifyWhenReady(value) {
    this.notifying = value;
    this.home.updateNotify(this);
  }

  // Work that does not start leaves the wait as it was before, which goes on only while something is still to come and was not announced meanwhile.
  settleNotify(waited) {
    this.notifyWhenReady &&= waited && (this.state() !== "Ready" || this.loop !== null || this.hasActiveQueued() || !!this.queue || this.home.held.has(this.info.id));
  }

  hasTasksUnderWay() {
    return this.home.swarmTasks.some(task => task.workspaceId === this.info.id && !task.isManual && this.home.isUnderWay(task));
  }

  refuseWork() {
    const state = this.state();

    if (state === "Ready") {
      return false;
    }

    this.home.notice("Git", state === "Managing" ? "A git action is already running." : state === "Stopping" || state === "Canceling" ? "Wait for the work to finish being stopped." : "Wait for the AI to finish before running git actions.");
    return true;
  }

  followState(state) {
    this.forced = state === "Stopping" || state === "Canceling" ? state : null;
    this.applyState();
  }

  async loadLoop() {
    try {
      this.setLoop(await this.connection.getLoop(this.info.id), null);
    } catch (exception) {
    }
  }

  limitPauseText() {
    const pause = this.limitPause;

    if (!pause) {
      return "";
    }

    const percent = value => String(Math.round(value * 10) / 10);
    return `Paused automatically: the ${pause.window} usage window is at ${percent(pause.percentUsed)}%, at or past the maximum of ${percent(pause.maxPercent)}%. The AI resumes once it is below the maximum; the server checks again at ${new Date(pause.nextCheckAt).toLocaleTimeString([], { timeStyle: "short" })}.`;
  }

  setLimitPause(pause) {
    this.limitPause = pause;
    this.limitBanner.hidden = !pause;
    this.limitText.textContent = this.limitPauseText();
    this.home.updateLimit(this);
    this.home.updateLoop(this);
  }

  setLoop(loop, notice) {
    const ended = this.loop !== null && !loop;
    this.loop = loop;
    this.chatNotice.textContent = notice ?? "";
    this.chatNotice.hidden = !notice;
    this.updateSend();
    this.home.updateLoop(this);

    // A loop that ends between its runs changes no state, though the work waited for is over with it.
    if (ended && this.state() === "Ready" && !this.queue && this.notifyWhenReady) {
      this.conclude();
    }
  }

  loopTip() {
    const loop = this.loop;

    if (!loop) {
      return "";
    }

    const settings = loop.settings;
    const ends = {
      UntilTime: () => `until ${new Date(settings.until).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`,
      ForDuration: () => `for ${Math.floor(settings.durationSeconds / 3600)}:${String(Math.floor(settings.durationSeconds % 3600 / 60)).padStart(2, "0")} h`,
      Runs: () => `${settings.runs} runs in all`,
      UntilWindow: () => `until ${settings.window} reaches ${settings.percent}%`
    }[settings.condition];
    const runs = loop.runs ?? 0;
    const line = settings.prompt.replace(/\s+/g, " ").trim();
    return `Loop: "${line.length <= 40 ? line : `${line.slice(0, 40).trimEnd()}...`}", ${settings.intervalSeconds > 0 ? `every ${Math.round(settings.intervalSeconds / 6) / 10} min` : "back to back"}, ${ends ? ends() : "until cancelled"}, ${runs} run${runs === 1 ? "" : "s"} so far${loop.limitCheckAt ? ", waiting for the usage limit" : ""}${this.limitPause ? ", paused with the AI at the max usage window limit" : ""}`;
  }

  loopNext() {
    const loop = this.loop;

    if (!loop) {
      return "";
    }

    const busy = this.state() !== "Ready";

    if (this.limitPause) {
      return "The loop is paused with the AI because a usage window is at or past the max usage window limit. It sends nothing until the AI resumes, and goes on then.";
    }

    // What a due run waits for says more than that it waits for the workspace.
    if (!loop.isRunning && !loop.limitCheckAt && (this.activeQueued() > 0 || this.autoCommitState === "Committing") && this.isRunDue()) {
      return this.loopWaiting();
    }

    if (loop.limitCheckAt) {
      const left = (new Date(loop.limitCheckAt).getTime() - Date.now()) / 1000;
      const until = left >= 3600 ? `${Math.floor(left / 3600)} h ${Math.floor(left % 3600 / 60)} min` : left >= 60 ? `${Math.floor(left / 60)} min ${Math.floor(left % 60)} s` : `${Math.max(1, Math.floor(left))} s`;
      return left <= 0 ? "The usage limit is reached. The loop is checking it now." : `The usage limit is reached, so the loop waits. It checks again in ${until} and goes on once the AI can be prompted again.`;
    }

    if (!loop.nextRunAt) {
      return busy ? "The first prompt is sent when the workspace is free." : "The first prompt is being sent.";
    }

    const wait = (new Date(loop.nextRunAt).getTime() - Date.now()) / 1000;

    if (wait <= 0) {
      return busy ? "The next prompt is sent as soon as the workspace is free." : "The next prompt is due now.";
    }

    const span = wait >= 3600 ? `${Math.floor(wait / 3600)} h ${Math.floor(wait % 3600 / 60)} min` : wait >= 60 ? `${Math.floor(wait / 60)} min ${Math.floor(wait % 60)} s` : `${Math.max(1, Math.floor(wait))} s`;
    return busy ? `The next prompt is sent in ${span}, or when the workspace is free if that is later.` : `The next prompt is sent in ${span}.`;
  }

  async cancelLoop() {
    await attempt(() => this.connection.cancelLoop(this.info.id), this.chatError);
  }

  async openLoop() {
    let windows = [];
    let reviewPrompt = "";
    let expandPrompt = "";

    try {
      const settings = await this.connection.getWorkspaceSettings(this.info.id);
      reviewPrompt = (settings.reviewPrompt ?? settings.globalReviewPrompt ?? "").trim();
      expandPrompt = (settings.expandPrompt ?? settings.globalExpandPrompt ?? "").trim();
    } catch (exception) {
    }

    if (this.home.active !== this) {
      return;
    }

    try {
      windows = ((await this.connection.getUsage(this.info.service))?.windows ?? []).map(window => window.name);
    } catch (exception) {
    }

    // A dialog that opens after another workspace was chosen would be taken as one about that workspace.
    if (this.home.active !== this) {
      return;
    }

    const field = (label, ...controls) => h("div", { class: "stack tight", style: "margin-top:6px" }, h("div", { class: "muted" }, label), ...controls);
    const reviewRadio = h("input", { type: "radio", name: "loop-prompt", checked: true });
    const expandRadio = h("input", { type: "radio", name: "loop-prompt" });
    const customRadio = h("input", { type: "radio", name: "loop-prompt" });
    const custom = h("textarea", { rows: 3, placeholder: "Enter the prompt...", hidden: true });
    const choosePrompt = () => { custom.hidden = !customRadio.checked; };
    reviewRadio.onchange = choosePrompt;
    expandRadio.onchange = choosePrompt;
    customRadio.onchange = choosePrompt;
    const interval = h("input", { type: "number", min: "0", max: "1440", step: "1", value: "15" });
    const conditions = [["Forever", "Until I cancel it"], ["UntilTime", "Until a time of day"], ["ForDuration", "For a length of time"], ["Runs", "For a number of runs"], ...(windows.length > 0 ? [["UntilWindow", "Until a usage limit reaches a share"]] : [])];
    const time = h("input", { type: "time", value: "23:00" });
    const hours = h("input", { type: "number", min: "0", max: "576", step: "1", value: "2" });
    const minutes = h("input", { type: "number", min: "0", max: "59", step: "5", value: "0" });
    const runs = h("input", { type: "number", min: "1", max: "100000", step: "1", value: "5" });
    const windowSelect = h("select", {}, windows.map(name => h("option", { value: name }, name)));
    const percent = h("input", { type: "number", min: "1", max: "100", step: "5", value: "90" });
    const waitForLimit = h("input", { type: "checkbox", checked: true });
    const boxes = {
      UntilTime: field("Time of day (the next time it is)", time),
      ForDuration: field("Hours and minutes", h("div", { style: "display:flex;gap:8px" }, hours, minutes)),
      Runs: field("Runs", runs),
      UntilWindow: field("Usage window and share of its limit (%)", windowSelect, percent)
    };
    const kind = h("select", { onchange: () => show() }, conditions.map(([value, label]) => h("option", { value }, label)));
    const show = () => { for (const [name, box] of Object.entries(boxes)) { box.hidden = name !== kind.value; } };
    kind.value = "Forever";
    show();
    const start = async () => {
      const text = reviewRadio.checked ? reviewPrompt : expandRadio.checked ? expandPrompt : custom.value.trim();
      const minutesBetween = Number(interval.value);
      const condition = kind.value;
      const fail = message => this.home.dialogError.set(message);

      if (!text) {
        return fail(reviewRadio.checked ? "The review prompt could not be read, so write the prompt the loop sends." : expandRadio.checked ? "The expand prompt could not be read, so write the prompt the loop sends." : "Write the prompt the loop sends.");
      }

      // An empty box counts as 0; a number box also reads as empty while it holds something that is no number.
      if (interval.validity.badInput || !(minutesBetween >= 0 && minutesBetween <= 1440)) {
        return fail("The minutes between runs must be between 0 and 1440.");
      }

      const settings = { prompt: text, intervalSeconds: Math.round(minutesBetween * 60), condition, waitForLimit: waitForLimit.checked };

      if (condition === "UntilTime") {
        const [hour, minute] = (time.value || "").split(":").map(Number);

        if (Number.isNaN(hour) || Number.isNaN(minute)) {
          return fail("Choose the time the loop ends.");
        }

        const end = new Date();
        end.setHours(hour, minute, 0, 0);

        if (end.getTime() <= Date.now()) {
          end.setDate(end.getDate() + 1);
        }

        settings.until = end.toISOString();
      } else if (condition === "ForDuration") {
        const seconds = Math.round(Number(hours.value || 0) * 3600 + Number(minutes.value || 0) * 60);

        if (!(seconds > 0 && seconds <= 24 * 86400)) {
          return fail("The loop must run for a time between a minute and 24 days.");
        }

        settings.durationSeconds = seconds;
      } else if (condition === "Runs") {
        if (!(Number(runs.value) >= 1)) {
          return fail("The loop needs at least one run.");
        }

        settings.runs = Math.trunc(Number(runs.value));
      } else if (condition === "UntilWindow") {
        if (!windowSelect.value || !(Number(percent.value) >= 1 && Number(percent.value) <= 100)) {
          return fail("Choose a usage window and a share between 1 and 100.");
        }

        settings.window = windowSelect.value;
        settings.percent = Number(percent.value);
      }

      this.home.dialogError.set(null);
      const result = await attempt(() => this.connection.startLoop(this.info.id, settings), this.home.dialogError);

      if (result.ok) {
        this.home.closeDialog();
      }
    };
    this.home.dialog("Loop", null,
      field("Prompt", h("label", { class: "row-check" }, reviewRadio, " Review"), h("label", { class: "row-check" }, expandRadio, " Expand"), h("label", { class: "row-check" }, customRadio, " Custom"), custom),
      field("Minutes between runs", interval),
      field("Ends", kind),
      ...Object.values(boxes),
      h("label", { class: "check", style: "margin-top:6px" }, waitForLimit, "Wait for the usage limit instead of ending"),
      h("button", { class: "primary block", onclick: start }, "Start Loop"));
    this.home.dialogHost.firstChild.dataset.view = this.info.id;
  }

  async loadState() {
    try {
      this.followState(await this.connection.getWorkspaceState(this.info.id));
    } catch (exception) {
    }
  }

  async halt(action) {
    await attempt(action, this.chatError);
  }

  scriptList() {
    return this.scripts.entries.flatMap(entry => [entry, ...entry.children]);
  }

  scriptFind(path) {
    return this.scriptList().find(entry => entry.path === path) ?? null;
  }

  scriptActive(entry) {
    return entry.state === "Running" || entry.state === "Pending";
  }

  scriptDisplayed() {
    const selected = this.scriptFind(this.scripts.selected);
    return selected?.isTask ? selected.children.find(entry => entry.path === this.scripts.child) ?? null : selected;
  }

  pickChild() {
    const selected = this.scriptFind(this.scripts.selected);
    this.scripts.child = selected?.isTask ? (selected.children.find(entry => entry.state === "Running") ?? selected.children[0])?.path ?? null : null;
  }

  addScript(run) {
    const entry = { path: run.path, name: run.name, isTask: run.isTask === true, taskPath: run.taskPath ?? null, state: run.state, output: run.output ?? "", trimmed: run.trimmed === true, children: [] };

    if (entry.taskPath) {
      const parent = this.scripts.entries.find(item => item.path === entry.taskPath);
      parent?.children.push(entry);

      if (parent && parent.path === this.scripts.selected && !this.scripts.child) {
        this.scripts.child = entry.path;
      }
    } else {
      this.scripts.entries.push(entry);
    }

    return entry;
  }

  async loadScripts() {
    const result = await attempt(() => this.connection.getScripts(this.info.id), this.scriptError);

    if (result.ok) {
      const viewing = this.scripts.selected;
      this.scripts.entries = [];

      for (const run of result.value.runs ?? []) {
        this.addScript(run);
      }

      this.scripts.selected = this.scripts.entries.some(entry => entry.path === viewing) ? viewing : null;
      this.pickChild();
    }

    this.scripts.loaded = true;

    for (const event of this.scripts.early.splice(0)) {
      this.applyScript(event);
    }

    this.scriptsChanged();
  }

  receiveScript(event) {
    if (this.scripts.loaded) {
      this.applyScript(event);

      if (event.kind === "ScriptOutput") {
        this.showScriptOutput();
      } else {
        this.scriptsChanged();
      }
    } else {
      this.scripts.early.push(event);
    }
  }

  applyScript(event) {
    if (event.kind === "ScriptChanged" && event.script) {
      const run = event.script;
      const existing = this.scriptFind(run.path);

      if (existing) {
        existing.state = run.state;

        if (run.state === "Running" && run.taskPath && this.scriptFind(this.scripts.selected)?.children.includes(existing)) {
          this.scripts.child = existing.path;
        }
      } else {
        const added = this.addScript(run);

        if (run.path === this.scripts.wanted && !added.taskPath) {
          this.scripts.wanted = null;
          this.scripts.selected = added.path;
          this.pickChild();
        }
      }
    } else if (event.kind === "ScriptOutput" && event.path) {
      const target = this.scriptFind(event.path);

      if (target) {
        target.output += event.text ?? "";

        if (target.output.length > 500000) {
          target.output = target.output.slice(-500000);
          target.trimmed = true;
        }
      }
    } else if (event.kind === "ScriptRemoved" && event.path) {
      const top = this.scripts.entries.findIndex(entry => entry.path === event.path);

      if (top >= 0) {
        this.scripts.entries.splice(top, 1);

        if (this.scripts.selected === event.path) {
          this.scripts.selected = null;
          this.scripts.child = null;
        }
      } else {
        for (const entry of this.scripts.entries) {
          const at = entry.children.findIndex(item => item.path === event.path);

          if (at >= 0) {
            entry.children.splice(at, 1);

            if (this.scripts.child === event.path) {
              this.scripts.child = entry.children[0]?.path ?? null;
            }
          }
        }
      }
    }
  }

  scriptsChanged() {
    this.renderScripts();
    this.renderTree();
  }

  shownScript(entry) {
    return entry.output.length > 100000 ? `... earlier output is not shown (copy gives all of it) ...\n${entry.output.slice(-100000)}` : entry.trimmed ? `... earlier output was cut ...\n${entry.output}` : entry.output;
  }

  showScriptOutput() {
    const displayed = this.scriptDisplayed();
    this.scriptOutput.textContent = displayed ? this.shownScript(displayed) : "";
    this.scriptToEnd();
  }

  renderScripts() {
    const selected = this.scriptFind(this.scripts.selected);
    const displayed = this.scriptDisplayed();
    this.scriptPick.hidden = this.scripts.entries.length === 0;
    this.scriptSelect.replaceChildren(h("option", { value: "" }, "Select a script…"), ...this.scripts.entries.map(entry => h("option", { value: entry.path }, `${entry.state === "Running" ? "● " : ""}${entry.path}`)));
    this.scriptSelect.value = selected?.path ?? "";
    this.scriptRemove.hidden = !selected || this.scriptActive(selected);
    this.scriptChildren.hidden = !selected?.isTask;
    this.scriptChildren.replaceChildren(...(selected?.isTask ? selected.children.map(entry => h("button", { class: entry.path === this.scripts.child ? "on" : "", onclick: () => this.selectScriptChild(entry.path) }, `${entry.state === "Running" ? "● " : ""}${entry.name}`)) : []));
    this.scriptBar.hidden = !displayed;
    this.scriptName.textContent = displayed?.name ?? "";
    const labels = { Running: ["● Running…", ""], Succeeded: ["✓ Succeeded", "ok"], Stopped: ["⊘ Stopped", ""], Skipped: ["⊘ Skipped", ""], Failed: ["✗ Failed", "bad"] };
    const [label, tone] = labels[displayed?.state] ?? ["", ""];
    this.scriptState.textContent = label;
    this.scriptState.className = `state ${tone}`;
    this.scriptStop.hidden = !selected || !this.scriptActive(selected);
    this.scriptEmpty.hidden = !!displayed;
    this.scriptOutput.hidden = !displayed;
    this.scriptInputBar.hidden = !displayed || displayed.state !== "Running" || displayed.isTask;
    this.showScriptOutput();
  }

  selectScript(path) {
    this.scripts.selected = path || null;
    this.pickChild();
    this.renderScripts();
    this.scriptToEnd();
  }

  selectScriptChild(path) {
    this.scripts.child = path;
    this.renderScripts();
    this.scriptToEnd();
  }

  scriptToEnd() {
    if (this.scriptAuto) {
      this.scriptScroller.scrollTop = this.scriptScroller.scrollHeight;
    }
  }

  toggleScriptAuto() {
    this.scriptAuto = !this.scriptAuto;
    this.scriptAutoButton.classList.toggle("on", this.scriptAuto);
    this.scriptToEnd();
  }

  async toggleWork() {
    const value = !this.showWork;
    this.setShowWork(value);

    if (!(await attempt(() => this.connection.setShowWork(this.info.id, value), this.chatError)).ok) {
      this.setShowWork(!value);
    }
  }

  setShowWork(value) {
    this.showWork = value;
    this.workButton.classList.toggle("on", value);
  }

  toggleChatAuto() {
    this.chatAuto = !this.chatAuto;
    this.chatAutoButton.classList.toggle("on", this.chatAuto);

    if (this.chatAuto) {
      this.trimToNewest();
    }

    this.scrollToEnd();
  }

  async runScript(path) {
    this.showSide("script");
    this.scripts.wanted = path;

    if (!(await attempt(() => this.connection.runScript(this.info.id, path), this.scriptError)).ok) {
      this.scripts.wanted = null;
    }
  }

  async stopScript() {
    if (this.scripts.selected) {
      await attempt(() => this.connection.stopScript(this.info.id, this.scripts.selected), this.scriptError);
    }
  }

  async sendScriptInput() {
    const displayed = this.scriptDisplayed();
    const text = this.scriptInput.value;

    if (!displayed || !text) {
      return;
    }

    this.scriptInput.value = "";

    if (!(await attempt(() => this.connection.sendScriptInput(this.info.id, displayed.path, text), this.scriptError)).ok && !this.scriptInput.value) {
      this.scriptInput.value = text;
    }
  }

  async removeScript() {
    if (this.scripts.selected) {
      await attempt(() => this.connection.removeScript(this.info.id, this.scripts.selected), this.scriptError);
    }
  }

  copyScriptOutput() {
    const displayed = this.scriptDisplayed();

    if (displayed) {
      navigator.clipboard?.writeText(displayed.output);
    }
  }

  announceReady(state) {
    if (state === "Ready" && this.lastState !== "Ready" && this.notifyWhenReady) {
      this.conclude();
    }
  }

  // Tells the user that the work they wait for is over, unless more of it is still to come.
  conclude() {
    // While the AI waits for delegated tasks its work is not over, so the user is told once it has dealt with them.
    if (this.hasTasksUnderWay()) {
      this.home.held.add(this.info.id);
      return;
    }

    this.home.held.delete(this.info.id);

    // Nor is it while queued inputs are still to be sent or work waits for the local AI (a queued input leaves the list only after it starts to wait there), or while a loop runs, between whose runs the workspace is ready.
    if (this.hasActiveQueued() || this.queue || this.loop !== null) {
      return;
    }

    this.notifyWhenReady = false;

    try {
      if ("Notification" in window && Notification.permission === "granted") {
        const note = new Notification(`${workspaceName(this.info)} is ready`, { tag: `ready-${this.info.id}` });
        this.readyNote = note;
        note.onclick = () => {
          window.focus();
          this.home.app.showWorkspace(this.home, this.info.id);
          note.close();
        };
      }
    } catch (exception) {
    }
  }

  clearReady() {
    if (this.readyNote) {
      this.readyNote.close();
      this.readyNote = null;
    }
  }

  applyState() {
    const state = this.state();
    this.announceReady(state);
    const previous = this.lastState ?? "Ready";
    this.lastState = state;

    if (previous === "Ready" && state !== "Ready") {
      this.busySince = Date.now();
      this.clearReady();
    } else if (previous !== "Ready" && state === "Ready" && Date.now() - this.busySince >= 2000 && this.loop === null && !this.hasActiveQueued()) {
      ding();
    }

    this.gitBar.hidden = state !== "Managing";
    const delegated = this.delegation();
    this.input.placeholder = delegated ? `This workspace runs a task delegated by ${delegated.from}` : { Managing: this.autoCommitState === "Committing" ? "Committing the changes, queue what comes next" : "Git is working, wait for it to finish", Stopping: "Stopping, wait for it to finish", Canceling: "Cancelling and reverting, wait for it to finish" }[state] ?? "Enter query...";
    this.showDelegation(delegated);
    this.updateSend();
    this.home.updateWorking(this);
  }

  showDelegation(delegation) {
    const delegated = delegation !== null;

    for (const control of [this.input, this.attachButton, this.loadInputButton, this.renameButton, this.relocateButton, ...this.lockedControls]) {
      control.disabled = delegated;
    }

    this.lockedNote.hidden = !delegated;

    if (delegated !== this.treeDelegated) {
      this.treeDelegated = delegated;
      this.renderTree();
    }

    this.stopButton.title = delegated ? "Cancel the delegated task" : "Stop the work and keep what it did";
    this.home.updateHaltNote(this);
  }

  dispose() {
    this.connection.listeners.delete(this.listener);
    document.removeEventListener("keydown", this.keyListener);
    document.removeEventListener("click", this.menuListener);
    this.stopSync();
    this.voiceStarting = null;

    if (this.voice) {
      this.releaseVoice(this.voice);
    }
  }

  setWorking(value) {
    // What was sent before the work began is in it or done with it, so none of it can be what waits later.
    if (value && !this.working) {
      this.submitted = [];
    }

    this.working = value;

    if (value && this.gitWorking()) {
      this.showSide("chat");
    }

    this.applyState();
  }

  weight(messages) {
    return messages.reduce((sum, message) => sum + message.text.length, 0);
  }

  async loadChat(reach = null, characters = 0) {
    this.loading = true;
    const saved = await attempt(() => this.connection.getSavedInputs(this.info.id), this.chatError);
    let unshown = saved.ok ? saved.value : null;
    const result = await attempt(() => this.connection.getHistory(this.info.id, null, chatChunkMessages, chatChunkCharacters), this.chatError);
    let lost = false;

    if (result.ok) {
      const window = [...result.value.messages];
      let older = result.value.older;

      while (reach && older && !window.some(message => this.reaches(message, reach)) && this.weight(window) < characters) {
        const more = await attempt(() => this.connection.getHistory(this.info.id, older, chatChunkMessages, chatChunkCharacters), this.chatError);

        if (!more.ok) {
          break;
        }

        window.unshift(...more.value.messages);
        older = more.value.older;
      }

      lost = !!reach && !window.some(message => this.reaches(message, reach));
      this.streaming = null;
      // A prompt on its way stays, unless what was read holds the server's copy of it, one that was not shown before.
      const shown = this.messages.filter(message => !message.pending);
      const unsent = this.messages.filter(message => message.pending && !window.some(told => told.role === "User" && told.text === message.text && !shown.some(old => this.reaches(told, old))));
      this.messages = [...window, ...unsent];
      this.start = messagePosition(older);
      this.setShowWork(result.value.showWork === true);
      this.renderMessages();

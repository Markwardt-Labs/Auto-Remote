<style>
:root {
  --background: #1E1E1E;
  --surface: #252526;
  --elevated: #2D2D2D;
  --border: #3C3C3C;
  --hover: #2A2D2E;
  --selection: #094771;
  --text: #CCCCCC;
  --muted: #969696;
  --accent: #007ACC;
  --accent-hover: #1F8AD2;
  --working: #007ACC;
  --on-working: #FFFFFF;
  --danger: #C74E39;
  --scrim: #00000099;
  --pace-very-low: #6FBF73;
  --pace-low: #569CD6;
  --pace-high: #E0A458;
  --pace-very-high: #E57373;
  --git-added: #73C991;
  --git-modified: #E2C08D;
  --diff-added: #1E4620;
  --diff-removed: #4B1E1E;
  --syn-keyword: #569CD6;
  --syn-string: #CE9178;
  --syn-comment: #6A9955;
  --syn-number: #B5CEA8;
  --syn-function: #DCDCAA;
  --syn-type: #4EC9B0;
  --syn-property: #9CDCFE;
  --syn-tag: #569CD6;
  --syn-variable: #9CDCFE;
  --mono: Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--background); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#app { height: 100dvh; display: flex; flex-direction: column; }
.serif { font-weight: 600; margin: 0; }
.muted { color: var(--muted); }
.error { color: var(--danger); overflow-wrap: anywhere; }
.small { font-size: 12px; }

button, input, textarea, select { font: inherit; color: inherit; }
button { background: var(--hover); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--selection); }
button:disabled { opacity: .5; cursor: default; }
button.flat { background: transparent; border: 0; }
button.flat:hover:not(:disabled) { background: var(--hover); }
button.primary { background: var(--accent); color: #fff; border: 0; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); }
button.primary:disabled { background: var(--elevated); color: var(--muted); opacity: 1; }
button.danger { background: var(--danger); color: #fff; border: 0; }
button.danger:hover:not(:disabled) { background: #D9604B; }
button.block { width: 100%; text-align: center; }
input[type=text], input[type=password], textarea, select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; min-height: 40px; outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
label.check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 8px; }
.progress { height: 4px; background: var(--elevated); border-radius: 2px; overflow: hidden; position: relative; }
.progress::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); animation: slide 1.1s infinite ease-in-out; }
@keyframes slide { from { left: -40%; } to { left: 100%; } }

.connect { flex: 1; overflow-y: auto; }
.connect .form { max-width: 440px; margin: 0 auto; padding: 48px 24px; min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.connect h1 { font-size: 34px; text-align: center; }
.connect .sub { text-align: center; margin-bottom: 18px; }
.connect .trust { text-align: center; margin-top: 8px; overflow-wrap: anywhere; }
.connect a { color: var(--accent-hover); }

.home { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.topbar { display: flex; align-items: center; padding: 8px; gap: 8px; background: var(--elevated); border-bottom: 1px solid var(--border); }
.topbar .menu { font-size: 20px; width: 48px; padding: 8px 0; margin-right: 96px; }
.topbar .title { flex: 1; text-align: center; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .tools { display: flex; width: 144px; justify-content: flex-end; }
.topbar .gear, .topbar .usage, .topbar .remote { width: 48px; font-size: 20px; padding: 8px 0; display: flex; align-items: center; justify-content: center; }
.usage[data-pace=VeryLow], .usage-card [data-pace=VeryLow] { color: var(--pace-very-low); }
.usage[data-pace=Low], .usage-card [data-pace=Low] { color: var(--pace-low); }
.usage[data-pace=High], .usage-card [data-pace=High] { color: var(--pace-high); }
.usage[data-pace=VeryHigh], .usage-card [data-pace=VeryHigh] { color: var(--pace-very-high); }
.topbar.working .usage[data-pace=Low] { color: var(--on-working); }
.usage-wrap { position: absolute; inset: 0; z-index: 12; }
.usage-card { position: absolute; top: 56px; right: 8px; width: min(300px, calc(100% - 16px)); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.usage-card h3 { font-size: 16px; margin: 0; }
.usage-card .value { font-size: 18px; }
.topbar button:hover:not(:disabled) { background: #ffffff40; }
.topbar.working { background: var(--working); color: var(--on-working); border-bottom-color: var(--working); }
.topbar.working button { color: var(--on-working); }
.topbar.working button:hover:not(:disabled) { background: #ffffff40; }
.content { flex: 1; min-height: 0; position: relative; }
.empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 32px; text-align: center; }
.empty h2 { font-size: 24px; }

.workspace { position: absolute; inset: 0; }
.panels { position: absolute; inset: 0; display: flex; }
.panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.panel.files { flex: 0 0 14.3%; min-width: 120px; background: var(--surface); }
.panel.content { flex: 0 0 42.85%; min-width: 160px; }
.panel.chat { flex: 1 1 0; min-width: 240px; }
.separator { flex: none; width: 1px; touch-action: none; position: relative; z-index: 1; background: var(--border); }
.separator::before { content: ""; position: absolute; inset: 0 -2px; cursor: col-resize; }
.placeholder { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; }
.pane { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; background: var(--background); }
.pane-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tabs { display: flex; flex: none; }
.tabs button { flex: 1; background: var(--elevated); border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 7px 12px; font-size: 12px; }
.tabs button:hover:not(:disabled) { background: var(--hover); }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); background: var(--background); }
.script-pick { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--elevated); border-bottom: 1px solid var(--border); }
.script-pick select { flex: 1; min-height: 32px; padding: 4px 8px; }
.script-children { display: flex; gap: 2px; padding: 4px 6px; background: var(--elevated); border-bottom: 1px solid var(--border); overflow-x: auto; }
.script-children button { background: transparent; border: 0; font-size: 11px; padding: 4px 8px; white-space: nowrap; }
.script-children button.on { background: var(--selection); }
.script-bar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--elevated); }
.script-bar .spacer { flex: 1; }
.script-bar button { font-size: 11px; padding: 4px 8px; min-height: 0; }
.script-bar .state { font-size: 11px; }
.script-bar .state.ok { color: var(--accent); }
.script-bar .state.bad { color: crimson; }
.script-scroll { flex: 1; min-height: 0; overflow: auto; position: relative; display: flex; flex-direction: column; }
.script-output { margin: 0; padding: 10px 14px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px Menlo, Consolas, "DejaVu Sans Mono", monospace; user-select: text; }
.script-input { display: flex; gap: 8px; padding: 6px 10px; background: var(--elevated); border-top: 1px solid var(--border); }
.script-input input { flex: 1; }
.row.running .name { font-weight: 700; }
.tree .row { user-select: none; }
.messages-wrap { flex: 1; min-height: 0; position: relative; display: flex; }
.messages { flex: 1; overflow-y: auto; padding: 0 16px; }
.autoscroll { position: absolute; right: 22px; bottom: 8px; background: var(--elevated); border: 1px solid var(--border); }
.messages .inner { max-width: 820px; margin: 0 auto; padding: 8px 0; }
.msg { margin: 16px 0; }
.msg.user { display: flex; }
.msg.user .bubble { background: var(--elevated); border: 1px solid var(--accent); border-radius: 6px; padding: 8px 12px; flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .attached { display: flex; flex-wrap: wrap; gap: 4px 6px; white-space: normal; }
.msg.user .body + .attached { margin-top: 8px; }
.msg.user .attached .chip { display: flex; align-items: center; gap: 6px; background: var(--background); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 12px; }
.msg.user .attached .name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg.assistant .bubble { overflow-wrap: anywhere; font-size: 14px; user-select: text; }
.chat-error { max-width: 820px; width: 100%; margin: 0 auto; padding: 4px 20px; }
.composer { max-width: 820px; width: 100%; margin: 0 auto; padding: 4px 12px 12px; }
.composer .box { display: flex; align-items: center; gap: 6px; padding: 4px 0 4px 8px; box-sizing: border-box; height: 120px; min-height: 60px; }
.composer textarea, .composer textarea:focus, .composer textarea:hover { flex: 1; background: transparent; border: 0; border-radius: 0; padding: 0; min-height: 0; max-height: 100%; height: auto; resize: none; outline: none; align-self: center; }
.composer .box button { align-self: center; }
.composer .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 0 0 4px 8px; }
.composer .chip { display: flex; align-items: center; gap: 6px; background: var(--elevated); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 12px; }
.composer .chip .name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer .chip button { width: 20px; height: 20px; min-width: 0; min-height: 0; }
.composer-grip { height: 4px; border-top: 1px solid var(--border); cursor: ns-resize; flex: none; touch-action: none; }
.composer button { width: 34px; height: 34px; border-radius: 4px; padding: 0; font-size: 18px; flex: none; }

.panel .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.files .bar { padding: 4px 6px; margin: 0; gap: 4px; justify-content: flex-end; }
.files .tree { padding-left: 10px; }
.files .path { margin: 0 6px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list { flex: 1; overflow-y: auto; min-height: 0; }

          reply = JSON.parse(message.data);
        } catch (exception) {
        }

        if (reply && reply.accepted === true) {
          finish(resolve, new Connection(socket));
        } else {
          socket.onclose = null;
          socket.close();
          finish(reject, new Error("The server refused the access key."));
        }
      };
    });
  }

  receive(data) {
    let response;

    try {
      response = JSON.parse(data);
    } catch (exception) {
      return;
    }

    if (response.id === 0 && response.event) {
      for (const listener of [...this.listeners]) {
        listener(response.event);
      }

      return;
    }

    const request = this.pending.get(response.id);

    if (request) {
      this.pending.delete(response.id);

      if (response.error) {
        request.reject(new RemoteError(response.error));
      } else {
        request.resolve(response);
      }
    }
  }

  fail() {
    if (this.closed) {
      return;
    }

    this.closed = true;
    log("Connection to the server was lost");

    for (const request of this.pending.values()) {
      request.reject(new Error("The connection to the server was lost."));
    }

    this.pending.clear();

    if (this.onclose) {
      this.onclose();
    }
  }

  request(command, fields = {}) {
    if (this.closed || this.socket.readyState !== WebSocket.OPEN) {
      return Promise.reject(new Error("The connection to the server was lost."));
    }

    const id = this.nextId++;

    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      this.socket.send(JSON.stringify({ id, command, ...fields }));
    });
  }

  close() {
    this.onclose = null;
    this.closed = true;
    this.socket.close();
  }

function ding() {
  if (audio === null || audio.state !== "running") {
    return;
  }

  const start = audio.currentTime;
  const master = audio.createGain();
  master.gain.value = 0.35;
  master.connect(audio.destination);

  for (const [frequency, level, decay] of [[880, 1, 5], [1320, 0.45, 7], [2640, 0.2, 10]]) {
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(level, start + 0.005);
    gain.gain.setTargetAtTime(0, start + 0.005, 1 / decay);
    oscillator.connect(gain).connect(master);
    oscillator.start(start);
    oscillator.stop(start + 0.8);
  }
}

function splitAttachments(text) {
  const prefix = "Attached file: ";
  const lines = text.split("\n").map(line => line.replace(/\r$/, ""));
  const files = [];

  while (lines.length > 0 && lines[lines.length - 1].startsWith(prefix) && lines[lines.length - 1].length > prefix.length) {
    const path = lines.pop().slice(prefix.length);
    files.unshift({ path, name: path.slice(Math.max(path.lastIndexOf("/"), path.lastIndexOf("\\")) + 1).replace(/^[0-9a-f]{8}-(?=.)/, "") });
  }

  return { body: lines.join("\n").trimEnd(), files };
}

  return template.content.firstChild;
}

function findMatches(text, query, matchCase, wholeWord) {
  const starts = [];

  if (query) {
    const haystack = matchCase ? text : text.toLowerCase();
    const needle = matchCase ? query : query.toLowerCase();
    const word = c => c !== undefined && /[\p{L}\p{N}_]/u.test(c);

    for (let at = haystack.indexOf(needle); at >= 0; at = haystack.indexOf(needle, at + needle.length)) {
      if (!wholeWord || (!word(text[at - 1]) && !word(text[at + needle.length]))) {
        starts.push(at);
      }
    }
  }

  return starts;
}

const graphColors = ["#0085d9", "#d9008f", "#00d90a", "#d98500", "#a300d9", "#ff0000", "#00d9cc", "#e138e8", "#85d900", "#dc5b23", "#6f24d6", "#ffcc00"];

function layoutGraph(commits) {
  let lanes = [];
  let nextColor = 0;
  let widest = 0;
  const free = () => { const at = lanes.findIndex(item => item === null); return at >= 0 ? at : lanes.length; };
  const put = (lane, value) => { while (lanes.length <= lane) { lanes.push(null); } lanes[lane] = value; };
  const rows = [];

  for (const commit of commits) {
    const before = [...lanes];
    const merging = before.map((item, index) => item && item.hash === commit.hash ? index : -1).filter(index => index >= 0);
    const lane = merging.length > 0 ? merging[0] : free();
    const color = merging.length > 0 ? before[lane].color : nextColor++ % graphColors.length;
    const lines = [];

    before.forEach((open, index) => {
      if (open) {
        lines.push(merging.includes(index) ? [index, 0, lane, 0.5, open.color] : [index, 0, index, 1, open.color]);
      }
    });

    for (const index of merging) {
      lanes[index] = null;
    }

    (commit.parents ?? []).forEach((parent, number) => {
      const existing = lanes.findIndex(item => item && item.hash === parent);

      if (existing >= 0) {
        lines.push([lane, 0.5, existing, 1, lanes[existing].color]);
      } else if (number === 0) {
        put(lane, { hash: parent, color });
        lines.push([lane, 0.5, lane, 1, color]);
      } else {
        const target = free();
        const parentColor = nextColor++ % graphColors.length;
        put(target, { hash: parent, color: parentColor });
        lines.push([lane, 0.5, target, 1, parentColor]);
      }
    });

    while (lanes.length > 0 && lanes[lanes.length - 1] === null) {
      lanes.pop();
    }

    widest = Math.max(widest, before.length, lanes.length, lane + 1);
    rows.push({ lane, color, lines, continuing: lanes.map((item, index) => item ? [index, item.color] : null).filter(Boolean) });
  }

  return { rows, lanes: widest };
}

const graphRow = 28;
const graphLane = 14;
const graphMargin = 6;

function graphCell(row, lanes) {
  const width = Math.max(lanes, 1) * graphLane + graphMargin * 2;
  const x = lane => graphMargin + lane * graphLane + graphLane / 2;
  const paths = row.lines.map(([from, fromY, to, toY, color]) => {
    const y1 = fromY * graphRow;
    const y2 = toY * graphRow;
    const d = from === to ? `M${x(from)},${y1} L${x(to)},${y2}` : `M${x(from)},${y1} C${x(from)},${(y1 + y2) / 2} ${x(to)},${(y1 + y2) / 2} ${x(to)},${y2}`;
    return `<path d="${d}" fill="none" stroke="${graphColors[color % graphColors.length]}" stroke-width="2" stroke-linecap="round"/>`;
  }).join("");
  const template = document.createElement("template");
  template.innerHTML = `<svg width="${width}" height="${graphRow}" viewBox="0 0 ${width} ${graphRow}">${paths}<circle cx="${x(row.lane)}" cy="${graphRow / 2}" r="4.5" fill="${graphColors[row.color % graphColors.length]}" stroke="#1E1E1E" stroke-width="1.5"/></svg>`;
  const cont = h("div", { class: "cont" }, row.continuing.map(([lane, color]) => { const bar = h("i", {}); bar.style.left = `${x(lane)}px`; bar.style.background = graphColors[color % graphColors.length]; return bar; }));
  return h("div", { class: "graph", style: `width:${width}px` }, template.content.firstChild, cont);
}

function codeNodes(text, tokens, starts, length, current, lines = false) {
  const cuts = new Set([0, text.length]);

  if (lines) {
    for (let at = text.indexOf("\n"); at >= 0; at = text.indexOf("\n", at + 1)) {
      cuts.add(at);
      cuts.add(at + 1);
    }
  }

  for (const [, start, size] of tokens) {
    cuts.add(start);
    cuts.add(start + size);
  }

  for (const start of starts) {
    cuts.add(start);
    cuts.add(start + length);
  }

  const points = [...cuts].sort((a, b) => a - b);
  const nodes = [];
  let line = [];
  let tokenAt = 0;
  let matchAt = 0;
  const finish = () => {
    const element = h("span", { class: "ln" }, line);
    element.dataset.n = nodes.length + 1;
    nodes.push(element);
    line = [];
  };

  for (let i = 0; i + 1 < points.length; i++) {
    const from = points[i];

    while (tokenAt < tokens.length && tokens[tokenAt][1] + tokens[tokenAt][2] <= from) {
      tokenAt++;
    }

    while (matchAt < starts.length && starts[matchAt] + length <= from) {
      matchAt++;
    }

    const kind = tokenAt < tokens.length && tokens[tokenAt][1] <= from ? tokens[tokenAt][0] : null;
    const matched = matchAt < starts.length && starts[matchAt] <= from;
    const part = text.slice(from, points[i + 1]);

    if (lines && part === "\n") {
      finish();
    } else if (kind || matched) {
      (lines ? line : nodes).push(h("span", { class: [kind ? `syn-${kind}` : "", matched ? (matchAt === current ? "find current" : "find") : ""].join(" ").trim() }, part));
    } else {
      (lines ? line : nodes).push(part);
    }
  }

  if (lines) {
    finish();
  }

  return nodes;
}

  separator(left, right) {
    const bar = h("div", { class: "separator" });

    bar.onpointerdown = event => {
      bar.setPointerCapture(event.pointerId);
      bar.classList.add("dragging");
      const start = event.clientX;
      const leftWidth = left.offsetWidth;
      const rightWidth = right ? right.offsetWidth : 0;
      const room = right ? leftWidth + rightWidth : leftWidth + this.chatPane.offsetWidth;
      const leftMin = left === this.filesPane ? 120 : 160;
      const rightMin = right ? 160 : 240;

      bar.onpointermove = move => {
        const width = Math.min(Math.max(leftWidth + move.clientX - start, leftMin), room - rightMin);
        left.style.flex = `0 0 ${width}px`;

        if (right) {
          right.style.flex = `0 0 ${room - width}px`;
        }
      };

      bar.onpointerup = () => {
        bar.classList.remove("dragging");
        bar.onpointermove = null;
        bar.onpointerup = null;
      };
    };

    return bar;
  }

  syncSettings() {
    this.serviceSelect.value = this.info.service;
    this.fillChoices(this.info.service, this.info.model, this.info.effort);
  }

  fillChoices(service, model, effort) {
    const offered = services[service];
    this.modelSelect.replaceChildren(...offered.models.map(m => h("option", { value: m }, m)));
    this.effortSelect.replaceChildren(...offered.efforts.map(e => h("option", { value: e }, e)));
    this.modelSelect.value = model;
    this.effortSelect.value = effort;
  }

  changeService() {
    const offered = services[this.serviceSelect.value];
    this.fillChoices(this.serviceSelect.value, offered.models[0], offered.defaultEffort);
    return this.configure();
  }

  toggleSettings() {
    this.settingsOpen = !this.settingsOpen;
    this.settingsPane.hidden = !this.settingsOpen;
    this.panels.hidden = this.settingsOpen;

    if (!this.settingsOpen) {
      this.scrollToEnd();
    }
  }

  focus() {
    this.watched = [];
    this.loadRoot(this.files?.path ?? "", false);
    this.refreshGit();
    this.startSync();
    this.scrollToEnd();
    this.restoreDraft();
  }

  restoreDraft() {
    if (this.draftRestored) {
      return;
    }

    this.draftRestored = true;

    try {
      const saved = localStorage.getItem(`${draftKey}${this.info.id}`);

      if (saved && !this.input.value) {
        this.input.value = saved;
        this.inputChanged();
      }
    } catch (exception) {
    }
  }

  saveDraft() {
    try {
      if (this.input.value) {
        localStorage.setItem(`${draftKey}${this.info.id}`, this.input.value);
      } else {
        localStorage.removeItem(`${draftKey}${this.info.id}`);
      }
    } catch (exception) {
    }
  }

  blur() {
    this.stopSync();
  }

  startSync() {
    if (this.syncTimer === null) {
      this.syncOnce();
      this.syncTimer = setInterval(() => this.syncOnce(), 60000);
    }
  }

  stopSync() {
    clearInterval(this.syncTimer);
    this.syncTimer = null;
  }

  async syncOnce() {
    if (!this.gitStatus.isRepo || !this.gitStatus.remote || this.gitWorking()) {
      return;
    }

    try {
      await this.connection.gitSync(this.info.id);
    } catch (exception) {
    }
  }

  gitWorking() {
    return this.localBusy || this.gitStatus.busy === true;
  }

  state() {
    return this.scriptsRunning() ? "Running" : this.gitWorking() ? "Managing" : this.working ? "Working" : "Ready";
  }

  refuseWork() {
    const state = this.state();

    if (state === "Ready") {
      return false;
    }

    this.home.notice("Git", state === "Managing" ? "A git action is already running." : "Wait for the AI or the script to finish before running git actions.");
    return true;
  }

  scriptList() {
    return this.scripts.entries.flatMap(entry => [entry, ...entry.children]);
  }

  scriptFind(path) {
    return this.scriptList().find(entry => entry.path === path) ?? null;
  }

  scriptActive(entry) {
    return entry.state === "Running" || entry.state === "Pending";
  }

  scriptsRunning() {
    return this.scripts.entries.some(entry => this.scriptActive(entry));
  }

  scriptDisplayed() {
    const selected = this.scriptFind(this.scripts.selected);
    return selected?.isTask ? selected.children.find(entry => entry.path === this.scripts.child) ?? null : selected;
  }

  pickChild() {
    const selected = this.scriptFind(this.scripts.selected);
    this.scripts.child = selected?.isTask ? (selected.children.find(entry => entry.state === "Running") ?? selected.children[0])?.path ?? null : null;
  }

  addScript(run) {
    const entry = { path: run.path, name: run.name, isTask: run.isTask === true, taskPath: run.taskPath ?? null, state: run.state, output: run.output ?? "", trimmed: run.trimmed === true, children: [] };

    if (entry.taskPath) {
      const parent = this.scripts.entries.find(item => item.path === entry.taskPath);
      parent?.children.push(entry);

      if (parent && parent.path === this.scripts.selected && !this.scripts.child) {
        this.scripts.child = entry.path;
      }
    } else {
      this.scripts.entries.push(entry);
    }

    return entry;
  }

  async loadScripts() {
    const result = await attempt(() => this.connection.getScripts(this.info.id), this.scriptError);

    if (result.ok) {
      const viewing = this.scripts.selected;
      this.scripts.entries = [];

      for (const run of result.value.runs ?? []) {
        this.addScript(run);
      }

      this.scripts.selected = this.scripts.entries.some(entry => entry.path === viewing) ? viewing : null;
      this.pickChild();
    }

    this.scripts.loaded = true;

    for (const event of this.scripts.early.splice(0)) {
      this.applyScript(event);
    }

    this.scriptsChanged();
  }

  receiveScript(event) {
    if (this.scripts.loaded) {
      this.applyScript(event);

      if (event.kind === "ScriptOutput") {
        this.showScriptOutput();
      } else {
        this.scriptsChanged();
      }
    } else {
      this.scripts.early.push(event);
    }
  }

  applyScript(event) {
    if (event.kind === "ScriptChanged" && event.script) {
      const run = event.script;
      const existing = this.scriptFind(run.path);

      if (existing) {
        existing.state = run.state;

        if (run.state === "Running" && run.taskPath && this.scriptFind(this.scripts.selected)?.children.includes(existing)) {
          this.scripts.child = existing.path;
        }
      } else {
        const added = this.addScript(run);

        if (run.path === this.scripts.wanted && !added.taskPath) {
          this.scripts.wanted = null;
          this.scripts.selected = added.path;
          this.pickChild();
        }
      }
    } else if (event.kind === "ScriptOutput" && event.path) {
      const target = this.scriptFind(event.path);

      if (target) {
        target.output += event.text ?? "";

        if (target.output.length > 500000) {
          target.output = target.output.slice(-500000);
          target.trimmed = true;
        }
      }
    } else if (event.kind === "ScriptRemoved" && event.path) {
      const top = this.scripts.entries.findIndex(entry => entry.path === event.path);

      if (top >= 0) {
        this.scripts.entries.splice(top, 1);

        if (this.scripts.selected === event.path) {
          this.scripts.selected = null;
          this.scripts.child = null;
        }
      } else {
        for (const entry of this.scripts.entries) {
          const at = entry.children.findIndex(item => item.path === event.path);

          if (at >= 0) {
            entry.children.splice(at, 1);

            if (this.scripts.child === event.path) {
              this.scripts.child = entry.children[0]?.path ?? null;
            }
          }
        }
      }
    }
  }

  scriptsChanged() {
    this.renderScripts();
    this.renderTree();
    this.applyState();
  }

  shownScript(entry) {
    return entry.output.length > 100000 ? `... earlier output is not shown (copy gives all of it) ...\n${entry.output.slice(-100000)}` : entry.trimmed ? `... earlier output was cut ...\n${entry.output}` : entry.output;
  }

  showScriptOutput() {
    const displayed = this.scriptDisplayed();
    this.scriptOutput.textContent = displayed ? this.shownScript(displayed) : "";
    this.scriptToEnd();
  }

  renderScripts() {
    const selected = this.scriptFind(this.scripts.selected);
    const displayed = this.scriptDisplayed();
    this.scriptPick.hidden = this.scripts.entries.length === 0;
    this.scriptSelect.replaceChildren(h("option", { value: "" }, "Select a script…"), ...this.scripts.entries.map(entry => h("option", { value: entry.path }, `${entry.state === "Running" ? "● " : ""}${entry.path}`)));
    this.scriptSelect.value = selected?.path ?? "";
    this.scriptRemove.hidden = !selected || this.scriptActive(selected);
    this.scriptChildren.hidden = !selected?.isTask;
    this.scriptChildren.replaceChildren(...(selected?.isTask ? selected.children.map(entry => h("button", { class: entry.path === this.scripts.child ? "on" : "", onclick: () => this.selectScriptChild(entry.path) }, `${entry.state === "Running" ? "● " : ""}${entry.name}`)) : []));
    this.scriptBar.hidden = !displayed;
    this.scriptName.textContent = displayed?.name ?? "";
    const labels = { Running: ["● Running…", ""], Succeeded: ["✓ Succeeded", "ok"], Stopped: ["⊘ Stopped", ""], Skipped: ["⊘ Skipped", ""], Failed: ["✗ Failed", "bad"] };
    const [label, tone] = labels[displayed?.state] ?? ["", ""];
    this.scriptState.textContent = label;
    this.scriptState.className = `state ${tone}`;
    this.scriptStop.hidden = !selected || !this.scriptActive(selected);
    this.scriptEmpty.hidden = !!displayed;
    this.scriptOutput.hidden = !displayed;
    this.scriptInputBar.hidden = !displayed || displayed.state !== "Running" || displayed.isTask;
    this.showScriptOutput();
  }

  selectScript(path) {
    this.scripts.selected = path || null;
    this.pickChild();
    this.renderScripts();
    this.scriptToEnd();
  }

  selectScriptChild(path) {
    this.scripts.child = path;
    this.renderScripts();
    this.scriptToEnd();
  }

  scriptToEnd() {
    if (this.scriptAuto) {
      this.scriptScroller.scrollTop = this.scriptScroller.scrollHeight;
    }
  }

  toggleScriptAuto() {
    this.scriptAuto = !this.scriptAuto;
    this.scriptAutoButton.classList.toggle("on", this.scriptAuto);
    this.scriptToEnd();
  }

  toggleChatAuto() {
    this.chatAuto = !this.chatAuto;
    this.chatAutoButton.classList.toggle("on", this.chatAuto);
    this.scrollToEnd();
  }

  async runScript(path) {
    this.showSide("script");
    const state = this.state();

    if (state !== "Ready") {
      this.scriptError.set(state === "Running" ? "A script is already running." : state === "Managing" ? "Wait for git to finish before running a script." : "Wait for the AI to finish before running a script.");
      return;
    }

    this.scripts.wanted = path;

    if (!(await attempt(() => this.connection.runScript(this.info.id, path), this.scriptError)).ok) {
      this.scripts.wanted = null;
    }
  }

  async stopScript() {
    if (this.scripts.selected) {
      await attempt(() => this.connection.stopScript(this.info.id, this.scripts.selected), this.scriptError);
    }
  }

  async sendScriptInput() {
    const displayed = this.scriptDisplayed();
    const text = this.scriptInput.value;

    if (!displayed || !text) {
      return;
    }

    this.scriptInput.value = "";

    if (!(await attempt(() => this.connection.sendScriptInput(this.info.id, displayed.path, text), this.scriptError)).ok && !this.scriptInput.value) {
      this.scriptInput.value = text;
    }
  }

  async removeScript() {
    if (this.scripts.selected) {
      await attempt(() => this.connection.removeScript(this.info.id, this.scripts.selected), this.scriptError);
    }
  }

  copyScriptOutput() {
    const displayed = this.scriptDisplayed();

    if (displayed) {
      navigator.clipboard?.writeText(displayed.output);
    }
  }

  applyState() {
    const state = this.state();
    const previous = this.lastState ?? "Ready";
    this.lastState = state;

    if (previous === "Ready" && state !== "Ready") {
      this.busySince = Date.now();
    } else if (previous !== "Ready" && state === "Ready" && Date.now() - this.busySince >= 2000) {
      ding();
    }

    this.gitBar.hidden = state !== "Managing";
    this.input.placeholder = state === "Running" ? "A script is running, wait for it to finish" : state === "Managing" ? "Git is working, wait for it to finish" : "Enter query...";
    this.updateSend();
    this.home.updateWorking(this);
  }

  dispose() {
    this.connection.listeners.delete(this.listener);
    document.removeEventListener("keydown", this.keyListener);
    document.removeEventListener("click", this.menuListener);
    this.stopSync();
  }

  setWorking(value) {
    this.working = value;

    if (value && this.gitWorking()) {
      this.showSide("chat");
    }

    this.applyState();
  }

  async loadChat() {
    const result = await attempt(() => this.connection.getHistory(this.info.id, null, historyChunk), this.chatError);

    if (result.ok) {
      this.messages = [...result.value.messages];
      this.first = result.value.start;
      this.setWorking(result.value.working === true);
      this.renderMessages();
    }

    this.loaded = true;

    for (const event of this.early) {
      this.apply(event);
    }

    this.early = [];
  }

  async loadOlder() {
    if (this.first <= 0 || this.loadingOlder) {
      return;
    }

    this.loadingOlder = true;

    try {
      const result = await attempt(() => this.connection.getHistory(this.info.id, this.first, historyChunk), this.chatError);

      if (result.ok && result.value.messages.length > 0) {
        const height = this.scroller.scrollHeight;
        const top = this.scroller.scrollTop;
        this.messages.unshift(...result.value.messages);
        this.first = result.value.start;
        this.list.prepend(...result.value.messages.map(message => this.messageElement(message)));
        this.scroller.scrollTop = top + (this.scroller.scrollHeight - height);
      }
    } finally {
      this.loadingOlder = false;
    }
  }

  receive(event) {
    if (event.workspaceId !== this.info.id) {
      return;
    }

    if (event.kind === "ScriptChanged" || event.kind === "ScriptOutput" || event.kind === "ScriptRemoved") {
      this.receiveScript(event);
      return;
    }

    if (event.kind === "FilesChanged") {
      this.refreshFiles(event.path);
      this.refreshGit();
      return;
    }

    if (event.kind === "GitChanged" || (event.kind === "WorkingChanged" && event.working === false)) {
      this.refreshGit(event.kind === "GitChanged");
    }

    if (this.loaded) {
      this.apply(event);
    } else {
      this.early.push(event);
    }
  }

  apply(event) {
    if (event.kind === "MessageAdded" && event.message && typeof event.index === "number") {
      const end = this.first + this.messages.length;

      if (event.index === end) {
        this.messages.push(event.message);
        this.appendMessage(event.message);
      } else if (event.index > end) {
        this.loadChat();
      }
    } else if (event.kind === "WorkingChanged") {
      this.setWorking(event.working === true);
    } else if (event.kind === "Failed") {
      this.chatError.set(event.error);
    }
  }

  messageElement(message) {
    const user = message.role === "User";

    if (!user) {
      return h("div", { class: "msg assistant" }, h("div", { class: "bubble md" }, ...renderMarkdown(message.text).childNodes));
    }

    const { body, files } = splitAttachments(message.text);
    return h("div", { class: "msg user" }, h("div", { class: "bubble" },
      ...(body.length > 0 ? [h("div", { class: "body" }, body)] : []),
      ...(files.length > 0 ? [h("div", { class: "attached" }, ...files.map(file => h("div", { class: "chip", title: file.path }, icon("attach"), h("span", { class: "name" }, file.name))))] : [])));
  }

  renderMessages() {
    this.list.replaceChildren(...this.messages.map(message => this.messageElement(message)));
    this.scrollToEnd(true);
  }

  appendMessage(message) {
    this.list.append(this.messageElement(message));
    this.scrollToEnd();
  }

  scrolled() {
    if (this.scroller.clientHeight === 0) {
      return;
    }

    if (this.scroller.scrollTop < 40) {
      this.loadOlder();
    }
  }

  scrollToEnd(force = false) {
    if (force || this.chatAuto) {
      requestAnimationFrame(() => {
        this.scroller.scrollTop = this.scroller.scrollHeight;
      });
    }
  }

  resizeInput(event) {
    event.preventDefault();
    const startY = event.clientY;
    const startHeight = this.box.offsetHeight;
    const move = moved => {
      const limit = Math.max(60, this.chatBody.clientHeight - 120);
      this.box.style.height = `${Math.min(limit, Math.max(60, startHeight + startY - moved.clientY))}px`;
      this.restoreHeight = null;
    };
    const stop = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", stop);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", stop);
  }

  async pickFiles() {
    await this.attach([...this.fileInput.files]);
    this.fileInput.value = "";
  }

  pasted(event) {
    const files = [...(event.clipboardData?.files ?? [])];

    if (files.length > 0) {
      event.preventDefault();
      this.attach(files);
    }
  }

  async attach(files) {
    for (const file of files) {
      if (file.size === 0 || file.size > maxAttachment) {
        this.chatError.set(`${file.name} is empty or larger than ${maxAttachment / 1024 / 1024} MB.`);
        continue;
      }

      this.chatError.set(null);
      this.attachments.push({ name: file.name || "pasted-image.png", file });
    }

    this.renderAttachments();
  }

  renderAttachments() {
    this.chips.replaceChildren(...this.attachments.map(attachment => h("div", { class: "chip" },
      icon("file"),
      h("span", { class: "name" }, attachment.name),
      h("button", { class: "flat icon", title: "Remove", onclick: () => { this.attachments = this.attachments.filter(other => other !== attachment); this.renderAttachments(); } }, icon("close")))));
    this.chips.hidden = this.attachments.length === 0;
    this.inputChanged();
  }

  async encode(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let binary = "";

    for (let index = 0; index < bytes.length; index += 32768) {
      binary += String.fromCharCode(...bytes.subarray(index, index + 32768));
    }

    return btoa(binary);
  }

  fitInput() {
    this.input.style.height = "0";
    const wanted = this.input.scrollHeight;
    this.input.style.height = `${wanted}px`;
    const current = this.box.offsetHeight;

    if (this.input.value.length === 0) {
      if (this.restoreHeight !== null) {
        this.box.style.height = `${this.restoreHeight}px`;
        this.restoreHeight = null;
      }
    } else if (wanted + 8 > current + 1) {
      this.restoreHeight ??= current;
      this.box.style.height = `${Math.min(Math.max(current, this.chatBody.clientHeight - 120), wanted + 8)}px`;
    }
  }

  inputChanged() {
    this.fitInput();
    this.updateSend();
    this.saveDraft();
  }

  takesAiInput() {
    const state = this.state();
    return state === "Ready" || state === "Working";
  }

  updateSend() {
    this.sendButton.disabled = !this.takesAiInput() || (this.input.value.trim().length === 0 && this.attachments.length === 0);
  }

  keyed(event) {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing && matchMedia("(pointer: fine)").matches) {
      event.preventDefault();
      this.send();
    }
  }

  async send() {
    const text = this.input.value.trim();
    const sending = this.attachments;

    if ((!text && sending.length === 0) || !this.takesAiInput()) {
      return;
    }

    this.input.value = "";
    this.fitInput();
    this.saveDraft();
    this.attachments = [];
    this.renderAttachments();
    const result = await attempt(async () => {
      const lines = text ? [text] : [];

      for (const attachment of sending) {
        lines.push(`Attached file: ${await this.connection.uploadAttachment(this.info.id, attachment.name, await this.encode(attachment.file))}`);
      }

      await this.connection.prompt(this.info.id, lines.join("\n"));
    }, this.chatError);

    if (!result.ok && this.input.value.length === 0 && this.attachments.length === 0) {
      this.input.value = text;
      this.saveDraft();
      this.fitInput();
      this.attachments = sending;
      this.renderAttachments();
    }
  }

  syncNodes(old, entries) {
    return entries.map(entry => old.find(node => node.entry.path === entry.path && node.entry.isFolder === entry.isFolder) ?? { entry, expanded: false, loaded: false, children: [] });
  }

  expandedPaths(nodes) {
    return nodes.filter(node => node.entry.isFolder && node.expanded && node.loaded).flatMap(node => [node.entry.path, ...this.expandedPaths(node.children)]);
  }

  findNode(nodes, path) {
    for (const node of nodes.filter(item => item.entry.isFolder && item.expanded && item.loaded)) {
      const found = node.entry.path === path ? node : this.findNode(node.children, path);

      if (found) {
        return found;
      }
    }

    return null;
  }

  async watch() {
    const paths = [...new Set([this.files?.path ?? "", ...this.expandedPaths(this.nodes)])];

    if (JSON.stringify(paths) !== JSON.stringify(this.watched)) {
      const result = await attempt(() => this.connection.watchFiles(this.info.id, paths), this.filesError);

      if (result.ok) {
        this.watched = paths;
      }
    }
  }

  async loadRoot(path, newRoot = true) {
    if (path === undefined || path === null) {
      return;
    }

    const result = await attempt(() => this.connection.listFiles(this.info.id, path, this.showHidden), this.filesError);

    if (result.ok) {
      this.files = result.value;
      this.nodes = this.syncNodes(newRoot ? [] : this.nodes, this.files.entries);
      this.applyChangesMode();
      this.renderTree();
      await this.watch();
      this.reveal();
    }
  }

  openPath() {
    return this.preview?.path ?? this.diffState?.path ?? null;
  }

  async reveal() {
    const path = this.openPath();

    if (path !== null) {
      const parts = path.split("/");
      let level = this.nodes;
      let changed = false;

      for (let i = 0; i < parts.length - 1; i++) {
        const folder = level.find(node => node.entry.isFolder && node.entry.path === parts.slice(0, i + 1).join("/"));

        if (!folder) {
          break;
        }

        if (!folder.loaded) {
          await this.loadNode(folder);
        }

        changed ||= !folder.expanded;
        folder.expanded = true;
        level = folder.children;
      }

      if (changed) {
        await this.watch();
      }
    }

    this.renderTree();
    this.fileList.querySelector(".row.on")?.scrollIntoView({ block: "nearest" });
  }

  copyPath(node, absolute) {
    const folder = this.info.folder.replace(/[\\/]+$/, "");
    const separator = this.info.folder.includes("\\") && !this.info.folder.includes("/") ? "\\" : "/";
    const text = absolute ? folder + separator + node.entry.path.replaceAll("/", separator) : node.entry.path;
    navigator.clipboard?.writeText(text);
  }

  async loadNode(node) {
    const result = await attempt(() => this.connection.listFiles(this.info.id, node.entry.path, this.showHidden), this.filesError);

    if (result.ok) {
      node.children = this.syncNodes(node.children, result.value.entries);
      node.loaded = true;

      for (const child of node.children.filter(item => item.entry.isFolder && item.expanded)) {
        await this.loadNode(child);
      }
    } else {
      node.expanded = false;
    }
  }

  renderTree() {
    const scroll = this.fileList.scrollTop;
    const open = this.openPath();
    const active = new Set(this.scriptList().filter(entry => this.scriptActive(entry)).map(entry => entry.path));
    const runnable = node => !node.entry.isFolder && /\.(cs|task)$/i.test(node.entry.name);
    const rows = (nodes, depth) => nodes.flatMap(node => [
      h("div", {
        class: `row${this.statusClass(this.statusOf(node.entry.path, node.entry.isFolder))}${!node.entry.isFolder && node.entry.path === open ? " on" : ""}${runnable(node) && active.has(node.entry.path) ? " running" : ""}`,
        style: `padding-left:${8 + depth * 16}px`,
        onclick: () => this.choose(node),
        ondblclick: () => runnable(node) && this.runScript(node.entry.path),
        oncontextmenu: event => {
          event.preventDefault();
          this.showMenu(event, [{ label: "Copy Name", action: () => navigator.clipboard?.writeText(node.entry.name) }, { label: "Copy Relative Path", action: () => this.copyPath(node, false) }, { label: "Copy Absolute Path", action: () => this.copyPath(node, true) }]);
        } },
        h("span", { class: "slot" }, icon(node.entry.isFolder ? "folder" : runnable(node) ? (/\.task$/i.test(node.entry.name) ? "task" : "script") : "file")),
        h("div", { class: "name" }, node.entry.name)),
      ...(node.entry.isFolder && node.expanded ? rows(node.children, depth + 1) : []),
    ]);

    this.fileList.replaceChildren(...rows(this.nodes, 0));
    this.fileList.scrollTop = scroll;
  }

  async choose(node) {
    if (node.entry.isFolder) {
      node.expanded = !node.expanded;
      node.loaded = node.expanded && node.loaded;

      if (node.expanded) {
        await this.loadNode(node);
      }

      this.renderTree();
      await this.watch();
      return;
    }

    const result = await attempt(() => this.connection.readFile(this.info.id, node.entry.path), this.filesError);

    if (result.ok) {
      this.showPreview(result.value);
    }
  }

  async collapseAll() {
    const collapse = nodes => nodes.forEach(node => {
      collapse(node.children);
      node.expanded = false;
      node.loaded = false;
    });

    collapse(this.nodes);
    this.renderTree();

    if (this.changesMode) {
      const folders = nodes => nodes.filter(node => node.children).flatMap(node => [node.path, ...folders(node.children)]);

      for (const path of folders(this.changeTree())) {
        this.changeCollapsed.add(path);
      }

      this.renderChanges();
    }

    await this.watch();
  }

  isMarkdown() {
    return /\.(md|markdown)$/i.test(this.preview?.path ?? "");
  }

  showPreview(content) {
    const other = this.preview?.path !== content.path;
    this.preview = content;
    this.previewTitle.textContent = content.truncated ? `${content.path} (first part only)` : content.path;
    const markdown = this.isMarkdown();
    this.diffState = null;
    this.previewKind.textContent = "";
    this.previewKind.hidden = true;
    this.previewNote.hidden = true;
    this.previewDiff.hidden = true;
    this.previewCode.hidden = markdown;
    this.previewMarkdown.hidden = !markdown;
    this.findToggle.hidden = false;
    this.wrapButton.hidden = markdown;
    this.tokens = markdown ? [] : highlightSyntax(content.path, content.text);
    this.gutter.textContent = markdown ? "" : Array.from({ length: content.text.split("\n").length }, (_, i) => i + 1).join("\n");
    this.previewPane.hidden = false;
    this.placeholder.hidden = true;
    this.reveal();

    this.search(other, other);
  }

  closePreview() {
    this.preview = null;
    this.diffState = null;
    this.previewDiff.hidden = true;
    this.setFind(false);
    this.previewPane.hidden = true;
    this.placeholder.hidden = false;
    this.renderTree();
  }

  setWrap(wrap) {
    this.wrap = wrap;
    this.previewPane.classList.toggle("wrap", wrap);
    this.wrapButton.classList.toggle("on", wrap);
    this.renderCode(false);
  }

  setFind(open) {
    this.find.open = open;
    this.findBar.hidden = !open;
    this.findToggle.classList.toggle("on", open);

    if (open) {
      this.findInput.focus();
      this.findInput.select();
    }

    this.search(true, true);
  }

  findKeyed(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      this.stepFind(event.shiftKey ? -1 : 1);
    } else if (event.key === "Escape") {
      this.setFind(false);
    }
  }

  stepFind(direction) {
    const count = this.find.starts.length;

    if (count > 0) {
      this.find.current = (this.find.current + direction + count) % count;
      this.renderCode(true);
    }
  }

  search(restart, navigate) {
    const find = this.find;
    const markdown = this.isMarkdown();
    const target = markdown ? this.layoutMarkdown() : null;
    find.starts = find.open && this.preview ? findMatches(markdown ? target.plain : this.preview.text, find.query, find.matchCase, find.wholeWord) : [];
    find.current = find.starts.length === 0 ? -1 : restart ? 0 : Math.min(Math.max(find.current, 0), find.starts.length - 1);
    this.renderCode(navigate && find.current >= 0, target);
  }

  layoutMarkdown() {
    this.previewMarkdown.replaceChildren(...renderMarkdown(this.preview.text).childNodes);
    const walker = document.createTreeWalker(this.previewMarkdown, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let plain = "";
    let last = null;

    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      const block = node.parentElement.closest("p, h1, h2, h3, h4, h5, h6, li, td, th, pre");

      if (nodes.length > 0 && block !== last) {
        plain += "\n";
      }

      last = block;
      nodes.push({ node, start: plain.length });
      plain += node.data;
    }

    return { nodes, plain };
  }

  markMarkdown(nodes) {
    const find = this.find;
    let at = 0;

    for (const { node, start } of nodes) {
      const end = start + node.data.length;

      while (at < find.starts.length && find.starts[at] + find.query.length <= start) {
        at++;
      }

      const pieces = [];
      let cursor = 0;

      for (let i = at; i < find.starts.length && find.starts[i] < end; i++) {
        const from = Math.max(find.starts[i], start) - start;
        const to = Math.min(find.starts[i] + find.query.length, end) - start;
        pieces.push(node.data.slice(cursor, from), h("span", { class: i === find.current ? "find current" : "find" }, node.data.slice(from, to)));
        cursor = to;
      }

      if (pieces.length > 0) {
        pieces.push(node.data.slice(cursor));
        node.replaceWith(...pieces);
      }
    }
  }

  renderCode(navigate, target) {
    if (!this.preview) {
      return;
    }

    const find = this.find;
    this.caseButton.classList.toggle("on", find.matchCase);
    this.wordButton.classList.toggle("on", find.wholeWord);
    this.findCount.textContent = !find.open || !find.query ? "" : find.starts.length === 0 ? "No results" : `${find.current + 1} of ${find.starts.length}`;

    if (this.isMarkdown()) {
      this.markMarkdown((target ?? this.layoutMarkdown()).nodes);

      if (navigate) {
        this.previewMarkdown.querySelector(".find.current")?.scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      return;
    }

    this.source.style.setProperty("--digits", String(this.preview.text.split("\n").length).length);
    this.source.replaceChildren(...codeNodes(this.preview.text, this.tokens, find.starts, find.query.length, find.current, this.wrap));

    if (navigate) {
      this.source.querySelector(".find.current")?.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  async refreshFiles(path) {
    if (path === this.files?.path) {
      await this.loadRoot(path, false);
    } else if (this.findNode(this.nodes, path)) {
      await this.loadNode(this.findNode(this.nodes, path));
      this.renderTree();
    }

    if (this.preview && this.preview.path.slice(0, Math.max(this.preview.path.lastIndexOf("/"), 0)) === path) {
      const result = await attempt(() => this.connection.readFile(this.info.id, this.preview.path), this.filesError);

      if (result.ok) {
        this.showPreview(result.value);
      } else {
        this.closePreview();
      }
    }
  }

  statusClass(status) {
    return status ? ` ${status.toLowerCase()}` : "";
  }

  statusOf(path, isFolder) {
    if (this.gitStatus.isRepo && (path === ".git" || path.startsWith(".git/"))) {
      return "Ignored";
    }

    for (const change of this.gitChanges) {
      if (change.status === "Ignored") {
        if (change.path === path || change.path === `${path}/` || (change.path.endsWith("/") && path.startsWith(change.path))) {
          return "Ignored";
        }
      } else if (change.path === path) {
        return change.status;
      }
    }

    if (!isFolder) {
      return null;
    }

    const prefix = `${path}/`;
    const inside = this.gitChanges.filter(change => change.status !== "Ignored" && change.path.startsWith(prefix));
    return inside.length === 0 ? null : inside.every(change => change.status === "Added") ? "Added" : "Modified";
  }

  async refreshGit(refs = false) {
    this.gitRefs = this.gitRefs || refs;

    if (this.gitRefreshing) {
      this.gitAgain = true;
      return;
    }

    this.gitRefreshing = true;

    try {
      do {
        this.gitAgain = false;
        const reload = this.gitRefs;
        this.gitRefs = false;
        await this.readGit(reload);
      } while (this.gitAgain);
    } finally {
      this.gitRefreshing = false;
    }
  }

  async readGit(reload) {
    try {
      const status = await this.connection.getGitStatus(this.info.id);
      const changes = status.isRepo ? await this.connection.getGitChanges(this.info.id) : [];
      const before = this.gitStatus;
      const moved = status.commit !== before.commit || status.branch !== before.branch || status.tag !== before.tag || status.isRepo !== before.isRepo;
      this.gitStatus = status;
      this.gitChanges = changes;

      if (!status.isRepo) {
        this.changesMode = false;
      }

      this.renderGit();

      if ((moved || reload) && this.history.loaded) {
        await this.loadHistory(true);
      }

      if (this.diffState && this.diffState.commit === null) {
        await this.openDiff(this.diffState.path, null, true);
      }
    } catch (exception) {
    }
  }

  renderGit() {
    const status = this.gitStatus;
    this.versionWrap.hidden = !status.isRepo;
    this.changesToggle.hidden = !status.isRepo;
    this.historyTab.hidden = !status.isRepo;
    this.versionTitle.textContent = status.branch ?? status.tag ?? (status.commit ? "Detached head" : "No commits");
    const tag = status.branch ? status.tag : null;
    this.versionTag.textContent = tag ?? "";
    this.versionTag.hidden = !tag;
    this.versionMessage.textContent = status.message ?? "";
    this.versionHash.textContent = status.commit ?? "";
    this.versionStar.hidden = !status.hasChanges;
    this.versionButton.classList.toggle("pending", !!status.hasChanges);

    if (!status.isRepo && this.side === "history") {
      this.showSide("chat");
    }

    this.applyChangesMode();
    this.renderTree();
    this.renderChanges();
    this.applyState();
  }

  applyChangesMode() {
    this.changeList.hidden = !this.changesMode || this.searchOpen;
    this.fileList.hidden = this.changesMode || this.searchOpen;
    this.pathLabel.hidden = !this.changesMode;
    this.changesToggle.classList.toggle("on", this.changesMode);
  }

  setSearch(open) {
    this.searchOpen = open;
    this.searchToken++;
    this.searchToggle.classList.toggle("on", open);
    this.searchPane.hidden = !open;
    this.searchInput.value = "";
    this.searchList.replaceChildren();
    this.searchEmpty.hidden = true;
    this.applyChangesMode();

    if (open) {
      this.searchInput.focus();
      this.runSearch();
    }
  }

  runSearch() {
    const token = ++this.searchToken;
    const text = this.searchInput.value;
    const content = this.searchContent.checked;

    if (content && text.length === 0) {
      this.searchList.replaceChildren();
      this.searchEmpty.hidden = true;
      return;
    }

    setTimeout(async () => {
      if (token !== this.searchToken) {
        return;
      }

      const result = await attempt(() => this.connection.searchFiles(this.info.id, text, content, this.showHidden), this.filesError);

      if (result.ok && token === this.searchToken) {
        this.searchEmpty.hidden = result.value.length > 0;
        this.searchList.replaceChildren(...result.value.map(hit => {
          const name = hit.path.slice(hit.path.lastIndexOf("/") + 1);
          const folder = hit.path.includes("/") ? hit.path.slice(0, hit.path.lastIndexOf("/")) : "";
          return h("button", { class: "flat hit", onclick: () => this.chooseHit(hit, text) },
            h("div", { class: "primary" }, hit.line ? hit.text : name),
            h("div", { class: "muted small secondary" }, hit.line ? `${hit.path}:${hit.line}` : folder));
        }));
      }
    }, 200);
  }

  async chooseHit(hit, text) {
    this.setSearch(false);
    const result = await attempt(() => this.connection.readFile(this.info.id, hit.path), this.filesError);

    if (!result.ok) {
      return;
    }

    this.showPreview(result.value);

    if (hit.line) {
      this.find.query = text;
      this.findInput.value = text;
      this.setFind(true);
      const index = this.isMarkdown() ? -1 : this.find.starts.findIndex(start => result.value.text.slice(0, start).split("\n").length === hit.line);

      if (index >= 0) {
        this.find.current = index;
        this.renderCode(true);
      }
    }
  }

  async setShowHidden(on) {
    this.showHidden = on;
    this.hiddenToggle.classList.toggle("on", on);
    await this.loadRoot(this.files?.path ?? "", false);

    for (const node of this.nodes.filter(item => item.entry.isFolder && item.expanded)) {
      await this.loadNode(node);
    }

    this.renderTree();
    await this.watch();
  }

  setChangesMode(on) {
    this.changesMode = on && !!this.gitStatus.isRepo;
    this.applyChangesMode();
    this.renderChanges();
  }

  changeTree(changes = this.gitChanges.filter(change => change.status !== "Ignored"), commit = null) {
    const root = { children: [] };

    for (const change of changes) {
      const parts = change.path.split("/").filter(part => part);
      let current = root;

      parts.forEach((name, index) => {
        const last = index === parts.length - 1;
        let node = current.children.find(child => child.name === name && (child.children !== undefined) === !last);

        if (!node) {
          const path = parts.slice(0, index + 1).join("/");
          node = last ? { name, path, status: change.status, commit } : { name, path, children: [] };
          current.children.push(node);
        }

        current = node;
      });
    }

    const sort = nodes => {
      nodes.sort((a, b) => (a.children !== undefined) !== (b.children !== undefined) ? (a.children !== undefined ? -1 : 1) : a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
      nodes.forEach(node => node.children && sort(node.children));
    };

    sort(root.children);
    return root.children;
  }

  changeRows(nodes, depth, key, collapsed, open, redraw) {
    return nodes.flatMap(node => [
      h("div", {
        class: `crow${node.children ? "" : this.statusClass(node.status)}`,
        style: `padding-left:${8 + depth * 16}px`,
        onclick: () => {
          if (!node.children) {
            open(node);
            return;
          }

          if (!collapsed.delete(key + node.path)) {
            collapsed.add(key + node.path);
          }

          redraw();
        },
      }, h("span", { class: "slot" }, icon(node.children ? "folder" : "file")), h("div", { class: "name" }, node.name)),
      ...(node.children && !collapsed.has(key + node.path) ? this.changeRows(node.children, depth + 1, key, collapsed, open, redraw) : []),
    ]);
  }

  renderChanges() {
    if (!this.changesMode) {
      return;
    }

    const scroll = this.changeList.scrollTop;
    this.changeList.replaceChildren(...this.changeRows(this.changeTree(), 0, "", this.changeCollapsed, node => this.openDiff(node.path, null), () => this.renderChanges()));
    this.changeList.scrollTop = scroll;
  }

  async openDiff(path, commit, quiet = false) {
    const result = await attempt(() => this.connection.getGitDiff(this.info.id, path, commit), quiet ? new ErrorLine() : this.filesError);

    if (result.ok) {
      this.showDiff(result.value, path, commit);
    }
  }

  showDiff(diff, path, commit) {
    this.preview = null;
    this.setFind(false);
    this.diffState = { path, commit: commit ?? null };
    this.previewTitle.textContent = commit ? `${path} (${commit.slice(0, 7)})` : `${path} (changes)`;
    this.previewKind.textContent = "Diff";
    this.previewKind.hidden = false;
    this.previewNote.hidden = false;
    this.previewCode.hidden = true;
    this.previewMarkdown.hidden = true;
    this.findToggle.hidden = true;
    this.wrapButton.hidden = false;
    const marker = { Added: "+ ", Removed: "- " };
    const lines = diff.isBinary ? [h("div", { class: "diff-note" }, "Binary file.")] : diff.lines.length === 0 ? [h("div", { class: "diff-note" }, "No changes.")] : diff.lines.map(line => h("div", { class: `dl${line.kind === "Added" ? " added" : line.kind === "Removed" ? " removed" : ""}` },
      h("span", { class: "n" }, line.oldNumber ?? ""),
      h("span", { class: "n" }, line.newNumber ?? ""),
      h("span", { class: "mk" }, marker[line.kind] ?? "  "),
      h("span", { class: "tx" }, line.text)));

    if (diff.truncated) {
      lines.push(h("div", { class: "diff-note" }, "(the rest of the file is not shown)"));
    }

    this.previewDiff.replaceChildren(...lines);
    this.previewDiff.hidden = false;
    this.previewPane.hidden = false;
    this.placeholder.hidden = true;
    this.reveal();
  }

  showSide(name) {
    this.side = name === "history" && this.gitStatus.isRepo ? "history" : name === "script" ? "script" : "chat";
    this.chatBody.hidden = this.side !== "chat";
    this.scriptBody.hidden = this.side !== "script";
    this.historyBody.hidden = this.side !== "history";
    this.chatTab.classList.toggle("on", this.side === "chat");
    this.scriptTab.classList.toggle("on", this.side === "script");
    this.historyTab.classList.toggle("on", this.side === "history");

    if (this.side === "history") {
      this.syncOnce();
    }

    if (this.side === "history" && !this.history.loaded) {
      this.loadHistory(true);
    } else if (this.side === "chat") {
      this.scrollToEnd();
    } else if (this.side === "script") {
      this.scriptToEnd();
    }
  }

  async loadHistory(reset) {
    const skip = reset ? 0 : this.history.commits.length;
    const limit = reset ? Math.max(this.history.commits.length, historyChunk) : historyChunk;
    const result = await attempt(() => this.connection.getGitHistory(this.info.id, skip, limit), this.historyError);

    if (!result.ok) {
      return;
    }

    this.history.commits = reset ? [...result.value.commits] : [...this.history.commits, ...result.value.commits];
    this.history.hasMore = result.value.hasMore === true;
    this.history.loaded = true;
    this.renderHistory();
  }

  async toggleCommit(commit) {
    if (this.history.open.delete(commit.hash)) {
      this.renderHistory();
      return;
    }

    this.history.open.add(commit.hash);
    const existing = this.history.changes.get(commit.hash);

    if (!existing || existing.error) {
      const entry = { loading: true, error: null, list: [] };
      this.history.changes.set(commit.hash, entry);
      this.renderHistory();

      try {
        entry.list = await this.connection.getGitCommitChanges(this.info.id, commit.hash);
      } catch (exception) {
        entry.error = exception.message;
      }

      entry.loading = false;
    }

    this.renderHistory();
  }

  renderHistory() {
    const graph = layoutGraph(this.history.commits);
    const items = this.history.commits.map((commit, index) => {
      const current = this.gitStatus.branch ?? null;
      const row = graph.rows[index];
      const branchOf = ref => ref.kind === "Remote" && ref.name.includes("/") ? ref.name.slice(ref.name.indexOf("/") + 1) : ref.name;
      const shown = (commit.refs ?? []).filter(ref => !(ref.kind === "Remote" && commit.refs.some(other => other.kind === "Branch" && other.name === branchOf(ref))));
      const refs = shown.length > 0
        ? h("div", { class: "refs" }, shown.map(ref => {
          const remotes = ref.kind === "Branch" ? commit.refs.filter(other => other.kind === "Remote" && other.name.includes("/") && branchOf(other) === ref.name).map(other => other.name.slice(0, other.name.indexOf("/"))) : [];
          const badge = h("span", { class: `ref${ref.kind === "Tag" ? " tag" : ref.kind === "Remote" ? " remote" : ref.isCurrent ? " current" : ""}` }, ref.name, remotes.length > 0 ? h("span", { class: "remote-part" }, remotes.join(", ")) : null);
          badge.style.borderColor = graphColors[row.color % graphColors.length];
          return h("button", { class: "refbtn", onclick: () => this.toggleCommit(commit), oncontextmenu: event => { event.preventDefault(); this.refMenu(event, ref, current); } }, badge);
        }))
        : null;
      const date = new Date(commit.date).toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
      const main = h("div", { class: "main", title: commit.hash, onclick: () => this.toggleCommit(commit), oncontextmenu: event => { event.preventDefault(); this.showMenu(event, [{ label: "Checkout this commit", action: () => this.checkout(commit.hash) }]); } },
        refs,
        h("div", { class: "subject" }, commit.subject),
        h("div", { class: "author" }, commit.author),
        h("div", { class: "when" }, date),
        h("div", { class: "hash" }, commit.hash.slice(0, 7)));
      let expanded = null;

      if (this.history.open.has(commit.hash)) {
        const entry = this.history.changes.get(commit.hash);
        const done = entry && !entry.loading && !entry.error;
        expanded = h("div", { class: "commit-changes" },
          entry?.loading ? h("div", { class: "muted small" }, "Loading changes…") : null,
          entry?.error ? h("div", { class: "error small" }, entry.error) : null,
          done && entry.list.length === 0 ? h("div", { class: "muted small" }, "No changes") : null,
          done ? this.changeRows(this.changeTree(entry.list, commit.hash), 0, `${commit.hash}:`, this.history.collapsed, node => this.openDiff(node.path, commit.hash), () => this.renderHistory()) : null);
      }

      return h("div", { class: "commit" }, graphCell(row, graph.lanes), main, expanded);
    });

    this.historyList.replaceChildren(
      ...(this.history.loaded && this.history.commits.length === 0 ? [h("div", { class: "muted", style: "padding:4px 8px" }, "No commits yet.")] : []),
      ...items,
      ...(this.history.hasMore ? [h("button", { class: "block", style: "margin-top:8px", onclick: () => this.loadHistory(false) }, "Load older commits")] : []));
  }

  askGit({ title, body = null, confirm, input = null, text = "", email = false, destructive = false, empty = "", action, then }) {
    if (this.refuseWork()) {
      return;
    }

    let shown = null;
    const go = async () => {
      const value = nameBox ? nameBox.value.trim() : "";
      const mail = emailBox ? emailBox.value.trim() : "";

      if (nameBox && !value) {
        this.home.dialogError.set(empty);
        return;
      }

      if (emailBox && !mail) {
        this.home.dialogError.set("Enter your name and email.");
        return;
      }

      const run = async () => {
        this.localBusy = true;
        this.renderGit();

        try {
          return await action(value, mail);
        } finally {
          this.localBusy = false;
          this.refreshGit(true);
        }
      };
      const mine = shown;
      this.home.dialogHost.hidden = true;
      const result = await attempt(run, this.home.dialogError);

      if (result.ok) {
        if (this.home.dialogHost.firstChild === mine) {
          this.home.closeDialog();
        }

        if (then) {
          await then();
        }
      } else if (this.home.dialogHost.firstChild === mine) {
        this.home.dialogHost.hidden = false;
      }
    };
    const nameBox = input === null ? null : this.home.nameBox(text, go);
    const emailBox = email ? this.home.nameBox("", go) : null;

    if (nameBox) {
      nameBox.placeholder = input;
    }

    if (emailBox) {
      emailBox.placeholder = "Email";
    }

    this.home.dialog(title, body, nameBox, emailBox, h("button", { class: `${destructive ? "danger" : "primary"} block`, onclick: go }, confirm));
    shown = this.home.dialogHost.firstChild;
  }

  withIdentity(next) {
    if (this.gitStatus.hasIdentity !== false) {
      return next();
    }

    this.askGit({
      title: "Git identity",
      body: "Git needs your name and email to commit.",
      confirm: "Save",
      input: "Name",
      email: true,
      empty: "Enter your name and email.",
      action: (name, mail) => this.connection.gitSetIdentity(this.info.id, name, mail),
      then: next,
    });
  }

  beginGit(kind) {
    const status = this.gitStatus;
    const id = this.info.id;

    if (kind === "reset") {
      this.askGit({ title: "Reset", body: "Discard all changes that are not committed, new files included? This cannot be undone.", confirm: "Discard", destructive: true, action: () => this.connection.gitReset(id) });
    } else if (kind === "commit") {
      this.withIdentity(() => this.askGit({ title: "Commit", confirm: "Commit", input: "Message", empty: "Enter a commit message.", action: text => this.connection.gitCommit(id, text) }));
    } else if (kind === "branch") {
      this.askGit({ title: "New branch", confirm: "Create branch", input: "Branch name", empty: "Enter a name.", action: text => this.connection.gitCreateBranch(id, text) });
    } else if (kind === "tag") {
      this.withIdentity(() => this.askGit({ title: "New tag", confirm: "Create tag", input: "Tag name", empty: "Enter a name.", action: text => this.connection.gitCreateTag(id, text) }));
    } else {
      this.askGit({ title: "Git remote", confirm: "Set remote", input: status.isRepo ? "Remote URL" : "Remote URL (makes the workspace a git repository)", text: status.remote ?? "", empty: "Enter the remote URL.", action: text => this.connection.gitSetRemote(id, text) });
    }
  }

  checkout(name) {
    const discard = this.gitStatus.hasChanges === true;
    const shown = /^[0-9a-f]{12,}$/i.test(name) ? name.slice(0, 7) : name;
    this.askGit({
      title: "Checkout",
      body: discard ? `Check out '${shown}'? This will discard your pending changes.` : `Check out '${shown}'?`,
      confirm: discard ? "Discard and checkout" : "Checkout",
      destructive: discard,
      action: () => this.connection.gitCheckout(this.info.id, name, discard),
    });
  }

  deleteBranch(name) {
    this.askGit({ title: "Delete branch", body: `Delete branch '${name}'? This cannot be undone.`, confirm: "Delete", destructive: true, action: () => this.connection.gitDeleteBranch(this.info.id, name) });
  }

  deleteTag(name) {
    this.askGit({ title: "Delete tag", body: `Delete tag '${name}'? This cannot be undone.`, confirm: "Delete", destructive: true, action: () => this.connection.gitDeleteTag(this.info.id, name) });
  }

  async compare(branch, base) {
    this.localBusy = true;
    this.renderGit();

    try {
      return await this.connection.getGitBranchState(this.info.id, branch, base);
    } catch (exception) {
      this.home.notice("Git", exception.message);
      return null;
    } finally {
      this.localBusy = false;
      this.renderGit();
    }
  }

  askSquash(title, branch, base, state, confirm, run) {
    const commits = state.unique === 1 ? "1 commit" : `${state.unique} commits`;
    this.askGit({ title: `${title} '${branch}'`, body: `Message for the one commit replacing the ${commits} on '${branch}' that aren't on '${base}'`, confirm, input: "Message", text: state.subject ?? "", empty: "Enter a commit message.", action: run });
  }

  squash(branch, base) {
    this.withIdentity(async () => {
      const state = await this.compare(branch, base);

      if (!state) {
        return;
      }

      if (state.unique === 0) {
        this.home.notice("Squash", `'${branch}' has no commits that aren't already on '${base}'.`);
        return;
      }

      this.askSquash("Squash", branch, base, state, "Squash", message => this.connection.gitSquash(this.info.id, branch, base, message));
    });
  }

  rebase(branch, onto) {
    this.withIdentity(async () => {
      if (this.gitStatus.hasChanges) {
        this.home.notice("Rebase", "Commit or reset your pending changes first - this needs a clean working tree.");
        return;
      }

      const state = await this.compare(branch, onto);

      if (!state) {
        return;
      }

      if (state.unique === 0 && state.isBased) {
        this.home.notice("Rebase", `'${branch}' is already up to date with '${onto}'.`);
      } else if (state.unique > 1) {
        this.askSquash("Rebase", branch, onto, state, "Rebase", message => this.connection.gitRebase(this.info.id, branch, onto, message));
      } else {
        this.askGit({ title: "Rebase", body: `Rebase '${branch}' onto '${onto}'? Conflicts are resolved by the AI.`, confirm: "Rebase", action: () => this.connection.gitRebase(this.info.id, branch, onto, null) });
      }
    });
  }

  merge(source, target) {
    this.withIdentity(async () => {
      if (this.gitStatus.hasChanges) {
        this.home.notice("Merge", "Commit or reset your pending changes first - this needs a clean working tree.");
        return;
      }

      const state = await this.compare(source, target);

      if (!state) {
        return;
      }

      if (state.unique === 0) {
        this.home.notice("Merge", `'${source}' has no commits that aren't already on '${target}'.`);
      } else if (state.unique > 1) {
        this.askSquash("Merge", source, target, state, "Merge", message => this.connection.gitMerge(this.info.id, source, target, message));
      } else {
        this.askGit({ title: "Merge", body: `Merge '${source}' into '${target}'? '${source}' is deleted afterwards.`, confirm: "Merge", action: () => this.connection.gitMerge(this.info.id, source, target, null) });
      }
    });
  }

  async fetchGit() {
    if (this.refuseWork()) {
      return;
    }

    this.localBusy = true;
    this.renderGit();

    try {
      await this.connection.gitFetch(this.info.id);
    } catch (exception) {
      this.historyError.set(exception.message);
    } finally {
      this.localBusy = false;
      this.refreshGit(true);
    }
  }

  async cancelGit() {
    try {
      await this.connection.gitCancel(this.info.id);
    } catch (exception) {
    }
  }

  showMenu(event, items) {
    event.stopPropagation();
    document.querySelector(".ctx-menu")?.remove();
    const menu = h("div", { class: "menu-list ctx-menu", style: `position:fixed;left:${Math.min(event.clientX, innerWidth - 260)}px;top:${Math.min(event.clientY, innerHeight - 300)}px` },
      items.filter(item => item !== null).map(item => item === "-" ? h("hr") : h("button", { onclick: () => { menu.remove(); item.action(); } }, item.label)));
    document.body.append(menu);
    const close = () => { menu.remove(); document.removeEventListener("click", close); };
    setTimeout(() => document.addEventListener("click", close), 0);
  }

  refMenu(event, ref, current) {
    const target = ref.kind === "Remote" && ref.name.includes("/") ? ref.name.slice(ref.name.indexOf("/") + 1) : ref.name;
    const tag = ref.kind === "Tag";
    const relative = !tag && !ref.isCurrent && current && target !== current;
    const quote = (name, suffix = "") => `'${name}'${suffix}`;
    const cur = quote(current ?? "", " (current)");
    const sel = quote(target);
    this.showMenu(event, [
      ref.isCurrent ? null : { label: "Checkout", action: () => this.checkout(target) },
      relative ? "-" : null,
      relative ? { label: `Squash ${cur} since ${sel}`, action: () => this.squash(current, target) } : null,
      relative ? { label: `Squash ${sel} since ${cur}`, action: () => this.squash(target, current) } : null,
      relative ? "-" : null,
      relative ? { label: `Rebase ${cur} onto ${sel}`, action: () => this.rebase(current, target) } : null,
      relative ? { label: `Rebase ${sel} onto ${cur}`, action: () => this.rebase(target, current) } : null,
      relative ? "-" : null,
      relative ? { label: `Merge ${cur} into ${sel}`, action: () => this.merge(current, target) } : null,
      relative ? { label: `Merge ${sel} into ${cur}`, action: () => this.merge(target, current) } : null,
      ref.isCurrent ? null : "-",
      ref.isCurrent ? null : { label: "Delete", action: () => tag ? this.deleteTag(target) : this.deleteBranch(target) },
    ]);
  }

  async configure() {
    const service = this.serviceSelect.value;
    const model = this.modelSelect.value;
    const effort = this.effortSelect.value;
    const result = await attempt(() => this.connection.configureWorkspace(this.info.id, service, model, effort), this.settingsError);

    if (result.ok) {
      this.info = result.value;
      this.home.replace(result.value);
    } else {
      this.syncSettings();
    }
  }
}

class Home {
  constructor(app, connection) {
    this.app = app;
    this.connection = connection;
    this.workspaces = [];
    this.groups = [];
    this.collapsed = new Set();
    this.opened = new Map();
    this.selected = null;
    this.error = new ErrorLine();
    this.dialogError = new ErrorLine();
    this.build();
  }

  build() {
    this.menuButton = h("button", { class: "flat menu", title: "Workspaces", onclick: () => this.setDrawer(!this.drawerOpen) }, "☰");
    this.title = h("div", { class: "title serif" }, "Auto Remote");
    this.gearButton = h("button", { class: "flat gear", title: "Workspace settings", onclick: () => this.active?.toggleSettings() }, "\u2699\uFE0E");
    this.usageButton = h("button", { class: "flat usage", title: "AI usage limits", onclick: () => this.toggleUsage() });
    this.usageButton.innerHTML = '<svg viewBox="0 0 16 16" width="18" height="18"><path d="M3,13 L3,8 M8,13 L8,3 M13,13 L13,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
    this.remoteButton = h("button", { class: "flat remote", title: "Git remote", onclick: () => this.active?.beginGit("remote") });
    this.remoteButton.innerHTML = '<svg viewBox="0 0 14 14" width="18" height="18"><path d="M4,3.5 L4,10.5 M2.5,2 A1.5,1.5 0 1,1 5.5,2 A1.5,1.5 0 1,1 2.5,2 Z M2.5,12 A1.5,1.5 0 1,1 5.5,12 A1.5,1.5 0 1,1 2.5,12 Z M9.5,5 A1.5,1.5 0 1,1 12.5,5 A1.5,1.5 0 1,1 9.5,5 Z M11,6.5 C11,9 4,8 4,10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
    this.tools = h("div", { class: "tools", hidden: true }, this.remoteButton, this.usageButton, this.gearButton);
    this.topbar = h("div", { class: "topbar" }, this.menuButton, this.title, this.tools);
    this.content = h("div", { class: "content" });
    this.usageCard = h("div", { class: "usage-card" });
    this.usageWrap = h("div", { class: "usage-wrap", hidden: true, onclick: event => event.target === this.usageWrap && this.toggleUsage(false) }, this.usageCard);
    this.usage = null;
    this.usageService = null;
    this.usageTimer = null;
    this.empty = h("div", { class: "empty" },
      h("h2", { class: "serif" }, "No workspace selected"),
      h("div", { class: "muted" }, "Open the menu to pick a workspace or start a new one."),
      this.error.element);
    this.content.append(this.empty);

    this.filter = "";

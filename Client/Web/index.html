      const waiting = await attempt(() => this.connection.getQueuedWork(this.info.id), this.chatError);

      // Known before the state, since work that waits for the local AI keeps the workspace from counting as ready.
      if (waiting.ok) {
        this.setQueue(waiting.value);
      }

      // Queued inputs still to be sent are shown before the state and none left only after it, so neither step looks like the end of the work.
      if (unshown?.some(entry => entry.isQueued && !entry.isPaused)) {
        this.setSavedInputs(unshown);
        unshown = null;
      }

      // Both change before the state is applied once, so no state in between, such as ready, is ever seen.
      this.autoCommitState = result.value.autoCommit ?? "Off";
      this.setWorking(result.value.working === true);
      this.setLimitPause(result.value.limitPause ?? null);

      if (lost) {
        this.chatAuto = true;
        this.chatAutoButton.classList.add("on");
        this.trimToNewest();
        this.scrollToEnd(true);
      }
    }

    if (unshown) {
      this.setSavedInputs(unshown);
    }

    this.flushEarly();
    return lost;
  }

  reaches(message, wanted) {
    return message.role === wanted.role && message.text === wanted.text && (!message.time || !wanted.time || message.time === wanted.time);
  }

  // Work is left out, since it comes and goes with the setting that shows it.
  newestMessage() {
    return this.messages.findLast(message => !message.isWork && !message.pending && message !== this.streaming?.message) ?? null;
  }

  // Reading the chat again is not new output, only what it holds beyond what was there is, so what a user scrolled to is read with it.
  async reloadChat() {
    const newest = this.newestMessage();
    const scroller = this.scroller;
    const stays = this.chatAuto && scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2;
    const reach = stays ? null : this.messages.find(message => !message.isWork && !message.pending && message !== this.streaming?.message) ?? null;
    const visible = [];

    if (!stays && this.scroller.clientHeight > 0) {
      const scroller = this.scroller.getBoundingClientRect();

      [...this.list.children].forEach((child, index) => {
        const box = child.getBoundingClientRect();

        if (this.messages[index] && box.bottom > scroller.top + 0.5 && box.top < scroller.bottom && visible.length < 40) {
          visible.push({ message: this.messages[index], top: box.top - scroller.top });
        }
      });
    }

    this.reloading = true;
    this.stays = stays;

    let lost = false;

    try {
      lost = await this.loadChat(reach, Math.max(chatChunkCharacters, this.weight(this.messages)));
    } finally {
      this.reloading = false;
      this.stays = false;
    }

    const now = this.newestMessage();
    const arrived = !!now && (!newest || !this.reaches(now, newest));

    if (arrived && this.chatAuto) {
      if (reach) {
        this.keepWindow();
      }

      this.scrollToEnd();
    } else if (visible.length > 0 && !lost) {
      this.returnTo(visible);
    }
  }

  returnTo(visible) {
    for (const { message, top } of visible) {
      const index = this.messages.findIndex(shown => this.reaches(shown, message));
      const element = index >= 0 ? this.list.children[index] : null;

      if (element) {
        this.scroller.scrollTop = this.contentTop(element) - top;
        this.lastScrollTop = this.scroller.scrollTop;
        this.captureAnchor();
        return;
      }
    }
  }

  flushEarly() {
    const pending = this.early;
    this.early = [];
    const hidden = event => event.kind === "MessageAdded" && event.message?.isWork === true && !this.showWork;
    const added = pending.filter(event => event.kind === "MessageAdded" && event.message && !hidden(event)).map(event => event.message);
    const same = (first, second) => first.role === second.role && first.text.trim() === second.text.trim();
    const stored = this.messages.filter(message => !message.pending);
    let overlap = Math.min(added.length, stored.length);

    while (overlap > 0 && !added.slice(0, overlap).every((message, index) => same(stored[stored.length - overlap + index], message))) {
      overlap--;
    }

    this.loading = false;
    let skipped = 0;

    for (const event of pending) {
      if (event.kind === "MessageAdded" && event.message && !hidden(event) && skipped < overlap) {
        skipped++;
      } else {
        this.apply(event);
      }
    }
  }

  async loadOlder() {
    if (this.start === 0 || this.loadingOlder) {
      return;
    }

    this.loadingOlder = true;
    const requested = this.start;

    try {
      const result = await attempt(() => this.connection.getHistory(this.info.id, String(requested), chatChunkMessages, chatChunkCharacters), this.chatError);

      if (result.ok && this.start !== requested) {
        return;
      }

      if (result.ok) {
        this.start = messagePosition(result.value.older);
      }

      if (result.ok && result.value.messages.length > 0) {
        const height = this.scroller.scrollHeight;
        const top = this.scroller.scrollTop;
        this.messages.unshift(...result.value.messages);
        this.list.prepend(...result.value.messages.map(message => this.messageElement(message)));
        this.scroller.scrollTop = top + (this.scroller.scrollHeight - height);
        this.lastScrollTop = this.scroller.scrollTop;
        this.captureAnchor();
      }
    } finally {
      this.loadingOlder = false;
    }
  }

  trimToNewest() {
    let keep = 0;
    let weight = 0;

    for (let index = this.messages.length - 1; index >= 0 && keep < chatChunkMessages; index--) {
      const length = this.messages[index].text.length;

      if (keep > 0 && weight + length > chatChunkCharacters) {
        break;
      }

      weight += length;
      keep++;
    }

    // A prompt on its way is no part of the stored chat, which what is dropped is counted in.
    const pending = this.firstPending();
    const drop = Math.min(this.messages.length - keep, pending < 0 ? this.messages.length : pending);

    if (drop <= 0) {
      return false;
    }

    this.messages.splice(0, drop);
    this.start += drop;

    for (let index = 0; index < drop && this.list.firstChild; index++) {
      this.list.firstChild.remove();
    }

    this.scroller.scrollTop = this.scroller.scrollHeight;
    this.lastScrollTop = this.scroller.scrollTop;
    this.captureAnchor();
    return true;
  }

  receive(event) {
    if (event.workspaceId !== this.info.id) {
      return;
    }

    if (event.kind === "StateChanged") {
      this.followState(event.state);
      return;
    }

    if (event.kind === "ShowWorkChanged") {
      this.reloadChat();
      return;
    }

    if (event.kind === "ErrorsChanged") {
      if (event.errors) {
        this.showErrors(event.errors);
      }

      return;
    }

    if (event.kind === "LoopChanged") {
      this.setLoop(event.loop ?? null, event.loop ? null : event.text ?? null);
      return;
    }

    if (event.kind === "LimitPauseChanged") {
      this.setLimitPause(event.limitPause ?? null);
      return;
    }

    if (event.kind === "QueueChanged") {
      this.setQueue(event.queue ?? null);

      // A queue emptied as "dropped" means the waiting prompt never starts.
      if (!event.queue && event.text === "dropped" && !this.working) {
        this.settleNotify(this.notifyWhenReady);
      }

      return;
    }

    if (event.kind === "ScriptChanged" || event.kind === "ScriptOutput" || event.kind === "ScriptRemoved") {
      this.receiveScript(event);
      return;
    }

    if (event.kind === "FilesChanged") {
      if (event.text === "all") {
        this.reloadAll();
      } else {
        this.refreshFiles(event.path);
      }

      this.refreshGit();
      return;
    }

    if (event.kind === "GitChanged" || (event.kind === "WorkingChanged" && event.working === false)) {
      this.refreshGit(event.kind === "GitChanged");
    }

    if (this.loading) {
      this.early.push(event);
    } else {
      this.apply(event);
    }
  }

  apply(event) {
    if (event.kind === "MessageAdded" && event.message) {
      if (event.message.isWork && !this.showWork) {
        return;
      }

      if (event.message.role === "User") {
        this.chatError.set(null);

        if (this.arrived(event.message)) {
          return;
        }
      }

      const message = event.message;

      if (this.streaming && message.role === "Assistant" && (message.isThought ? this.streaming.message.isThought === true : !message.isWork && this.streaming.message.isThought !== true)) {
        this.messages[this.messages.indexOf(this.streaming.message)] = message;
        this.streaming.element.replaceWith(this.messageElement(message));
        this.streaming = null;
        this.scrollToEnd();
        return;
      }

      if (this.streaming && message.isThought) {
        this.dropStreaming();
      }

      this.appendMessage(event.message);
      this.keepWindow();
    } else if (event.kind === "MessageDelta" && this.showWork && event.text) {
      this.streamMessage(event.text, event.thought === true);
    } else if (event.kind === "WorkingChanged") {
      this.setWorking(event.working === true);

      if (event.working !== true) {
        this.dropStreaming();
      }
    } else if (event.kind === "Failed") {
      this.chatError.set(event.error, event.time);

      // A notice is about something beside the work, whose answer goes on.
      if (!event.isNotice) {
        this.dropStreaming();
      }
    } else if (event.kind === "SavedInputsChanged" && event.savedInputs) {
      this.setSavedInputs(event.savedInputs);
    } else if (event.kind === "AutoCommitChanged" && event.autoCommit) {
      this.setAutoCommitState(event.autoCommit);
    }
  }

  messageElement(message) {
    const user = message.role === "User";
    const stamp = message.pending ? [h("div", { class: "stamp" }, "Sending…")] : message.time ? [h("div", { class: "stamp", title: new Date(message.time).toLocaleString([], { dateStyle: "full", timeStyle: "medium" }) }, messageStamp(message.time))] : [];

    if (message.isWork) {
      return h("div", { class: "msg work" }, h("div", { class: "bubble" }, message.text), ...stamp);
    }

    if (!user) {
      return h("div", { class: "msg assistant" }, h("div", { class: "bubble md" }, ...renderMarkdown(message.text).childNodes), ...stamp);
    }

    const { body, files } = splitAttachments(message.text);
    return h("div", { class: "msg user" }, h("div", { class: "bubble" },
      ...(body.length > 0 ? [h("div", { class: "body" }, body)] : []),
      ...(files.length > 0 ? [h("div", { class: "attached" }, ...files.map(file => h("div", { class: "chip", title: file.path }, icon("attach"), h("span", { class: "name" }, file.name))))] : []),
      ...stamp));
  }

  renderMessages() {
    this.list.replaceChildren(...this.messages.map(message => this.messageElement(message)));

    if (this.stays || !this.reloading) {
      this.scrollToEnd(true);
    }
  }

  streamMessage(piece, thought) {
    if (this.streaming && (this.streaming.message.isThought === true) !== thought) {
      this.dropStreaming();
    }

    if (!this.streaming) {
      const message = { role: "Assistant", text: piece, time: new Date().toISOString(), isWork: thought, isThought: thought };
      this.streaming = { message, element: this.insertMessage(message) };
      this.keepWindow();
    } else {
      const message = { ...this.streaming.message, text: this.streaming.message.text + piece };
      this.messages[this.messages.indexOf(this.streaming.message)] = message;
      const element = this.messageElement(message);
      this.streaming.element.replaceWith(element);
      this.streaming = { message, element };
      this.keepWindow();
    }

    this.scrollToEnd();
  }

  dropStreaming() {
    if (this.streaming) {
      this.messages.splice(this.messages.indexOf(this.streaming.message), 1);
      this.streaming.element.remove();
      this.streaming = null;
    }
  }

  appendMessage(message) {
    this.insertMessage(message);
    this.scrollToEnd();
  }

  keepWindow() {
    if (this.chatAuto) {
      this.trimToNewest();
    }
  }

  scrolled() {
    const scroller = this.scroller;

    if (scroller.clientHeight === 0) {
      return;
    }

    this.keepAnchor();
    const movedUp = scroller.scrollTop < this.lastScrollTop;
    this.lastScrollTop = scroller.scrollTop;
    this.captureAnchor();

    if (scroller.scrollHeight > scroller.clientHeight + 1 && scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) {
      this.trimToNewest();
    } else if (movedUp && scroller.scrollTop < 40) {
      this.loadOlder();
    }
  }

  contentTop(element) {
    return element.getBoundingClientRect().top - this.scroller.getBoundingClientRect().top + this.scroller.scrollTop;
  }

  captureAnchor() {
    this.anchor = null;

    if (this.scroller.clientHeight === 0) {
      return;
    }

    for (const child of this.list.children) {
      if (this.contentTop(child) + child.offsetHeight - this.scroller.scrollTop > 0.5) {
        this.anchor = child;
        this.anchorContent = this.contentTop(child);
        return;
      }
    }
  }

  keepAnchor() {
    if (!this.anchor?.isConnected || this.scroller.clientHeight === 0) {
      return;
    }

    const moved = this.contentTop(this.anchor) - this.anchorContent;

    if (Math.abs(moved) < 0.5) {
      return;
    }

    this.anchorContent += moved;
    this.scroller.scrollTop += moved;
    this.lastScrollTop = this.scroller.scrollTop;
  }

  wheeled(event) {
    if (event.deltaY < 0 && this.scroller.scrollTop <= 1) {
      this.loadOlder();
    }
  }

  scrollToEnd(force = false) {
    if (force || this.chatAuto) {
      requestAnimationFrame(() => {
        this.scroller.scrollTop = this.scroller.scrollHeight;
      });
    }
  }

  resizeInput(event) {
    event.preventDefault();
    const startY = event.clientY;
    const startHeight = this.box.offsetHeight;
    const move = moved => {
      const limit = Math.max(60, this.chatBody.clientHeight - 120);
      this.box.style.height = `${Math.min(limit, Math.max(60, startHeight + startY - moved.clientY))}px`;
      this.restoreHeight = null;
    };
    const stop = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", stop);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", stop);
  }

  async pickFiles() {
    await this.attach([...this.fileInput.files]);
    this.fileInput.value = "";
  }

  pasted(event) {
    const files = [...(event.clipboardData?.files ?? [])];

    if (files.length > 0) {
      event.preventDefault();
      this.attach(files);
    }
  }

  async attach(files) {
    for (const file of files) {
      if (file.size === 0 || file.size > maxAttachment) {
        this.chatError.set(`${file.name} is empty or larger than ${maxAttachment / 1024 / 1024} MB.`);
        continue;
      }

      this.chatError.set(null);
      this.attachments.push({ name: file.name || "pasted-image.png", file });
    }

    this.renderAttachments();
  }

  renderAttachments() {
    this.chips.replaceChildren(...this.attachments.map(attachment => h("div", { class: "chip" },
      icon("file"),
      h("span", { class: "name" }, attachment.name),
      h("button", { class: "flat icon", title: "Remove", onclick: () => { this.attachments = this.attachments.filter(other => other !== attachment); this.renderAttachments(); } }, icon("close")))));
    this.chips.hidden = this.attachments.length === 0;
    this.inputChanged();
  }

  async encode(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let binary = "";

    for (let index = 0; index < bytes.length; index += 32768) {
      binary += String.fromCharCode(...bytes.subarray(index, index + 32768));
    }

    return btoa(binary);
  }

  fitInput() {
    this.input.style.height = "0";
    const wanted = this.input.scrollHeight;
    this.input.style.height = `${wanted}px`;
    const current = this.box.offsetHeight;

    if (this.input.value.length === 0) {
      if (this.restoreHeight !== null) {
        this.box.style.height = `${this.restoreHeight}px`;
        this.restoreHeight = null;
      }
    } else if (wanted + 8 > current + 1) {
      this.restoreHeight ??= current;
      this.box.style.height = `${Math.min(Math.max(current, this.chatBody.clientHeight - 120), wanted + 8)}px`;
    }
  }

  setSavedInputs(saved) {
    const had = this.hasActiveQueued();
    this.savedInputs = [...saved];
    this.loadInputButton.classList.toggle("saved", this.savedInputs.length > 0);
    this.renderQueueState();

    // The question is dropped with what it asks about, which another client or the queue may have taken.
    if (this.deletingInput && !this.savedInputs.some(entry => entry.id === this.deletingInput.id)) {
      this.deletingInput = null;
    }

    this.renderSaved();

    // The queued inputs can run out without the state changing, as when they are deleted or paused while the workspace is ready.
    if (had && !this.hasActiveQueued() && this.state() === "Ready" && this.loop === null && this.notifyWhenReady) {
      this.conclude();
    }

    this.home.updateNotify(this);
  }

  renderSaved() {
    // The list is built anew, so it takes over where it was scrolled to.
    const scrolled = this.savedPanel.querySelector(".list")?.scrollTop ?? 0;
    this.savedPanel.hidden = !this.savedOpen;
    const when = entry => h("div", { class: "when", title: new Date(entry.time).toLocaleString([], { dateStyle: "full", timeStyle: "medium" }) }, messageStamp(entry.time));
    const entryElement = entry => {
      const remove = h("button", { class: "flat icon delete", title: "Delete", onclick: () => this.askDelete(entry) }, icon("trash"));
      const commit = this.gitStatus.isRepo && !entry.error ? h("button", { class: `flat icon saved-commit${entry.autoCommit ? " toggled" : ""}`, title: entry.autoCommit ? "Auto commit is on for this input. Press to turn it off." : "Auto commit is off for this input. Press to turn it on.", onclick: () => this.toggleSavedAutoCommit(entry) }, icon("autoCommit")) : null;

      if (entry.isConverting || entry.error) {
        return h("div", { class: "saved-row" },
          h("div", { class: "pending" },
            entry.isConverting ? h("div", { class: "muted" }, "Turning speech into text...") : h("div", { class: "error" }, entry.error),
            entry.isConverting ? h("div", { class: "bar" }) : "",
            when(entry)),
          commit,
          remove);
      }

      return h("div", { class: `saved-row${entry.isQueued ? " queued" : ""}` },
        h("button", { class: "load", onclick: () => this.takeSaved(entry) },
          ...(entry.isQueued ? [h("div", { class: "queue-label" }, entry.isPaused ? "Queued, paused" : "Queued")] : []),
          h("div", { class: "text" }, entry.text), when(entry)),
        commit,
        remove);
    };
    const deleting = this.deletingInput;
    const question = !deleting ? "" : deleting.isQueued ? "Delete this queued input? It will not be sent." : deleting.isConverting || deleting.error ? "Delete this recording? Its text is not kept." : "Delete this saved input? This cannot be undone.";

    this.savedPanel.replaceChildren(...[
      h("div", { class: "head" }, h("h3", { class: "serif" }, "Saved inputs"), h("button", { class: "flat", onclick: () => this.toggleSaved() }, "Close")),
      this.savedInputs.some(entry => entry.isQueued && entry.isPaused) ? h("div", { class: "paused-note" },
        h("div", { class: "muted" }, "Queued inputs are paused because work was stopped, cancelled or failed, or the server restarted. They also go on after work ends well again or when you queue another input."),
        h("button", { class: "primary", onclick: () => this.resumeQueue() }, "Resume Queue")) : null,
      h("div", { class: "list" }, ...(this.savedInputs.length === 0
        ? [h("div", { class: "none" }, "No saved inputs.")]
        : this.savedInputs.map(entryElement))),
      deleting ? h("div", { class: "confirm" },
        h("div", { class: "card" },
          h("h3", { class: "serif" }, question),
          h("div", { class: "muted preview-text" }, deleting.text),
          h("button", { class: "block danger", onclick: () => this.confirmDelete() }, "Delete"),
          h("button", { class: "block", onclick: () => this.askDelete(null) }, "Cancel"))) : null
    ].filter(node => node !== null));
    this.savedPanel.querySelector(".list").scrollTop = scrolled;
  }

  askDelete(entry) {
    this.deletingInput = entry;
    this.renderSaved();
  }

  async confirmDelete() {
    const entry = this.deletingInput;

    if (!entry) {
      return;
    }

    this.askDelete(null);
    const result = await attempt(() => this.connection.discardSavedInput(this.info.id, entry.id), this.chatError);

    if (result.ok) {
      this.setSavedInputs(result.value);
    }
  }

  // Queuing gives the workspace work like sending does, only that the server sends it when the work before it is over.
  async queueInput() {
    if (this.delegation() || (this.input.value.trim().length === 0 && this.attachments.length === 0)) {
      return;
    }

    const text = this.input.value.trim();
    const sending = this.attachments;
    const loaded = this.loadedAutoCommit;
    this.input.value = "";
    this.attachments = [];
    this.renderAttachments();
    this.inputChanged();
    this.chatNotice.hidden = true;
    const waited = this.notifyWhenReady;
    this.notifyWhenReady = true;
    this.clearReady();
    requestNotifications().then(() => this.home.updateNotify(this));

    // The list is left to what the server tells, since it may send the input before this is answered.
    const result = await attempt(async () => {
      const paths = [];

      for (const attachment of sending) {
        paths.push(attachment.serverPath ?? await this.connection.uploadAttachment(this.info.id, attachment.name, await this.encode(attachment.file)));
      }

      await this.connection.queueInput(this.info.id, this.written(text, paths), loaded ?? true);
    }, this.chatError);

    if (!result.ok) {
      this.settleNotify(waited);
      this.giveBack(text, sending);
      this.restoreLoaded(loaded);
    }
  }

  toggleSaved() {
    this.savedOpen = !this.savedOpen;
    this.deletingInput = null;
    this.renderSaved();
  }

  async saveInput() {
    const text = this.input.value;
    const commits = this.loadedAutoCommit ?? true;
    const result = await attempt(() => this.connection.saveInput(this.info.id, text, commits), this.chatError);

    if (result.ok) {
      this.setSavedInputs(result.value);

      if (this.input.value === text) {
        this.input.value = "";
        this.inputChanged();
      }
    }
  }

  async takeSaved(entry) {
    const result = await attempt(() => this.connection.takeSavedInput(this.info.id, entry.id), this.chatError);
    this.savedOpen = false;
    this.renderSaved();

    if (result.ok) {
      this.input.value = this.input.value.trim().length > 0 ? `${result.value.text}\n${this.input.value}` : result.value.text;
      this.loadedAutoCommit = result.value.autoCommit;
      this.inputChanged();
      this.input.focus();
    } else {
      const message = this.chatError.message;
      const again = await attempt(() => this.connection.getSavedInputs(this.info.id), this.chatError);

      if (again.ok) {
        this.setSavedInputs(again.value);
        this.chatError.set(message);
      }
    }
  }

  inputChanged() {
    this.fitInput();
    this.updateSend();
    this.saveDraft();
  }

  delegation() {
    return this.home.delegations.get(this.info.id) ?? null;
  }

  takesAiInput() {
    if (this.delegation()) {
      return false;
    }

    const state = this.state();
    return state === "Ready" || state === "Working";
  }

  updateSend() {
    const state = this.state();
    const empty = this.input.value.trim().length === 0 && this.attachments.length === 0;
    const halt = (state === "Working" && empty) || state === "Managing" || state === "Canceling";
    this.sendButton.disabled = !this.takesAiInput();
    this.sendButton.hidden = halt || empty;
    this.reviewButton.disabled = !this.takesAiInput();
    const prompting = empty && state !== "Managing" && state !== "Canceling";
    this.reviewButton.hidden = !prompting;
    this.expandButton.disabled = !this.takesAiInput();
    this.expandButton.hidden = !prompting;
    this.pauseButton.disabled = !this.takesAiInput();
    this.pauseButton.hidden = !(empty && state === "Working");
    this.resumeButton.disabled = !this.takesAiInput();
    this.resumeButton.hidden = !(empty && state === "Ready");
    // A loop can also be started while the changes are committed after work.
    const afterWork = this.autoCommitState === "Committing";
    this.loopButton.disabled = !this.takesAiInput() && !afterWork;
    this.loopButton.hidden = !(prompting || (afterWork && empty)) || this.loop !== null;
    this.renderLoaded();
    this.cancelLoopButton.hidden = this.loop === null;
    const typed = this.input.value.trim().length > 0;
    this.saveInputButton.hidden = !typed;
    this.loadInputButton.hidden = typed;

    if ((typed || this.delegation()) && this.savedOpen) {
      this.toggleSaved();
    }

    this.queueButton.hidden = empty || !!this.delegation();
    this.autoCommitButton.hidden = !!this.delegation() || !this.gitStatus.isRepo || this.loop?.isRunning === true || state === "Stopping" || state === "Canceling" || !(state === "Working" || this.autoCommitState === "On");
    const committing = this.autoCommitState === "On";
    this.autoCommitButton.classList.toggle("toggled", committing);
    this.autoCommitButton.title = committing ? "The changes are committed when the current work is done. Press to turn auto commit off." : "Auto commit the changes when the current work is done";
    this.renderAutoCommitCaption();
    this.renderLoopWaiting();
    this.stopButton.hidden = !halt;
    this.stopButton.disabled = state === "Canceling";
    this.voiceButton.disabled = this.transcribing || (!this.voice && !this.takesAiInput());
    this.voiceButton.classList.toggle("on", this.voice !== null);
    this.voiceButton.classList.toggle("recording", this.voice !== null);
    this.voiceButton.title = this.transcribing ? "Sending the recording" : "Voice input";

    if (this === this.home.active) {
      this.home.closeHaltDialogUnlessRunning(state);
    }
  }

  async startVoice() {
    if (this.voice || this.voiceStarting || this.transcribing) {
      return;
    }

    this.chatError.set(null);
    const starting = {};
    this.voiceStarting = starting;
    let stream;

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (exception) {
      if (this.voiceStarting === starting) {
        this.voiceStarting = null;
        this.chatError.set(`Voice input needs the microphone: ${exception.message || exception.name}`);
      }

      return;
    }

    if (this.voiceStarting !== starting) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }

    this.voiceStarting = null;
    const recorder = new MediaRecorder(stream);
    const chunks = [];
    recorder.ondataavailable = event => chunks.push(event.data);
    const stopped = new Promise(resolve => { recorder.onstop = resolve; });
    recorder.start();
    const started = Date.now();
    const tick = setInterval(() => {
      const seconds = Math.floor((Date.now() - started) / 1000);
      this.voiceTime.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }, 1000);
    this.voiceTime.textContent = "0:00";
    this.voice = { stream, recorder, chunks, stopped, tick, limit: setTimeout(() => this.completeVoice(), 60000) };
    document.body.append(this.voiceScreen);
    this.updateSend();
  }

  releaseVoice(voice) {
    clearTimeout(voice.limit);
    clearInterval(voice.tick);
    this.voice = null;
    this.voiceScreen.remove();

    if (voice.recorder.state !== "inactive") {
      voice.recorder.stop();
    }

    voice.stream.getTracks().forEach(track => track.stop());
  }

  async cancelVoice() {
    this.voiceStarting = null;

    if (this.voice) {
      this.releaseVoice(this.voice);
      this.updateSend();
    }
  }

  async completeVoice() {
    const voice = this.voice;

    if (!voice) {
      return;
    }

    clearTimeout(voice.limit);
    clearInterval(voice.tick);
    this.voice = null;
    this.voiceScreen.remove();
    this.transcribing = true;
    this.updateSend();
    voice.recorder.stop();
    await voice.stopped;
    voice.stream.getTracks().forEach(track => track.stop());

    try {
      const result = await attempt(async () => {
        const wav = await recordingToWav(new Blob(voice.chunks, { type: voice.recorder.mimeType }));

        if (wav.size < 44 + 16000 * 2 * 0.3) {
          throw new Error("Nothing was recorded.");
        }

        return await this.connection.transcribeSavedInput(this.info.id, await this.encode(wav));
      }, this.chatError);

      if (result.ok) {
        this.setSavedInputs(result.value);
        this.savedOpen = true;
        this.renderSaved();
      }
    } finally {
      this.transcribing = false;
      this.updateSend();
    }
  }

  keyed(event) {
    if (event.key === "Enter" && event.shiftKey && !event.isComposing) {
      event.preventDefault();
      this.send();
    }
  }

  async send() {
    const text = this.input.value.trim();
    const sending = this.attachments;

    if ((!text && sending.length === 0) || !this.takesAiInput()) {
      return;
    }

    const loaded = this.loadedAutoCommit;
    this.input.value = "";
    this.fitInput();
    this.saveDraft();
    this.attachments = [];
    this.renderAttachments();
    this.renderLoaded();

    if (!await this.deliver(text, sending, true, loaded)) {
      this.giveBack(text, sending);
      this.restoreLoaded(loaded);
    }
  }

  // What was not sent goes back in front of what was typed and attached meanwhile.
  giveBack(text, attachments) {
    if (text) {
      this.input.value = this.input.value ? `${text}\n${this.input.value}` : text;
    }

    this.attachments = [...attachments, ...this.attachments];
    this.renderAttachments();
  }

  async preset(kind) {
    if (this.input.value.trim() || this.attachments.length > 0 || !this.takesAiInput()) {
      return;
    }

    const result = await attempt(async () => {
      const settings = await this.connection.getWorkspaceSettings(this.info.id);
      return ((kind === "review" ? settings.reviewPrompt ?? settings.globalReviewPrompt : settings.expandPrompt ?? settings.globalExpandPrompt) ?? "").trim();
    }, this.chatError);

    if (!result.ok) {
      return;
    }

    if (!result.value) {
      this.chatError.set("The prompt of this button is empty.");
      return;
    }

    await this.deliver(result.value, []);
  }

  async quick(prompt) {
    if (this.input.value.trim() || this.attachments.length > 0 || !this.takesAiInput()) {
      return;
    }

    await this.deliver(prompt, []);
  }

  async deliver(text, sending, fromBox = false, loaded = null) {
    this.chatNotice.hidden = true;
    const waited = this.notifyWhenReady;
    this.notifyWhenReady = true;
    this.clearReady();
    requestNotifications().then(() => this.home.updateNotify(this));
    let refused = null;
    // A file not uploaded yet is shown by its name.
    let echo = this.echo(this.written(text, sending.map(attachment => attachment.serverPath ?? attachment.name)));

    const result = await attempt(async () => {
      const paths = [];

      for (const attachment of sending) {
        paths.push(attachment.serverPath ?? await this.connection.uploadAttachment(this.info.id, attachment.name, await this.encode(attachment.file)));
      }

      const prompt = this.written(text, paths);
      echo = this.reword(echo, prompt);

      try {
        this.submitted.push(splitAttachments(prompt));
        await (loaded === true ? this.connection.promptToCommit(this.info.id, prompt, false) : this.connection.prompt(this.info.id, prompt));
      } catch (exception) {
        if (!exception.overLimit) {
          throw exception;
        }

        refused = { pause: exception.overLimit, prompt, typed: fromBox ? text : "", attachments: sending, loaded };
      }
    }, this.chatError);

    if (refused || !result.ok) {
      this.settleNotify(waited);
      this.withdraw(echo);
    }

    if (refused) {
      this.askOverLimit(refused);
      return false;
    }

    return result.ok;
  }

  askOverLimit(ask) {
    const percent = value => String(Math.round(value * 10) / 10);
    const text = `The ${ask.pause.window} usage window is at ${percent(ask.pause.percentUsed)}%, at or past the maximum of ${percent(ask.pause.maxPercent)}%. Start the work anyway? The workspace ignores the maximum until this work is done.`;

    if (this.home.active !== this) {
      this.chatError.set(`The prompt was not sent. The ${ask.pause.window} usage window is at ${percent(ask.pause.percentUsed)}%, at or past the maximum of ${percent(ask.pause.maxPercent)}%.`);
      return;
    }

    const go = async () => {
      this.home.closeDialog();
      const boxed = !!ask.typed && this.input.value.trim() === ask.typed;
      const taken = this.attachments.filter(attachment => ask.attachments.includes(attachment));

      if (boxed) {
        this.input.value = "";
      }

      this.attachments = this.attachments.filter(attachment => !taken.includes(attachment));
      this.renderAttachments();
      const waited = this.notifyWhenReady;
      this.notifyWhenReady = true;
      this.clearReady();

      const echo = this.echo(ask.prompt);

      this.renderLoaded();

      if (!(await attempt(() => ask.loaded === true ? this.connection.promptToCommit(this.info.id, ask.prompt, true) : this.connection.promptOverLimit(this.info.id, ask.prompt), this.chatError)).ok) {
        this.settleNotify(waited);
        this.withdraw(echo);
        this.giveBack(boxed ? ask.typed : "", taken);
        this.restoreLoaded(ask.loaded);
      }
    };

    this.home.dialogError.set(null);
    this.home.dialogHost.replaceChildren(h("div", { class: "dialog" },
      h("h3", { class: "serif" }, "Over the usage limit"),
      h("div", { class: "muted" }, text),
      h("button", { class: "primary block", onclick: go }, "Start Anyway"),
      h("button", { class: "block", onclick: () => this.home.closeDialog() }, "Cancel")));
    this.home.dialogHost.hidden = false;
  }

  setQueue(queue) {
    if (this.queue && !queue) {
      this.submitted = [];
    }

    this.queue = queue;
    this.queueBanner.hidden = !queue;
    this.home.updateNotify(this);

    if (queue?.text) {
      // The banner shows a prompt that has to wait; it is a message once its work starts.
      const held = splitAttachments(queue.text);
      this.messages.filter(message => message.pending && this.holds(held, splitAttachments(message.text))).forEach(echo => this.withdraw(echo));
    }

    if (!queue) {
      return;
    }

    const running = queue.running ?? [];
    this.queueText.textContent = `Queued (position ${queue.position})${running.length > 0 ? `, waiting for ${running.join(", ")}` : ""}.`;
    const parts = splitAttachments(queue.text ?? "");
    this.queuePrompt.textContent = [parts.body, parts.files.map(file => file.name).join(", ")].filter(part => part).join("\n");
    this.queuePrompt.hidden = !queue.text;

    if (this.gitWorking()) {
      this.showSide("chat");
    }
  }

  // The server joins waiting prompts as paragraphs and keeps their attachment lines at the end.
  wasSubmitted(queued) {
    return this.submitted.some(sent => this.holds(queued, sent));
  }

  // The server joins waiting prompts as paragraphs and keeps their attachment lines at the end.
  holds(queued, sent) {
    return sent.body
      ? `\n\n${queued.body}\n\n`.includes(`\n\n${sent.body}\n\n`)
      : sent.files.some(file => queued.files.some(other => other.path === file.path));
  }

  written(text, attached) {
    return [...(text ? [text] : []), ...attached.map(path => `Attached file: ${path}`)].join("\n");
  }

  // Shows a prompt before the server is asked anything; the server's copy takes its place once it tells of it.
  echo(prompt) {
    const echo = { role: "User", text: prompt, pending: true };
    this.chatError.set(null);
    this.messages.push(echo);
    this.list.append(this.messageElement(echo));
    this.keepWindow();
    // The user's own new message, which the chat goes to as it does to any other output.
    this.scrollToEnd();
    return echo;
  }

  reword(echo, prompt) {
    const index = this.messages.indexOf(echo);

    if (index < 0 || echo.text === prompt) {
      return echo;
    }

    const reworded = { ...echo, text: prompt };
    this.replaceMessage(index, reworded);
    return reworded;
  }

  withdraw(echo) {
    const index = this.messages.indexOf(echo);

    if (index >= 0) {
      this.messages.splice(index, 1);
      this.list.children[index].remove();
    }
  }

  replaceMessage(index, message) {
    this.messages[index] = message;
    this.list.children[index].replaceWith(this.messageElement(message));
  }

  firstPending() {
    return this.messages.findIndex(message => message.pending);
  }

  // Puts a message the server told of before the prompts that are still on their way to it, which came after it.
  insertMessage(message) {
    const pending = this.firstPending();
    const element = this.messageElement(message);

    if (pending < 0) {
      this.messages.push(message);
      this.list.append(element);
    } else {
      this.list.insertBefore(element, this.list.children[pending]);
      this.messages.splice(pending, 0, message);
    }

    return element;
  }

  // The server's copy of a prompt takes the place of the one shown while it was on its way. It is no new output: the user saw it already.
  arrived(told) {
    const index = this.messages.findIndex(message => message.pending && message.text === told.text);

    if (index < 0) {
      return false;
    }

    if (index === this.firstPending()) {
      this.replaceMessage(index, told);
    } else {
      this.withdraw(this.messages[index]);
      this.insertMessage(told);
    }

    return true;
  }

  async cancelQueued() {
    const waiting = this.queue;

    if (!waiting) {
      return;
    }

    const own = this.wasSubmitted(splitAttachments(waiting.text ?? ""));
    const result = await attempt(() => this.connection.cancelQueuedWork(this.info.id, !own), this.chatError);

    if (!result.ok) {
      return;
    }

    this.setQueue(null);

    if (waiting.delegated) {
      this.chatNotice.textContent = "The delegated task was cancelled.";
      this.chatNotice.hidden = false;
      return;
    }

    const removed = result.value;

    if (!removed?.text) {
      return;
    }

    if (!own) {
      this.chatNotice.textContent = "The queued prompt was kept as a saved input.";
      this.chatNotice.hidden = false;
      return;
    }

    const parts = splitAttachments(removed.text);
    this.attachments = [...this.attachments, ...parts.files.map(file => ({ name: file.name, serverPath: file.path }))];

    if (parts.body) {
      this.input.value = this.input.value.trim() ? `${parts.body}\n${this.input.value}` : parts.body;
    }

    this.renderAttachments();
  }

  async cancelLimitPause() {
    if ((await attempt(() => this.connection.cancelLimitPause(this.info.id), this.chatError)).ok) {
      this.chatNotice.textContent = "The automatic resume was cancelled, so nothing goes on by itself. Send a message to start work again.";
      this.chatNotice.hidden = false;
    }
  }

  syncNodes(old, entries) {
    return entries.map(entry => old.find(node => node.entry.path === entry.path && node.entry.isFolder === entry.isFolder) ?? { entry, expanded: false, loaded: false, children: [] });
  }

  findNode(nodes, path) {
    for (const node of nodes.filter(item => item.entry.isFolder && item.expanded && item.loaded)) {
      const found = node.entry.path === path ? node : this.findNode(node.children, path);

      if (found) {
        return found;
      }
    }

    return null;
  }

  async watch() {
    await attempt(() => this.connection.watchWorkspace(this.info.id), this.filesError);
  }

  async loadRoot(path, newRoot = true) {
    if (path === undefined || path === null) {
      return;
    }

    const result = await attempt(() => this.connection.listFiles(this.info.id, path, this.showHidden), this.filesError);

    if (result.ok) {
      this.files = result.value;
      this.nodes = this.syncNodes(newRoot ? [] : this.nodes, this.files.entries);
      this.applyChangesMode();
      this.renderTree();

      if (newRoot) {
        await this.watch();
      }
      this.reveal(newRoot);
    }
  }

  openPath() {
    return this.preview?.path ?? this.diffState?.path ?? null;
  }

  async reveal(expand) {
    const path = this.openPath();

    if (expand && path !== null) {
      const parts = path.split("/");
      let level = this.nodes;
      for (let i = 0; i < parts.length - 1; i++) {
        const folder = level.find(node => node.entry.isFolder && node.entry.path === parts.slice(0, i + 1).join("/"));

        if (!folder) {
          break;
        }

        if (!folder.loaded) {
          await this.loadNode(folder);
        }

        folder.expanded = true;
        level = folder.children;
      }
    }

    this.renderTree();

    if (expand) {
      this.fileList.querySelector(".row.on")?.scrollIntoView({ block: "nearest" });
    }
  }

  copyPath(node, absolute) {
    const folder = this.info.folder.replace(/[\\/]+$/, "");
    const separator = this.info.folder.includes("\\") && !this.info.folder.includes("/") ? "\\" : "/";
    const text = absolute ? folder + separator + node.entry.path.replaceAll("/", separator) : node.entry.path;
    navigator.clipboard?.writeText(text);
  }

  async loadNode(node) {
    const result = await attempt(() => this.connection.listFiles(this.info.id, node.entry.path, this.showHidden), this.filesError);

    if (result.ok) {
      node.children = this.syncNodes(node.children, result.value.entries);
      node.loaded = true;

      for (const child of node.children.filter(item => item.entry.isFolder && item.expanded)) {
        await this.loadNode(child);
      }
    } else {
      node.expanded = false;
    }
  }

  renderTree() {
    const scroll = this.fileList.scrollTop;
    const open = this.openPath();
    const active = new Set(this.scriptList().filter(entry => this.scriptActive(entry)).map(entry => entry.path));
    const script = node => !node.entry.isFolder && /\.(cs|task)$/i.test(node.entry.name);
    const runnable = node => !this.delegation() && script(node);
    const touch = () => matchMedia("(pointer: coarse)").matches;
    const rows = (nodes, depth) => nodes.flatMap(node => [
      h("div", {
        class: `row${this.statusClass(this.statusOf(node.entry.path, node.entry.isFolder))}${!node.entry.isFolder && node.entry.path === open ? " on" : ""}${script(node) && active.has(node.entry.path) ? " running" : ""}`,
        style: `padding-left:${8 + depth * 16}px`,
        onclick: () => this.choose(node),
        ondblclick: () => runnable(node) && !touch() && this.runScript(node.entry.path),
        oncontextmenu: event => {
          event.preventDefault();

          if (runnable(node) && touch()) {
            this.runScript(node.entry.path);
            return;
          }

          this.showMenu(event, [{ label: "Copy Name", action: () => navigator.clipboard?.writeText(node.entry.name) }, { label: "Copy Relative Path", action: () => this.copyPath(node, false) }, { label: "Copy Absolute Path", action: () => this.copyPath(node, true) }]);
        } },
        h("span", { class: "slot" }, icon(node.entry.isFolder ? "folder" : runnable(node) ? (/\.task$/i.test(node.entry.name) ? "task" : "script") : "file")),
        h("div", { class: "name" }, node.entry.name)),
      ...(node.entry.isFolder && node.expanded ? rows(node.children, depth + 1) : []),
    ]);

    this.fileList.replaceChildren(...rows(this.nodes, 0));
    this.fileList.scrollTop = scroll;
  }

  async choose(node) {
    if (node.entry.isFolder) {
      node.expanded = !node.expanded;
      node.loaded = node.expanded && node.loaded;

      if (node.expanded) {
        await this.loadNode(node);
      }

      this.renderTree();
      return;
    }

    if (await this.openFile(node.entry.path)) {
      this.remember({ path: node.entry.path, commit: null, diff: false });
    }
  }

  async openFile(path) {
    const request = ++this.previewRequest;
    const result = await attempt(() => this.connection.readFile(this.info.id, path), this.filesError);

    if (request !== this.previewRequest) {
      return false;
    }

    if (result.ok) {
      this.showPreview(result.value);
    }

    return result.ok;
  }

  remember(target) {
    const current = this.visited[this.visitPosition];

    if (current && current.path === target.path && current.commit === target.commit && current.diff === target.diff) {
      return;
    }

    this.visited.splice(this.visitPosition + 1);
    this.visited.push(target);

    if (this.visited.length > 100) {
      this.visited.shift();
    }

    this.visitPosition = this.visited.length - 1;
    this.updateNavigation();
  }

  async navigate(offset) {
    const next = this.visitPosition + offset;

    if (next < 0 || next >= this.visited.length) {
      return;
    }

    const target = this.visited[next];

    if (target.diff ? await this.openDiff(target.path, target.commit, false, false) : await this.openFile(target.path)) {
      this.visitPosition = next;
      this.updateNavigation();
    }
  }

  updateNavigation() {
    this.backButton.disabled = this.visitPosition <= 0;
    this.forwardButton.disabled = this.visitPosition >= this.visited.length - 1;
  }

  async collapseAll() {
    const collapse = nodes => nodes.forEach(node => {
      collapse(node.children);
      node.expanded = false;
      node.loaded = false;
    });

    collapse(this.nodes);
    this.renderTree();

    if (this.changesMode) {
      const folders = nodes => nodes.filter(node => node.children).flatMap(node => [node.path, ...folders(node.children)]);

      for (const path of folders(this.sinceStart ? this.changeTree(this.sessionChanges, sessionStartCommit) : this.changeTree())) {
        this.changeCollapsed.add(path);
      }

      this.renderChanges();
    }
  }

  isMarkdown() {
    return /\.(md|markdown)$/i.test(this.preview?.path ?? "");
  }

  showPreview(content) {
    const other = this.preview?.path !== content.path;

    if (this.preview?.text !== content.text) {
      this.folds.collapsed.clear();
    }

    this.preview = content;
    this.previewTitle.textContent = content.truncated ? `${content.path} (first part only)` : content.path;
    const markdown = this.isMarkdown();
    this.diffState = null;
    this.previewKind.textContent = "";
    this.previewKind.hidden = true;
    this.previewNote.hidden = true;
    this.previewDiff.hidden = true;
    this.previewCode.hidden = markdown;
    this.previewMarkdown.hidden = !markdown;
    this.findToggle.hidden = false;
    this.wrapButton.hidden = markdown;
    this.foldButton.hidden = !markdown;
    this.setMarkdownTools(markdown);
    this.setNumbered(markdown && this.numberedFiles.has(content.path));
    this.tokens = markdown ? [] : highlightSyntax(content.path, content.text);
    this.gutter.textContent = markdown ? "" : Array.from({ length: content.text.split("\n").length }, (_, i) => i + 1).join("\n");
    this.previewPane.hidden = false;
    this.placeholder.hidden = true;
    this.reveal(other);

    this.search(other, other);
  }

  closePreview(forget = false) {
    this.preview = null;
    this.diffState = null;

    if (forget) {
      this.previewRequest++;
      this.visited = [];
      this.visitPosition = -1;
      this.updateNavigation();
    }

    this.previewDiff.hidden = true;
    this.setFind(false);
    this.previewPane.hidden = true;
    this.placeholder.hidden = false;
    this.renderTree();
  }

  setWrap(wrap) {
    this.wrap = wrap;
    this.previewPane.classList.toggle("wrap", wrap);
    this.wrapButton.classList.toggle("on", wrap);
    this.renderCode(false);
  }

  setFind(open) {
    this.find.open = open;
    this.findBar.hidden = !open;
    this.findToggle.classList.toggle("on", open);

    if (open) {
      this.findInput.focus();
      this.findInput.select();
    }

    this.search(true, true);
  }

  findKeyed(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      this.stepFind(event.shiftKey ? -1 : 1);
    } else if (event.key === "Escape") {
      this.setFind(false);
    }
  }

  stepFind(direction) {
    const count = this.find.starts.length;

    if (count > 0) {
      this.find.current = (this.find.current + direction + count) % count;
      this.renderCode(true);
    }
  }

  search(restart, navigate) {
    const find = this.find;
    const markdown = this.isMarkdown();
    const target = markdown ? this.layoutMarkdown() : null;
    find.starts = find.open && this.preview ? findMatches(markdown ? target.plain : this.preview.text, find.query, find.matchCase, find.wholeWord) : [];
    find.current = find.starts.length === 0 ? -1 : restart ? 0 : Math.min(Math.max(find.current, 0), find.starts.length - 1);
    this.renderCode(navigate && find.current >= 0, target);
  }

  layoutMarkdown() {
    this.previewMarkdown.replaceChildren(...renderMarkdown(this.preview.text, this.folds, this.diagrams).childNodes);
    const walker = document.createTreeWalker(this.previewMarkdown, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let plain = "";
    let last = null;

    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      if (node.parentElement.closest(".mddiagram")) {
        continue;
      }

      const block = node.parentElement.closest("p, h1, h2, h3, h4, h5, h6, li, td, th, pre");

      if (nodes.length > 0 && block !== last) {
        plain += "\n";
      }

      last = block;
      nodes.push({ node, start: plain.length });
      plain += node.data;
    }

    this.renderMarkdownMenus();
    this.updateCrumbs();
    return { nodes, plain };
  }

  setMarkdownTools(visible) {
    this.numberButton.hidden = !visible;
    this.levelWrap.hidden = !visible;
    this.outlineWrap.hidden = !visible;
    this.levelMenu.hidden = true;
    this.outlineMenu.hidden = true;

    if (!visible) {
      this.crumbKey = "";
      this.crumbBox.hidden = true;
    }
  }

  openMenu(event, menu) {
    event.stopPropagation();
    const opening = menu.hidden;
    this.levelMenu.hidden = true;
    this.outlineMenu.hidden = true;
    menu.hidden = !opening;
  }

  toggleNumbered() {
    const value = !this.numbered;
    this.setNumbered(value);

    if (this.preview && this.isMarkdown()) {
      if (value) {
        this.numberedFiles.add(this.preview.path);
      } else {
        this.numberedFiles.delete(this.preview.path);
      }

      writeNumbered(this.info.id, this.numberedFiles);
    }
  }

  setNumbered(value) {
    this.numbered = value;
    this.numberButton.classList.toggle("on", value);
    this.previewMarkdown.classList.toggle("numbered", value);
  }

  renderMarkdownMenus() {
    const headings = this.folds.headings;
    const levels = headings.length === 0 ? 0 : Math.max(...headings.map(heading => heading.depth)) + 1;
    const choose = level => () => { this.levelMenu.hidden = true; this.foldToLevel(level); };
    this.levelButton.disabled = headings.length === 0;
    this.outlineButton.disabled = headings.length === 0;
    this.numberButton.disabled = headings.length === 0;
    this.levelMenu.replaceChildren(
      h("div", { class: "hint" }, "Show the headings down to level"),
      h("div", { class: "levels" }, ...Array.from({ length: levels }, (_, i) => h("button", { onclick: choose(i + 1) }, String(i + 1))), h("button", { onclick: choose(0) }, "All")));
    this.outlineMenu.replaceChildren(...headings.map(heading => h("button", { style: `padding-left:${12 + heading.depth * 14}px`, onclick: () => { this.outlineMenu.hidden = true; this.scrollToHeading(heading.index); } }, heading.number === "" ? heading.title : `${heading.number}  ${heading.title}`)));
  }

  foldToLevel(level) {
    const { collapsed, headings } = this.folds;
    collapsed.clear();

    if (level > 0) {
      headings.filter(heading => heading.depth >= level - 1).forEach(heading => collapsed.add(heading.index));
    }

    this.applyFolds();
  }

  scrollToHeading(index) {
    const { collapsed, headings, sections } = this.folds;

    for (let at = index; at >= 0; at = headings[at].parent) {
      collapsed.delete(at);
    }

    this.applyFolds();
    const scroller = this.previewMarkdown;
    const top = sections[index].head.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop;
    scroller.scrollTop = Math.max(0, top - 34);
    this.updateCrumbs();
  }

  updateCrumbs() {
    const scroller = this.previewMarkdown;
    const { headings, sections } = this.folds;
    const trail = [];

    if (!scroller.hidden && scroller.scrollTop >= 1) {
      const top = scroller.getBoundingClientRect().top;
      let found = -1;

      for (let i = 0; i < sections.length; i++) {
        if (sections[i].head.offsetParent === null) {
          continue;
        }

        if (sections[i].head.getBoundingClientRect().top - top >= 30) {
          break;
        }

        found = i;
      }

      for (let at = found; at >= 0; at = headings[at].parent) {
        trail.unshift(headings[at]);
      }
    }

    const key = trail.map(heading => heading.index).join(",");

    if (key === this.crumbKey) {
      return;
    }

    this.crumbKey = key;
    this.crumbBox.hidden = trail.length === 0;
    this.crumbs.replaceChildren(...trail.flatMap((heading, position) => [
      ...(position > 0 ? [h("span", { class: "sep" }, "›")] : []),
      h("button", { class: "flat", onclick: () => this.scrollToHeading(heading.index) }, heading.title)]));
  }

  applyFolds() {
    const { collapsed, sections } = this.folds;
    sections.forEach((section, i) => {
      section.classList.toggle("collapsed", collapsed.has(i));
      section.toggle.textContent = collapsed.has(i) ? "▸" : "▾";
    });
    const all = sections.length > 0 && sections.every((_, i) => collapsed.has(i));
    this.foldButton.replaceChildren(icon(all ? "unfoldAll" : "foldAll"));
    this.foldButton.title = all ? "Expand all" : "Collapse all";
    this.foldButton.classList.toggle("on", all);
    this.updateCrumbs();
  }

  toggleFold(index) {
    const { collapsed } = this.folds;

    if (!collapsed.delete(index)) {
      collapsed.add(index);
    }

    this.applyFolds();
  }

  foldAll() {
    const { collapsed, sections } = this.folds;
    const all = sections.length > 0 && sections.every((_, i) => collapsed.has(i));
    collapsed.clear();

    if (!all) {
      sections.forEach((_, i) => collapsed.add(i));
    }

    this.applyFolds();
  }

  markMarkdown(nodes) {
    const find = this.find;
    let at = 0;

    for (const { node, start } of nodes) {
      const end = start + node.data.length;

      while (at < find.starts.length && find.starts[at] + find.query.length <= start) {
        at++;
      }

      const pieces = [];
      let cursor = 0;

      for (let i = at; i < find.starts.length && find.starts[i] < end; i++) {
        const from = Math.max(find.starts[i], start) - start;
        const to = Math.min(find.starts[i] + find.query.length, end) - start;
        pieces.push(node.data.slice(cursor, from), h("span", { class: i === find.current ? "find current" : "find" }, node.data.slice(from, to)));
        cursor = to;
      }

      if (pieces.length > 0) {
        pieces.push(node.data.slice(cursor));
        node.replaceWith(...pieces);
      }
    }
  }

  renderCode(navigate, target) {
    if (!this.preview) {
      return;
    }

    const find = this.find;
    this.caseButton.classList.toggle("on", find.matchCase);
    this.wordButton.classList.toggle("on", find.wholeWord);
    this.findCount.textContent = !find.open || !find.query ? "" : find.starts.length === 0 ? "No results" : `${find.current + 1} of ${find.starts.length}`;

    if (this.isMarkdown()) {
      this.markMarkdown((target ?? this.layoutMarkdown()).nodes);

      const hit = this.previewMarkdown.querySelector(".find.current");

      if (navigate && hit) {
        let opened = false;

        for (let body = hit.closest(".mdbody"); body; body = body.parentElement.closest(".mdbody")) {
          opened = this.folds.collapsed.delete(this.folds.sections.indexOf(body.parentElement)) || opened;
        }

        if (opened) {
          this.applyFolds();
        }

        hit.scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      return;
    }

    this.source.style.setProperty("--digits", String(this.preview.text.split("\n").length).length);
    this.source.replaceChildren(...codeNodes(this.preview.text, this.tokens, find.starts, find.query.length, find.current, this.wrap));

    if (navigate) {
      this.source.querySelector(".find.current")?.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  async refreshFiles(path) {
    if (path === this.files?.path) {
      await this.loadRoot(path, false);
    } else if (this.findNode(this.nodes, path)) {
      await this.loadNode(this.findNode(this.nodes, path));
      this.renderTree();
    }

    if (this.preview && this.preview.path.slice(0, Math.max(this.preview.path.lastIndexOf("/"), 0)) === path) {
      await this.reloadPreview();
    }
  }

  async reloadAll() {
    await this.loadRoot(this.files?.path ?? "", false);

    for (const node of this.nodes.filter(item => item.entry.isFolder && item.expanded)) {
      await this.loadNode(node);
    }

    this.renderTree();
    await this.reloadPreview();
  }

  async reloadPreview() {
    if (this.previewWaiting) {
      return;
    }

    this.previewWaiting = true;

    try {
      const wait = this.previewRead + 3000 - Date.now();

      if (wait > 0) {
        await new Promise(resolve => setTimeout(resolve, wait));
      }

      const open = this.preview;

      if (!open) {
        return;
      }

      // A background read does not count as a request of its own, so it never supersedes what the user is opening.
      const request = this.previewRequest;
      const errors = new ErrorLine();
      const result = await attempt(() => this.connection.readFile(this.info.id, open.path), errors);
      this.previewRead = Date.now();

      if (request !== this.previewRequest || this.preview?.path !== open.path) {
        return;
      }

      this.filesError.set(errors.element.textContent);

      if (!result.ok) {
        this.closePreview();
      } else if (result.value.text !== open.text || result.value.truncated !== open.truncated || result.value.path !== open.path) {
        this.showPreview(result.value);
      }
    } finally {
      this.previewWaiting = false;
    }
  }

  statusClass(status) {
    return status ? ` ${status.toLowerCase()}` : "";
  }

  statusOf(path, isFolder) {
    if (this.gitStatus.isRepo && (path === ".git" || path.startsWith(".git/"))) {
      return "Ignored";
    }

    for (const change of this.gitChanges) {
      if (change.status === "Ignored") {
        if (change.path === path || change.path === `${path}/` || (change.path.endsWith("/") && path.startsWith(change.path))) {
          return "Ignored";
        }
      } else if (change.path === path) {
        return change.status;
      }
    }

    if (!isFolder) {
      return null;
    }

    const prefix = `${path}/`;
    const inside = this.gitChanges.filter(change => change.status !== "Ignored" && change.path.startsWith(prefix));
    return inside.length === 0 ? null : inside.every(change => change.status === "Added") ? "Added" : "Modified";
  }

  async refreshGit(refs = false) {
    this.gitRefs = this.gitRefs || refs;

    if (this.gitRefreshing) {
      this.gitAgain = true;
      return;
    }

    this.gitRefreshing = true;

    try {
      do {
        this.gitAgain = false;
        const reload = this.gitRefs;
        this.gitRefs = false;
        await this.readGit(reload);
      } while (this.gitAgain);
    } finally {
      this.gitRefreshing = false;
    }
  }

  async readGit(reload) {
    try {
      const status = await this.connection.getGitStatus(this.info.id);
      const changes = status.isRepo ? await this.connection.getGitChanges(this.info.id) : [];
      const compared = this.sinceStart && status.isRepo;
      let sessionChanges = [];
      let failed = null;

      // Failing to list them must not keep the rest of what was read from being shown.
      if (compared) {
        try {
          sessionChanges = await this.connection.getSessionChanges(this.info.id);
        } catch (exception) {
          failed = exception.message;
        }
      }

      if (compared === this.sinceStart) {
        this.sessionChanges = sessionChanges;
        this.sessionChangesError.set(failed);
      }

      const before = this.gitStatus;
      const moved = status.commit !== before.commit || status.branch !== before.branch || status.tag !== before.tag || status.isRepo !== before.isRepo;
      this.gitStatus = status;
      this.gitChanges = changes;

      if (!status.isRepo) {
        this.changesMode = false;
        this.sinceStart = false;
      }

      this.renderGit();

      if ((moved || reload) && this.history.loaded) {
        await this.loadHistory(true);
      }

      // Both compare with the files as they are, which just changed.
      if (this.diffState && (this.diffState.commit === null || this.diffState.commit === sessionStartCommit)) {
        await this.openDiff(this.diffState.path, this.diffState.commit, true);
      }
    } catch (exception) {
    }
  }

  renderGit() {
    const status = this.gitStatus;
    this.versionWrap.hidden = !status.isRepo;
    this.changesToggle.hidden = !status.isRepo;
    this.historyTab.hidden = !status.isRepo;
    this.versionTitle.textContent = status.branch ?? status.tag ?? (status.commit ? "Detached head" : "No commits");
    const tag = status.branch ? status.tag : null;
    this.versionTag.textContent = tag ?? "";
    this.versionTag.hidden = !tag;
    this.versionMessage.textContent = status.message ?? "";
    this.versionHash.textContent = status.commit ?? "";
    this.versionStar.hidden = !status.hasChanges;
    this.versionButton.classList.toggle("pending", !!status.hasChanges);

    if (!status.isRepo && this.side === "history") {
      this.showSide("chat");
    }

    this.applyChangesMode();
    this.renderTree();
    this.renderChanges();
    this.applyState();
  }

  applyChangesMode() {
    this.changeList.hidden = !this.changesMode || this.searchOpen;
    this.fileList.hidden = this.changesMode || this.searchOpen;
    this.pathLabel.hidden = !this.changesMode || this.sinceStart;
    this.sinceTitle.hidden = !this.changesMode || !this.sinceStart;
    this.changesToggle.classList.toggle("on", this.changesMode && !this.sinceStart);
    this.sinceToggle.classList.toggle("on", this.changesMode && this.sinceStart);
  }

  setSearch(open) {
    this.searchOpen = open;
    this.searchToken++;
    this.searchToggle.classList.toggle("on", open);
    this.searchPane.hidden = !open;
    this.searchInput.value = "";
    this.searchList.replaceChildren();
    this.searchEmpty.hidden = true;
    this.applyChangesMode();

    if (open) {
      this.searchInput.focus();
      this.runSearch();
    }
  }

  runSearch() {
    const token = ++this.searchToken;
    const text = this.searchInput.value;
    const content = this.searchContent.checked;

    if (content && text.length === 0) {
      this.searchList.replaceChildren();
      this.searchEmpty.hidden = true;
      return;
    }

    setTimeout(async () => {
      if (token !== this.searchToken) {
        return;
      }

      const result = await attempt(() => this.connection.searchFiles(this.info.id, text, content, this.showHidden), this.filesError);

      if (result.ok && token === this.searchToken) {
        this.searchEmpty.hidden = result.value.length > 0;
        this.searchList.replaceChildren(...result.value.map(hit => {
          const name = hit.path.slice(hit.path.lastIndexOf("/") + 1);
          const folder = hit.path.includes("/") ? hit.path.slice(0, hit.path.lastIndexOf("/")) : "";
          return h("button", { class: "flat hit", onclick: () => this.chooseHit(hit, text) },
            h("div", { class: "primary" }, hit.line ? hit.text : name),
            h("div", { class: "muted small secondary" }, hit.line ? `${hit.path}:${hit.line}` : folder));
        }));
      }
    }, 200);
  }

  async chooseHit(hit, text) {
    this.setSearch(false);
    const request = ++this.previewRequest;
    const result = await attempt(() => this.connection.readFile(this.info.id, hit.path), this.filesError);

    if (!result.ok || request !== this.previewRequest) {
      return;
    }

    this.showPreview(result.value);
    this.remember({ path: hit.path, commit: null, diff: false });

    if (hit.line) {
      this.find.query = text;
      this.findInput.value = text;
      this.setFind(true);
      const index = this.isMarkdown() ? -1 : this.find.starts.findIndex(start => result.value.text.slice(0, start).split("\n").length === hit.line);

      if (index >= 0) {
        this.find.current = index;
        this.renderCode(true);
      }
    }
  }

  async setShowHidden(on) {
    this.showHidden = on;
    this.hiddenToggle.classList.toggle("on", on);
    await this.loadRoot(this.files?.path ?? "", false);

    for (const node of this.nodes.filter(item => item.entry.isFolder && item.expanded)) {
      await this.loadNode(node);
    }

    this.renderTree();
  }

  setChangesMode(on, sinceStart = false) {
    // A side session is always a repository, which may not have been read yet.
    this.changesMode = on && (sinceStart ? !!this.sideInfo : !!this.gitStatus.isRepo);
    const compared = this.changesMode && sinceStart;
    const other = compared !== this.sinceStart;
    this.sinceStart = compared;

    if (other) {
      this.sessionChanges = [];
      this.sessionChangesError.set(null);
    }

    this.applyChangesMode();
    this.renderChanges();

    if (compared && other) {
      this.refreshGit();
    }
  }

  changeTree(changes = this.gitChanges.filter(change => change.status !== "Ignored"), commit = null) {
    const root = { children: [] };

    for (const change of changes) {
      const parts = change.path.split("/").filter(part => part);
      let current = root;

      parts.forEach((name, index) => {
        const last = index === parts.length - 1;
        let node = current.children.find(child => child.name === name && (child.children !== undefined) === !last);

        if (!node) {
          const path = parts.slice(0, index + 1).join("/");
          node = last ? { name, path, status: change.status, commit } : { name, path, children: [] };
          current.children.push(node);
        }

        current = node;
      });
    }

    const sort = nodes => {
      nodes.sort((a, b) => (a.children !== undefined) !== (b.children !== undefined) ? (a.children !== undefined ? -1 : 1) : a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
      nodes.forEach(node => node.children && sort(node.children));
    };

    sort(root.children);
    return root.children;
  }

  changeRows(nodes, depth, key, collapsed, open, redraw) {
    return nodes.flatMap(node => [
      h("div", {
        class: `crow${node.children ? "" : this.statusClass(node.status)}`,
        style: `padding-left:${8 + depth * 16}px`,
        onclick: () => {
          if (!node.children) {
            open(node);
            return;
          }

          if (!collapsed.delete(key + node.path)) {
            collapsed.add(key + node.path);
          }

          redraw();
        },
      }, h("span", { class: "slot" }, icon(node.children ? "folder" : "file")), h("div", { class: "name" }, node.name)),
      ...(node.children && !collapsed.has(key + node.path) ? this.changeRows(node.children, depth + 1, key, collapsed, open, redraw) : []),
    ]);
  }

  renderChanges() {
    if (!this.changesMode) {
      return;
    }

    const scroll = this.changeList.scrollTop;
    const commit = this.sinceStart ? sessionStartCommit : null;
    const tree = this.sinceStart ? this.changeTree(this.sessionChanges, commit) : this.changeTree();
    this.changeList.replaceChildren(...this.changeRows(tree, 0, "", this.changeCollapsed, node => this.openDiff(node.path, commit), () => this.renderChanges()));
    this.changeList.scrollTop = scroll;
  }

  // A quiet open only reads the shown diff again.
  async openDiff(path, commit, quiet = false, remember = true) {
    const request = quiet ? this.previewRequest : ++this.previewRequest;
    const result = await attempt(() => commit === sessionStartCommit ? this.connection.getSessionDiff(this.info.id, path) : this.connection.getGitDiff(this.info.id, path, commit), quiet ? new ErrorLine() : this.filesError);

    if (request !== this.previewRequest || quiet && (this.diffState?.path !== path || this.diffState.commit !== (commit ?? null))) {
      return false;
    }

    if (result.ok) {
      this.showDiff(result.value, path, commit);

      if (remember && !quiet) {
        this.remember({ path, commit: commit ?? null, diff: true });
      }
    }

    return result.ok;
  }

  showDiff(diff, path, commit) {
    const opened = this.openPath();
    this.preview = null;
    this.setFind(false);
    this.diffState = { path, commit: commit ?? null };
    this.previewTitle.textContent = commit === sessionStartCommit ? `${path} (changes since session start)` : commit ? `${path} (${commit.slice(0, 7)})` : `${path} (changes)`;
    this.previewKind.textContent = "Diff";
    this.previewKind.hidden = false;
    this.previewNote.hidden = false;
    this.previewCode.hidden = true;
    this.previewMarkdown.hidden = true;
    this.findToggle.hidden = true;
    this.foldButton.hidden = true;
    this.setMarkdownTools(false);
    this.setNumbered(false);
    this.wrapButton.hidden = false;
    const marker = { Added: "+ ", Removed: "- " };
    const lines = diff.isBinary ? [h("div", { class: "diff-note" }, "Binary file.")] : diff.lines.length === 0 ? [h("div", { class: "diff-note" }, "No changes.")] : diff.lines.map(line => h("div", { class: `dl${line.kind === "Added" ? " added" : line.kind === "Removed" ? " removed" : ""}` },
      h("span", { class: "n" }, line.oldNumber ?? ""),
      h("span", { class: "n" }, line.newNumber ?? ""),
      h("span", { class: "mk" }, marker[line.kind] ?? "  "),
      h("span", { class: "tx" }, line.text)));

    if (diff.truncated) {
      lines.push(h("div", { class: "diff-note" }, "(the rest of the file is not shown)"));
    }

    this.previewDiff.replaceChildren(...lines);
    this.previewDiff.hidden = false;
    this.previewPane.hidden = false;
    this.placeholder.hidden = true;
    this.reveal(this.openPath() !== opened);
  }

  showSide(name) {
    this.side = name === "history" && this.gitStatus.isRepo ? "history" : name === "script" ? "script" : "chat";
    this.chatBody.hidden = this.side !== "chat";
    this.scriptBody.hidden = this.side !== "script";
    this.historyBody.hidden = this.side !== "history";
    this.chatTab.classList.toggle("on", this.side === "chat");
    this.scriptTab.classList.toggle("on", this.side === "script");
    this.historyTab.classList.toggle("on", this.side === "history");

    if (this.side === "history") {
      this.syncOnce();
    }

    if (this.side === "history" && !this.history.loaded) {
      this.loadHistory(true);
    } else if (this.side === "chat") {
      this.scrollToEnd();
    } else if (this.side === "script") {
      this.scriptToEnd();
    }
  }

  async loadHistory(reset) {
    const skip = reset ? 0 : this.history.commits.length;
    const limit = reset ? Math.max(this.history.commits.length, historyChunk) : historyChunk;
    const result = await attempt(() => this.connection.getGitHistory(this.info.id, skip, limit), this.historyError);

    if (!result.ok) {
      return;
    }

    this.history.commits = reset ? [...result.value.commits] : [...this.history.commits, ...result.value.commits];
    this.history.hasMore = result.value.hasMore === true;
    this.history.loaded = true;
    this.renderHistory();
  }

  async toggleCommit(commit) {
    if (this.history.open.delete(commit.hash)) {
      this.renderHistory();
      return;
    }

    this.history.open.add(commit.hash);
    const existing = this.history.changes.get(commit.hash);

    if (!existing || existing.error) {
      const entry = { loading: true, error: null, list: [] };
      this.history.changes.set(commit.hash, entry);
      this.renderHistory();

      try {
        entry.list = await this.connection.getGitCommitChanges(this.info.id, commit.hash);
      } catch (exception) {
        entry.error = exception.message;
      }

      entry.loading = false;
    }

    this.renderHistory();
  }

  renderHistory() {
    const graph = layoutGraph(this.history.commits);
    const items = this.history.commits.map((commit, index) => {
      const current = this.gitStatus.branch ?? null;
      const row = graph.rows[index];
      const branchOf = ref => ref.kind === "Remote" && ref.name.includes("/") ? ref.name.slice(ref.name.indexOf("/") + 1) : ref.name;
      const shown = (commit.refs ?? []).filter(ref => !(ref.kind === "Remote" && commit.refs.some(other => other.kind === "Branch" && other.name === branchOf(ref))));
      const refs = shown.length > 0
        ? h("div", { class: "refs" }, shown.map(ref => {
          const remotes = ref.kind === "Branch" ? commit.refs.filter(other => other.kind === "Remote" && other.name.includes("/") && branchOf(other) === ref.name).map(other => other.name.slice(0, other.name.indexOf("/"))) : [];
          const badge = ref.kind === "Session"
            ? h("span", { class: "ref session", title: "A side session" }, icon("session"), ref.name)
            : h("span", { class: `ref${ref.kind === "Tag" ? " tag" : ref.kind === "Remote" ? " remote" : ref.isCurrent ? " current" : ""}` }, ref.name, remotes.length > 0 ? h("span", { class: "remote-part" }, remotes.join(", ")) : null);
          badge.style.borderColor = graphColors[row.color % graphColors.length];
          return h("button", { class: "refbtn", onclick: () => this.toggleCommit(commit), oncontextmenu: event => { event.preventDefault(); this.refMenu(event, ref, current); } }, badge);
        }))
        : null;
      const date = new Date(commit.date).toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
      const main = h("div", { class: "main", title: commit.hash, onclick: () => this.toggleCommit(commit), oncontextmenu: event => { event.preventDefault(); if (!this.sideInfo) { this.showMenu(event, [{ label: "Checkout", action: () => this.checkout(commit.hash) }]); } } },
        refs,
        h("div", { class: "subject" }, commit.subject),
        h("div", { class: "author" }, commit.author),
        h("div", { class: "when" }, date),
        h("div", { class: "hash" }, commit.hash.slice(0, 7)));
      let expanded = null;

      if (this.history.open.has(commit.hash)) {
        const entry = this.history.changes.get(commit.hash);
        const done = entry && !entry.loading && !entry.error;
        expanded = h("div", { class: "commit-changes" },
          entry?.loading ? h("div", { class: "muted small" }, "Loading changes…") : null,
          entry?.error ? h("div", { class: "error small" }, entry.error) : null,
          done && entry.list.length === 0 ? h("div", { class: "muted small" }, "No changes") : null,
          done ? this.changeRows(this.changeTree(entry.list, commit.hash), 0, `${commit.hash}:`, this.history.collapsed, node => this.openDiff(node.path, commit.hash), () => this.renderHistory()) : null);
      }

      return h("div", { class: "commit" }, graphCell(row, graph.lanes), main, expanded);
    });

    this.historyList.replaceChildren(
      ...(this.history.loaded && this.history.commits.length === 0 ? [h("div", { class: "muted", style: "padding:4px 8px" }, "No commits yet.")] : []),
      ...items,
      ...(this.history.hasMore ? [h("button", { class: "block", style: "margin-top:8px", onclick: () => this.loadHistory(false) }, "Load Older Commits")] : []));
  }

  askGit({ title, body = null, confirm, input = null, text = "", email = false, destructive = false, empty = "", capitalize = true, action, then }) {
    if (this.home.active !== this) {
      return;
    }

    if (this.refuseWork()) {
      return;
    }

    let shown = null;
    const go = async () => {
      const value = nameBox ? nameBox.value.trim() : "";
      const mail = emailBox ? emailBox.value.trim() : "";

      if (nameBox && !value) {
        this.home.dialogError.set(empty);
        return;
      }

      if (emailBox && !mail) {
        this.home.dialogError.set("Enter your name and email.");
        return;
      }

      const run = async () => {
        this.localBusy = true;
        this.renderGit();

        try {
          return await action(value, mail);
        } finally {
          this.localBusy = false;
          this.refreshGit(true);
        }
      };
      const mine = shown;
      this.home.dialogHost.hidden = true;
      const result = await attempt(run, this.home.dialogError);

      if (result.ok) {
        if (this.home.dialogHost.firstChild === mine) {
          this.home.closeDialog();
        }

        if (then) {
          await then();
        }
      } else if (this.home.dialogHost.firstChild === mine) {
        this.home.dialogHost.hidden = false;
      }
    };
    const nameBox = input === null ? null : this.home.nameBox(text, go);
    const emailBox = email ? this.home.nameBox("", go) : null;

    if (nameBox) {
      nameBox.placeholder = input;
      nameBox.setAttribute("autocapitalize", capitalize ? "sentences" : "off");
    }

    if (emailBox) {
      emailBox.placeholder = "Email";
      emailBox.setAttribute("autocapitalize", "off");
    }

    this.home.dialog(title, body, nameBox, emailBox, h("button", { class: `${destructive ? "danger" : "primary"} block`, onclick: go }, confirm));
    shown = this.home.dialogHost.firstChild;
    shown.dataset.view = this.info.id;
  }

  withIdentity(next) {
    if (this.gitStatus.hasIdentity !== false) {
      return next();
    }

    this.askGit({
      title: "Git identity",
      body: "Git needs your name and email to commit.",
      confirm: "Save",
      input: "Name",
      email: true,
      empty: "Enter your name and email.",
      action: (name, mail) => this.connection.gitSetIdentity(this.info.id, name, mail),
      then: next,
    });
  }

  beginGit(kind) {
    const status = this.gitStatus;
    const id = this.info.id;

    if (kind === "reset") {
      this.askGit({ title: "Reset", body: "Discard all changes that are not committed, new files included? This cannot be undone.", confirm: "Discard", destructive: true, action: () => this.connection.gitReset(id) });
    } else if (kind === "commit") {
      this.withIdentity(() => this.askGit({ title: "Commit", confirm: "Commit", input: "Message", empty: "Enter a commit message.", action: text => this.connection.gitCommit(id, text) }));

    }

    const wanted = this.localOptimize.checked;
    this.serviceTitle.textContent = wanted ? "Optimize Ollama context?" : "Stop optimizing Ollama context?";
    this.serviceText.textContent = (wanted
      ? "Ollama runs as a system service, so changing its settings needs root rights. The server adds a systemd drop-in with a quantized key and value cache and flash attention, and restarts the service, which unloads its models for a moment."
      : "Ollama runs as a system service, so changing its settings needs root rights. The server removes its systemd drop-in and restarts the service, which unloads its models for a moment.")
      + (this.serviceNeedsPassword ? " Enter the password of the account the server runs as; it is only used for this change and never stored." : "");
    this.serviceConfirm.textContent = wanted ? "Optimize and Restart" : "Restore and Restart";
    this.servicePassword.hidden = !this.serviceNeedsPassword;
    this.servicePassword.value = "";
    this.serviceError.set(null);
    this.serviceDialog.hidden = false;
  }

  closeService() {
    this.servicePassword.value = "";
    this.serviceError.set(null);
    this.serviceDialog.hidden = true;
  }

  cancelService() {
    this.localOptimize.checked = !this.localOptimize.checked;
    this.closeService();
  }

  async confirmService() {
    const password = this.serviceNeedsPassword ? this.servicePassword.value : undefined;
    const result = await attempt(() => this.connection.configureOllamaService(this.localOptimize.checked, password), this.serviceError);
    this.servicePassword.value = "";

    if (result.ok) {
      const saved = result.value;
      this.localOptimize.checked = saved.localOptimizeContext === true;
      this.showServiceState(saved);

      if (this.baseline !== null) {
        const previous = JSON.parse(this.baseline);
        previous.localOptimizeContext = this.localOptimize.checked;
        this.baseline = JSON.stringify(previous);
      }

      this.closeService();
    }
  }

  showServiceState(environment) {
    this.serviceControl = environment.ollamaServiceControl === true;
    this.serviceNeedsPassword = environment.ollamaServiceNeedsPassword === true;
    this.localNote.textContent = environment.localServerNote ?? "";
    this.localNote.hidden = !environment.localServerNote;
  }

  syncWorkMode() {
    this.delegatedBox.hidden = this.workMode.value !== "Simultaneous";
  }

  syncImage() {
    this.openAiBox.hidden = this.imageSelect.value !== "OpenAi";
    this.imageBox.hidden = this.imageSelect.value !== "Local";
  }

  show(environment) {
    this.defaultSelect.value = environment.defaultService;
    this.claudeCommand.value = environment.claudeCommand ?? "";
    this.claudeFolder.value = environment.claudeConfigFolder ?? "";
    this.codexCommand.value = environment.codexCommand ?? "";
    this.codexFolder.value = environment.codexConfigFolder ?? "";
    this.localCommand.value = environment.localCommand ?? "";
    this.localServer.value = environment.localServer ?? "";
    this.ollamaCommand.value = environment.ollamaCommand ?? "ollama";
    this.workMode.value = environment.localWorkMode ?? "Yield";
    this.delegatedLimit.value = environment.delegatedTaskLimit ?? 1;
    this.syncWorkMode();
    this.localOptimize.checked = environment.localOptimizeContext === true;
    this.showServiceState(environment);
    this.imageSelect.value = environment.imageGeneration ?? "None";
    this.imageServer.value = environment.localImageServer ?? "";
    const defaults = environment.newWorkspaces ?? {};
    this.newCapability.value = defaults.capability ?? "Balanced";
    this.newEffort.value = defaults.effort ?? "High";
    this.newInstructions.value = defaults.instructions ?? "";
    this.statusMinutes.value = environment.statusMinutes ?? 5;
    this.claudeMax.value = environment.claudeMaxWindowPercent ?? 95;
    this.codexMax.value = environment.codexMaxWindowPercent ?? 95;
    this.reviewPrompt.value = environment.reviewPrompt ?? "";
    this.expandPrompt.value = environment.expandPrompt ?? "";

    for (const [key, box] of Object.entries(this.newSwitches)) {
      box.checked = !!defaults[key];
    }

    for (const [key, has] of [[this.claudeKey, environment.hasClaudeApiKey], [this.codexKey, environment.hasCodexApiKey], [this.openAiKey, environment.hasOpenAiApiKey]]) {
      key.input.value = "";
      key.clear.checked = false;
      key.clearRow.hidden = !has;
    }

    this.localRows.forEach((row, index) => {
      const name = capabilities[index].toLowerCase();
      row.model.value = environment.localModels?.[name] ?? "";
      row.context.value = environment.localContexts?.[name] ?? "";
    });
    this.imageRows.forEach((row, index) => { row.model.value = environment.localImageModels?.[capabilities[index].toLowerCase()] ?? ""; });
    this.syncImage();
    this.baseline = JSON.stringify(this.collect());
  }

  keyUpdate(key) {
    return key.clear.checked ? "" : key.input.value.trim() || undefined;
  }

  percent(input) {
    return input.value.trim() === "" ? 95 : Math.min(100, Math.max(1, Math.round(Number(input.value) * 10) / 10));
  }

  names(rows) {
    return Object.fromEntries(rows.map(row => [row.name.toLowerCase(), row.model.value.trim()]));
  }

  collect() {
    const contexts = Object.fromEntries(this.localRows.filter(row => row.context.value !== "").map(row => [row.name.toLowerCase(), Math.trunc(Number(row.context.value))]));
    return {
      defaultService: this.defaultSelect.value,
      claudeCommand: this.claudeCommand.value.trim(),
      claudeConfigFolder: this.claudeFolder.value.trim() || undefined,
      claudeApiKey: this.keyUpdate(this.claudeKey),
      codexCommand: this.codexCommand.value.trim(),
      codexConfigFolder: this.codexFolder.value.trim() || undefined,
      codexApiKey: this.keyUpdate(this.codexKey),
      localCommand: this.localCommand.value.trim(),
      localServer: this.localServer.value.trim(),
      ollamaCommand: this.ollamaCommand.value.trim(),
      localWorkMode: this.workMode.value,
      delegatedTaskLimit: this.delegatedLimit.value.trim() === "" ? 1 : Math.min(16, Math.max(1, Math.round(Number(this.delegatedLimit.value)))),
      localOptimizeContext: this.localOptimize.checked,
      localModels: this.names(this.localRows),
      localContexts: Object.keys(contexts).length > 0 ? contexts : undefined,
      imageGeneration: this.imageSelect.value,
      openAiApiKey: this.keyUpdate(this.openAiKey),
      localImageServer: this.imageServer.value.trim(),
      localImageModels: this.names(this.imageRows),
      newWorkspaces: {
        capability: this.newCapability.value,
        effort: this.newEffort.value,
        ...Object.fromEntries(Object.entries(this.newSwitches).map(([key, box]) => [key, box.checked])),
        instructions: this.newInstructions.value.trim()
      },
      statusMinutes: this.statusMinutes.value.trim() === "" ? 5 : Math.min(1440, Math.max(1, Math.round(Number(this.statusMinutes.value)))),
      claudeMaxWindowPercent: this.percent(this.claudeMax),
      codexMaxWindowPercent: this.percent(this.codexMax),
      reviewPrompt: this.reviewPrompt.value.trim(),
      expandPrompt: this.expandPrompt.value.trim()
    };
  }

  async load() {
    const result = await attempt(() => this.connection.getAiEnvironment(), this.error);

    if (result.ok) {
      this.show(result.value);
    }
  }

  async apply() {
    this.notice.hidden = true;

    // A change of the system service that was not confirmed is not part of the edits.
    if (!this.serviceDialog.hidden) {
      this.cancelService();
    }

    if (this.baseline === null || JSON.stringify(this.collect()) === this.baseline) {
      return true;
    }

    return (await attempt(() => this.connection.setAiEnvironment(this.collect()), this.error)).ok;
  }

  async close() {
    if (await this.apply()) {
      this.app.showHome(this.home);
    }
  }

  say(text) {
    this.notice.textContent = text;
    this.notice.hidden = false;
  }

  fill(list, names) {
    list.replaceChildren(...names.map(name => h("option", { value: name })));
  }

  async refreshLocal() {
    this.notice.hidden = true;
    const result = await attempt(() => this.connection.listLocalModels(this.localServer.value.trim()), this.error);

    if (result.ok) {
      this.fill(this.localNames, result.value);
      this.say(result.value.length === 0 ? "The server offers no models." : `Found ${result.value.length} model${result.value.length === 1 ? "" : "s"}.`);
    }
  }

  async refreshImage() {
    this.notice.hidden = true;
    const result = await attempt(() => this.connection.listImageModels(this.imageServer.value.trim()), this.error);

    if (result.ok) {
      this.fill(this.imageNames, result.value);
      this.say(result.value.length === 0 ? "The server offers no checkpoints." : `Found ${result.value.length} checkpoint${result.value.length === 1 ? "" : "s"}.`);
    }
  }
}

// Only an element that is new or out of order is inserted, since inserting one again takes the focus from what is in it.
function arrange(container, elements) {
  for (const child of [...container.children].filter(item => !elements.includes(item))) {
    child.remove();
  }

  elements.forEach((element, index) => {
    if (container.children[index] !== element) {
      container.insertBefore(element, container.children[index] ?? null);
    }
  });
}

class SwarmScreen {
  constructor(app, connection, home, taskId, workspaceId) {
    this.app = app;
    this.connection = connection;
    this.home = home;
    this.initialTask = taskId;
    this.initialWorkspace = workspaceId;
    this.error = new ErrorLine();
    this.outcome = h("div", { class: "muted small", hidden: true });
    this.status = null;
    this.missed = false;
    this.peerCards = new Map();
    this.pairingCards = new Map();
    this.workerChoices = "";
    this.detail = null;
    this.reading = false;
    this.readAgain = false;
    this.refreshing = false;
    this.refreshAgain = false;
    this.build();
    this.listener = event => this.receive(event);
    this.connection.listeners.add(this.listener);
    this.load();
  }

  input(placeholder = "", type = "text") {
    return h("input", { type, placeholder, autocomplete: "off", autocapitalize: "off", spellcheck: false });
  }

  field(label, control) {
    return h("div", { class: "stack tight" }, h("div", { class: "muted" }, label), control);
  }

  toggle(label, onchange, title = "") {
    const box = h("input", { type: "checkbox", onchange });
    return { box, element: h("label", { class: "check", title }, box, label) };
  }

  // The button stays disabled while its request runs, so a second click cannot send it again.
  actionButton(label, classes, action, ready = () => true) {
    const button = h("button", {
      class: classes,
      onclick: async () => {
        if (button.running) {
          return;
        }

        button.running = true;
        button.disabled = true;

        try {
          await action();
        } finally {
          button.running = false;
          button.disabled = !ready();
        }
      }
    }, label);
    return button;
  }

  openSection(name, ...children) {
    const element = section(name, ...children);
    element.open = true;
    return element;
  }

  build() {
    this.serverName = this.input();
    this.fingerprint = h("div", { class: "muted small selectable" });
    this.accept = this.toggle("Accept delegated work", () => this.setAccept(this.accept.box.checked));
    this.delegatedFolder = this.input();
    this.maxTasks = h("input", { type: "number", min: "1", max: "100", step: "1" });
    this.driveFolder = this.input("/media/you/drive");
    this.codeText = h("div", { class: "swarm-code selectable" });
    this.codeHint = h("div", { class: "muted small" });
    this.codeBox = h("div", { class: "stack tight", hidden: true }, this.codeText, this.codeHint);
    this.pairAddress = this.input("Address of the other server (host:port)");
    this.pairCode = this.input("Its pairing code");
    this.pairAddress.addEventListener("input", () => this.syncPair());
    this.pairCode.addEventListener("input", () => this.syncPair());
    this.pairButton = this.actionButton("Pair Server", "primary block", () => this.pair(), () => this.pairReady());
    this.pairButton.disabled = true;
    this.pairings = h("div", { class: "stack tight" });
    this.noPeers = h("div", { class: "muted", hidden: true }, "No paired servers.");
    this.peers = h("div", { class: "stack tight" });
    this.workspaceSelect = h("select", { onchange: () => this.syncDelegate() });
    this.taskTitle = this.input("Title");
    this.taskInstructions = h("textarea", { rows: 4, placeholder: "Instructions, complete on their own" });
    this.taskExpected = h("textarea", { rows: 2, placeholder: "Expected result and how to check it (optional)" });
    this.taskCapability = h("select", {}, capabilities.map(name => h("option", { value: name }, name)));
    this.taskCapability.value = "Balanced";
    this.taskWorker = h("select", {}, h("option", { value: "" }, "Any networked worker"));
    this.delegateButton = this.actionButton("Delegate Task", "primary block", () => this.delegate(), () => this.delegateReady());
    this.delegateButton.disabled = true;
    this.taskTitle.addEventListener("input", () => this.syncDelegate());
    this.taskInstructions.addEventListener("input", () => this.syncDelegate());
    this.noTasks = h("div", { class: "muted", hidden: true }, "No delegated tasks.");
    this.tasks = h("div", { class: "swarm-tasks" });
    this.lists = h("div", { class: "settings", style: "flex:1;min-height:0;overflow-y:auto" },
      h("div", { class: "stack tight", style: "padding:8px 0 12px" },
        this.openSection("This server",
          this.field("Server name", this.serverName),
          this.fingerprint,
          this.accept.element,
          this.field("Folder for delegated workspaces (empty uses the data folder)", this.delegatedFolder),
          this.field("Maximum tasks per delegated job", this.maxTasks)),
        section("Pair a server",
          h("div", { class: "muted" }, "Over a network, make a code on one server and enter it on the other. For an air gapped server, write an invitation to the drive. Compare the fingerprints."),
          this.actionButton("Create Pairing Code", "block", () => this.act(() => this.connection.swarm("CreatePairingCode"))),
          this.codeBox,
          h("h3", { class: "serif" }, "Pair with Code"),
          this.pairAddress,
          this.pairCode,
          this.pairButton,
          this.actionButton("Write Drive Invitation", "block", () => this.act(() => this.connection.swarm("WriteDriveInvitation")))),
        this.pairings,
        this.openSection("Paired servers", this.noPeers, this.peers),
        section("Drive",
          h("div", { class: "muted" }, "Folder of the drive on the machine of the server. Plug in and mount the drive there, not on this device."),
          this.driveFolder,
          this.actionButton("Sync Drive", "primary block", () => this.act(() => this.connection.swarm("SyncDrive")))),
        section("Delegate a task",
          this.field("Workspace", this.workspaceSelect),
          this.taskTitle,
          this.taskInstructions,
          this.taskExpected,
          this.field("Capability", this.taskCapability),
          this.field("Worker", this.taskWorker),
          this.delegateButton),
        this.openSection("Delegated tasks", this.noTasks, this.tasks)));
    this.detailTitle = h("h2", { class: "serif" });
    this.detailStatus = h("div", { class: "muted small" });
    this.detailBody = h("div", { class: "settings swarm-detail", style: "flex:1;min-height:0;overflow-y:auto" });
    this.detailActions = h("div", { class: "swarm-actions" });
    this.applyButton = this.actionButton("Apply Changes", "primary", () => this.onTask("ApplySwarmTask"));
    this.retryButton = this.actionButton("Retry Task", "", () => this.onTask("RetrySwarmTask"));
    this.cancelTaskButton = this.actionButton("Cancel Task", "danger", () => this.onTask("CancelSwarmTask"));
    this.discardButton = this.actionButton("Discard Task", "", () => this.onTask("DiscardSwarmTask", () => this.showDetail(null)));
    this.detailView = h("div", { class: "swarm-detail-view", hidden: true },
      h("header", {}, h("div", {}, this.detailTitle, this.detailStatus), h("button", { class: "flat", onclick: () => this.showDetail(null) }, "Back to Swarm")),
      this.detailBody,
      this.detailActions);
    this.revokeText = h("div", { class: "muted" });
    this.revokeDialog = h("div", { class: "dialog-wrap", hidden: true },
      h("div", { class: "dialog" },
        h("h3", { class: "serif" }, "Revoke this server?"),
        this.revokeText,
        this.actionButton("Revoke Server", "danger block", () => this.confirmRevoke()),
        h("button", { class: "block", onclick: () => { this.revokeDialog.hidden = true; } }, "Cancel")));
    this.listHeader = h("header", {}, h("h1", { class: "serif" }, "Swarm"), h("button", { class: "flat", onclick: () => this.close() }, "Close"));
    this.element = h("div", { class: "newws" },
      this.listHeader,
      this.lists,
      this.detailView,
      h("div", { class: "foot" }, this.error.element, this.outcome),
      this.revokeDialog);
  }

  server() {
    return {
      ...this.status.server,
      name: this.serverName.value.trim(),
      delegatedFolder: this.delegatedFolder.value.trim(),
      driveFolder: this.driveFolder.value.trim(),
      maxTasksPerJob: this.maxTasks.value.trim() === "" ? 10 : Math.min(100, Math.max(1, Math.round(Number(this.maxTasks.value))))
    };
  }

  serverEdited() {
    const wanted = this.server();
    return ["name", "delegatedFolder", "driveFolder", "maxTasksPerJob"].some(key => (wanted[key] ?? "") !== (this.status.server[key] ?? ""));
  }

  // Compared as typed with what was shown, so a refresh does not take away a space the user has just typed.
  serverTyped() {
    const shown = this.status.server;
    return this.serverName.value !== (shown.name ?? "")
      || this.delegatedFolder.value !== (shown.delegatedFolder ?? "")
      || this.driveFolder.value !== (shown.driveFolder ?? "")
      || this.maxTasks.value !== String(shown.maxTasksPerJob ?? 10);
  }

  async load() {
    const result = await attempt(async () => [await this.connection.swarm("GetSwarm"), await this.connection.listWorkspaces()], this.error);

    if (!result.ok) {
      return;
    }

    const [status, catalog] = result.value;
    const delegated = new Set((catalog.delegations ?? []).map(delegation => delegation.workspaceId));
    const workspaces = catalog.workspaces.filter(workspace => !delegated.has(workspace.id)).sort((left, right) => folderName(left.folder).localeCompare(folderName(right.folder)));
    this.workspaceSelect.replaceChildren(h("option", { value: "" }, "Choose a workspace"), ...workspaces.map(workspace => h("option", { value: workspace.id }, folderName(workspace.folder))));
    this.workspaceSelect.value = workspaces.some(workspace => workspace.id === this.initialWorkspace) ? this.initialWorkspace : "";
    this.show(status, true);
    this.syncDelegate();

    if (this.missed) {
      this.missed = false;
      this.refresh();
    }

    if (this.initialTask) {
      await this.openTask(this.initialTask);
    }
  }

  async apply() {
    if (!this.status) {
      return true;
    }

    if (this.serverEdited() && !(await this.send(() => this.connection.swarm("SetSwarm", { swarmServer: this.server() }), true))) {
      return false;
    }

    for (const card of this.peerCards.values()) {
      if (card.address.value.trim() !== (card.peer.address ?? "")) {
        if (!(await this.send(() => this.connection.swarm("SetSwarmPeer", { swarmPeer: { ...card.peer, address: card.address.value.trim() } }), false))) {
          return false;
        }
      }
    }

    return true;
  }

  // Edits waiting to be sent go first, so an action such as syncing uses the folder that is typed.
  async act(action) {
    this.outcome.hidden = true;
    return await this.apply() && await this.send(action, false);
  }

  // The wanted value is taken first, since sending typed edits shows the old one again. A failure reads the swarm again, which puts the real one back.
  async setAccept(wanted) {
    await this.act(() => this.connection.swarm("SetSwarm", { swarmServer: { ...this.server(), acceptDelegatedWork: wanted } }));
  }

  async send(action, serverSent) {
    const result = await attempt(action, this.error);

    if (!result.ok) {
      await this.refresh();
      return false;
    }

    this.say(result.value.report);
    this.show(result.value, serverSent);
    return true;
  }

  say(text) {
    this.outcome.textContent = text ?? "";
    this.outcome.hidden = !text;
  }

  async pair() {
    if (await this.act(() => this.connection.swarm("PairWithCode", { address: this.pairAddress.value.trim(), code: this.pairCode.value.trim() }))) {
      this.pairAddress.value = "";
      this.pairCode.value = "";
      this.syncPair();
    }
  }

  pairReady() {
    return !!this.pairAddress.value.trim() && !!this.pairCode.value.trim();
  }

  syncPair() {
    this.pairButton.disabled = !!this.pairButton.running || !this.pairReady();
  }

  delegateReady() {
    return !!this.workspaceSelect.value && !!this.taskTitle.value.trim() && !!this.taskInstructions.value.trim();
  }

  syncDelegate() {
    this.delegateButton.disabled = !!this.delegateButton.running || !this.delegateReady();
  }

  async delegate() {
    requestNotifications();
    const workspaceId = this.workspaceSelect.value;
    const task = { title: this.taskTitle.value.trim(), instructions: this.taskInstructions.value.trim(), expectedResult: this.taskExpected.value.trim(), capability: this.taskCapability.value, peerId: this.taskWorker.value || undefined, dependsOn: [] };
    const before = new Set((this.status?.tasks ?? []).map(item => item.id));

    if (await this.act(() => this.connection.swarm("DelegateTask", { workspaceId, task }))) {
      this.taskTitle.value = "";
      this.taskInstructions.value = "";
      this.taskExpected.value = "";
      this.syncDelegate();
      this.say("The task was delegated.");
      this.home.follow((this.status.tasks ?? []).filter(item => !before.has(item.id) && !item.isIncoming).map(item => item.id));
    }
  }

  show(status, takeServer) {
    const editing = !takeServer && this.status !== null && this.serverTyped();
    this.status = status;
    const server = status.server;

    if (!editing) {
      this.serverName.value = server.name ?? "";
      this.delegatedFolder.value = server.delegatedFolder ?? "";
      this.driveFolder.value = server.driveFolder ?? "";
      this.maxTasks.value = server.maxTasksPerJob ?? 10;
    }

    this.fingerprint.textContent = `Fingerprint ${server.fingerprint}`;
    this.accept.box.checked = server.acceptDelegatedWork === true;
    const code = status.pairingCode;
    this.codeBox.hidden = !code;
    this.codeText.textContent = code?.code ?? "";
    this.codeHint.textContent = code ? `On the other server, enter this server's address and this code under Pair with Code before ${new Date(code.expiresAt).toLocaleTimeString([], { timeStyle: "short" })}. It works once.` : "";
    this.pairingCards = new Map((status.drivePairings ?? []).map(pairing => {
      const key = JSON.stringify(pairing);
      return [key, this.pairingCards.get(key) ?? this.pairingCard(pairing)];
    }));
    arrange(this.pairings, [...this.pairingCards.values()]);
    const peers = status.peers ?? [];

    for (const [id, card] of [...this.peerCards]) {
      if (!peers.some(peer => peer.id === id)) {
        card.element.remove();
        this.peerCards.delete(id);
      }
    }

    for (const peer of peers) {
      let card = this.peerCards.get(peer.id);

      if (!card) {
        card = this.peerCard(peer);
        this.peerCards.set(peer.id, card);
      }

      card.update(peer);
    }

    arrange(this.peers, peers.map(peer => this.peerCards.get(peer.id).element));
    this.noPeers.hidden = peers.length > 0;
    const workers = peers.filter(peer => peer.sendWork);
    const workerChoices = JSON.stringify(workers.map(peer => [peer.id, peer.name]));

    if (workerChoices !== this.workerChoices) {
      this.workerChoices = workerChoices;
      const chosen = this.taskWorker.value;
      this.taskWorker.replaceChildren(h("option", { value: "" }, "Any networked worker"), ...workers.map(peer => h("option", { value: peer.id }, peer.name)));
      this.taskWorker.value = workers.some(peer => peer.id === chosen) ? chosen : "";
    }

    const tasks = status.tasks ?? [];
    this.noTasks.hidden = tasks.length > 0;
    this.tasks.replaceChildren(...tasks.map(task => h("button", { onclick: () => this.openTask(task.id) },
      h("div", {}, `${task.isIncoming ? "\u2190" : "\u2192"} ${task.title}`),
      h("div", { class: "muted small" }, taskLine(task)))));
  }

  pairingCard(pairing) {
    return h("div", { class: "swarm-pairing" },
      h("div", {}, pairing.kind === "Invitation" ? `${pairing.name} invites this server to pair` : `${pairing.name} accepted your invitation`),
      h("div", { class: "muted small selectable" }, `Pair only if its fingerprint is ${pairing.fingerprint}.`),
      this.actionButton("Pair Server", "primary block", () => this.act(() => this.connection.swarm("ConfirmDrivePairing", { peerId: pairing.id }))));
  }

  peerCard(peer) {
    const card = { peer };
    const change = settings => {
      const next = { ...card.peer, ...settings, address: card.address.value.trim() };
      card.peer = { ...card.peer, ...settings };
      this.send(() => this.connection.swarm("SetSwarmPeer", { swarmPeer: next }), false);
    };
    const permission = key => change({ permissions: { ...card.peer.permissions, [key]: card[key].box.checked } });
    card.name = h("summary", { class: "serif" });
    card.state = h("div", { class: "muted small" });
    card.problem = h("div", { class: "error", hidden: true });
    card.models = h("div", { class: "muted small" });
    card.print = h("div", { class: "muted small selectable" });
    card.send = this.toggle("Send work to this server", () => change({ sendWork: card.send.box.checked }));
    card.accept = this.toggle("Accept work from this server", () => change({ acceptWork: card.accept.box.checked }));
    card.mode = h("select", { onchange: () => change({ mode: card.mode.value }) }, h("option", { value: "GitRemote" }, "Git remote"), h("option", { value: "Direct" }, "Direct"), h("option", { value: "AirGapped" }, "Air gapped"));
    card.modeText = h("div", { class: "muted small" });
    card.address = this.input("host:port");
    card.address.value = peer.address ?? "";
    card.addressBox = this.field("Address to connect to (empty waits for it to connect here)", card.address);
    card.isShellAllowed = this.toggle("Run shell commands", () => permission("isShellAllowed"), "A shell can reach anything the server's account can, whatever else is off.");
    card.isSystemAccessAllowed = this.toggle("Allow files outside the workspace", () => permission("isSystemAccessAllowed"));
    card.isWebAllowed = this.toggle("Use the web", () => permission("isWebAllowed"));
    card.isImageGenerationAllowed = this.toggle("Generate images", () => permission("isImageGenerationAllowed"));
    card.element = h("details", { class: "section swarm-peer", open: true }, card.name, h("div", { class: "stack tight" },
      card.state, card.problem, card.models, card.print, card.send.element, card.accept.element,
      this.field("Delivery mode", card.mode), card.modeText, card.addressBox,
      h("h3", { class: "serif" }, "What its tasks may do here"),
      card.isShellAllowed.element, card.isSystemAccessAllowed.element, card.isWebAllowed.element, card.isImageGenerationAllowed.element,
      h("button", { class: "danger block", onclick: () => this.askRevoke(card.peer) }, "Revoke Server")));
    card.element.open = true;
    card.update = next => {
      const editing = card.address.value !== (card.peer.address ?? "");
      card.peer = next;
      card.name.textContent = next.name;
      const parts = [next.isConnected ? "Connected" : next.lastSeen ? `Last heard from ${messageStamp(next.lastSeen)}` : "Never heard from"];

      if (next.profileAt) {
        parts.push(next.acceptsOurWork ? `accepts your work, ${next.freeSlots ?? 0} free` : "does not accept your work");

        if (next.mode === "AirGapped") {
          parts.push(`as of ${messageStamp(next.profileAt)}`);
        }
      }

      card.state.textContent = parts.join(" - ");
      card.problem.textContent = next.problem ?? "";
      card.problem.hidden = !next.problem;
      card.models.textContent = (next.capabilities ?? []).length === 0 ? "No models known yet." : next.capabilities.map(item => `${item.capability}: ${item.model}`).join(", ");
      card.print.textContent = `Fingerprint ${next.fingerprint}`;
      card.send.box.checked = next.sendWork === true;
      card.accept.box.checked = next.acceptWork === true;
      card.mode.value = next.mode;
      card.modeText.textContent = { GitRemote: "Code travels through the project's origin remote, which both must reach; tasks and results go over the connection.", Direct: "Code, tasks and results go over the connection.", AirGapped: "Everything is carried on a drive with Sync Drive; nothing goes over a network." }[next.mode];
      card.addressBox.hidden = next.mode === "AirGapped";

      if (!editing) {
        card.address.value = next.address ?? "";
      }

      for (const key of ["isShellAllowed", "isSystemAccessAllowed", "isWebAllowed", "isImageGenerationAllowed"]) {
        card[key].box.checked = next.permissions?.[key] === true;
      }
    };
    return card;
  }

  askRevoke(peer) {
    this.revoking = peer;
    this.revokeText.textContent = `Revoke ${peer.name}? Nothing can then be sent between the two until they pair again, and the tasks between them end.`;
    this.revokeDialog.hidden = false;
  }

  async confirmRevoke() {
    this.revokeDialog.hidden = true;
    await this.act(() => this.connection.swarm("RevokeSwarmPeer", { peerId: this.revoking.id }));
  }

  async openTask(taskId) {
    const result = await attempt(() => this.connection.getSwarmTask(taskId), this.error);

    if (result.ok) {
      this.showDetail(result.value);
    }
  }

  showDetail(detail) {
    const scroll = this.detail?.task.id === detail?.task.id ? this.detailBody.scrollTop : 0;
    this.detail = detail;
    this.detailView.hidden = !detail;
    this.lists.hidden = !!detail;
    this.listHeader.hidden = !!detail;

    if (!detail) {
      return;
    }

    const task = detail.task;
    this.detailTitle.textContent = task.title;
    this.detailStatus.textContent = [taskLine(task), task.capability, task.branch].filter(part => part).join(" - ");
    const heading = text => h("h3", { class: "serif" }, text);
    const block = text => h("div", { class: "swarm-text selectable" }, text);
    const messages = detail.messages ?? [];
    this.detailBody.replaceChildren(
      ...(task.error ? [h("div", { class: "error" }, task.error)] : []),
      heading("Instructions"), block(detail.instructions),
      ...(detail.expectedResult ? [heading("Expected result"), block(detail.expectedResult)] : []),
      ...(detail.report ? [heading("Report"), block(detail.report)] : []),
      ...(messages.length > 0 ? [heading("Conversation"), ...messages.map(message => message.isWork
        ? h("div", { class: "swarm-text swarm-work selectable" }, message.text)
        : h("div", {}, h("div", { class: "muted small" }, message.role), block(message.text)))] : []));
    this.detailBody.scrollTop = scroll;
    const active = activeTaskStates.includes(task.state);
    this.detailActions.replaceChildren(...[
      !task.isIncoming && task.state === "Done" && task.branch && !task.isApplied ? this.applyButton : null,
      !task.isIncoming && ["Failed", "Cancelled", "Lost"].includes(task.state) ? this.retryButton : null,
      active || task.state === "Lost" ? this.cancelTaskButton : null,
      !active ? this.discardButton : null
    ].filter(item => item));
  }

  async onTask(command, afterwards) {
    const taskId = this.detail?.task.id;

    if (!taskId || !(await this.act(() => this.connection.swarm(command, { taskId })))) {
      return;
    }

    if (afterwards) {
      afterwards();
    } else {
      await this.readDetail();
    }
  }

  // A task that can no longer be read was removed, so the list shows again.
  async readDetail() {
    if (this.reading) {
      this.readAgain = true;
      return;
    }

    this.reading = true;

    try {
      do {
        this.readAgain = false;
        // Another task may have been opened while the last one was read.
        const taskId = this.detail?.task.id;

        if (!taskId) {
          break;
        }

        try {
          const detail = await this.connection.getSwarmTask(taskId);

          if (this.detail?.task.id === taskId) {
            this.showDetail(detail);
          }
        } catch (exception) {
          if (this.detail?.task.id === taskId && exception instanceof RemoteError) {
            this.showDetail(null);
          }
        }
      } while (this.readAgain);
    } finally {
      this.reading = false;
    }
  }

  async refresh() {
    if (this.refreshing) {
      this.refreshAgain = true;
      return;
    }

    this.refreshing = true;

    try {
      do {
        this.refreshAgain = false;

        try {
          this.show(await this.connection.swarm("GetSwarm"), false);
        } catch (exception) {
        }
      } while (this.refreshAgain);
    } finally {
      this.refreshing = false;
    }
  }

  receive(event) {
    if (!this.status) {
      this.missed ||= event.kind === "SwarmChanged";
      return;
    }

    if (event.kind === "SwarmChanged") {
      this.refresh();
    } else if (event.kind === "SwarmTaskChanged" && this.detail?.task.id === event.taskId) {
      this.readDetail();
    }
  }

  // What changed while the connection was gone was not told, and a screen that could not be read gets another try.
  reconnected(connection) {
    this.dispose();
    this.connection = connection;
    connection.listeners.add(this.listener);

    if (!this.status) {
      this.load();
      return;
    }

    this.refresh();

    if (this.detail) {
      this.readDetail();
    }
  }

  dispose() {
    this.connection.listeners.delete(this.listener);
  }

  async close() {
    if (await this.apply()) {
      this.dispose();
      this.app.showHome(this.home);
    }
  }
}

class ConnectScreen {
  constructor(app, saved, error) {
    this.app = app;
    this.error = new ErrorLine();
    this.progress = h("div", { class: "progress", hidden: true });
    const defaults = saved ?? { host: ["localhost", "127.0.0.1"].includes(location.hostname) ? location.hostname : "", port: "52679", accessKey: "" };
    this.host = h("input", { type: "text", placeholder: "192.168.1.20", value: defaults.host, autocapitalize: "off", spellcheck: false });
    this.port = h("input", { type: "text", placeholder: "52679", value: String(defaults.port ?? ""), inputMode: "numeric" });
    this.key = h("input", { type: "password", value: defaults.accessKey ?? "", autocomplete: "current-password" });
    this.trust = h("a", { target: "_blank", rel: "noopener" });
    const trustLine = h("div", { class: "muted small trust" }, "Self-signed certificate? Open ", this.trust, " once and accept it, then connect.");
    this.updateTrust = () => {
      const host = this.host.value.trim();
      const port = this.port.value.trim();
      const address = `https://${host.includes(":") ? `[${host}]` : host}:${port}`;
      trustLine.hidden = !host || !/^\d+$/.test(port);
      this.trust.href = address;
      this.trust.textContent = address;
    };
    this.button = h("button", { class: "primary block", style: "margin-top:8px", onclick: () => this.connect() }, "Connect");
    const submit = event => { if (event.key === "Enter") { this.connect(); } };
    [this.host, this.port, this.key].forEach(box => box.addEventListener("keydown", submit));
    [this.host, this.port].forEach(box => box.addEventListener("input", this.updateTrust));
    this.element = h("div", { class: "connect" },
      h("div", { class: "form" },
        h("h1", { class: "serif" }, "Auto Remote"),
        h("div", { class: "muted sub" }, "Connect to your AI server"),
        h("div", { class: "muted" }, "Host"), this.host,
        h("div", { class: "muted" }, "Port"), this.port,
        h("div", { class: "muted" }, "Access key"), this.key,
        this.error.element,
        this.button,
        this.progress,
        trustLine));
    this.updateTrust();
    this.error.set(error);
  }

  async connect() {
    const host = this.host.value.trim();
    const port = Number.parseInt(this.port.value, 10);

    if (!host) {
      this.error.set("Enter the server host.");
      return;
    }

    if (!/^\d+$/.test(this.port.value.trim()) || port < 1 || port > 65535) {
      this.error.set("The port must be a number from 1 to 65535.");
      return;
    }

    if (!this.key.value) {
      this.error.set("Enter the access key.");
      return;
    }

    const settings = { host, port, accessKey: this.key.value };
    this.progress.hidden = false;
    this.button.disabled = true;
    const result = await attempt(() => Connection.open(settings), this.error);
    this.progress.hidden = true;
    this.button.disabled = false;

    if (result.ok) {
      localStorage.setItem(storageKey, JSON.stringify(settings));
      this.app.open(result.value);
    }
  }
}

class App {
  constructor(root) {
    this.root = root;
    this.connection = null;
    this.home = null;
    this.swarm = null;
    this.screen = null;
    let hiddenAt = 0;
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        hiddenAt = Date.now();
      } else if (hiddenAt && Date.now() - hiddenAt > 3000) {
        hiddenAt = 0;
        this.connection?.drop();
      }
    });
  }

  // A screen that covers the main one is told of a new connection, so it stays through a reconnect as the main one does.
  show(element, screen = null) {
    const previous = this.screen;
    this.screen = screen;
    this.root.replaceChildren(element);
    previous?.resources?.sync();
    this.home?.resources.sync();
  }

  saved() {
    try {
      return JSON.parse(localStorage.getItem(storageKey));
    } catch (exception) {
      return null;
    }
  }

  async start() {
    const saved = this.saved();

    if (!saved) {
      this.showConnect(null, null);
      return;
    }

    try {
      await this.open(await Connection.open(saved));
    } catch (exception) {
      this.showConnect(saved, exception.message);
    }
  }

  showConnect(saved, error) {
    this.show(new ConnectScreen(this, saved, error).element);
  }

  async open(connection) {
    this.close();
    this.connection = connection;
    this.home = new Home(this, connection);
    this.watch(connection);
    this.show(this.home.element);
    await this.home.start(null, false);
  }

  watch(connection) {
    connection.onclose = () => {
      if (this.connection !== connection) {
        return;
      }

      if (this.home && (this.screen || this.root.firstChild === this.home.element)) {
        this.home.setOffline(true);
        this.recover(connection);
      } else {
        this.close();
        this.showConnect(this.saved(), "The connection to the server was lost.");
      }
    };
  }

  async recover(lost) {
    const saved = this.saved();

    for (let attempt = 0; this.connection === lost; attempt++) {
      await new Promise(resolve => setTimeout(resolve, Math.min(1000 * 2 ** attempt, 15000)));

      if (this.connection !== lost) {
        return;
      }

      try {
        const fresh = await Connection.open(saved);

        if (this.connection !== lost) {
          fresh.close();
          return;
        }

        this.connection = fresh;
        this.watch(fresh);
        this.home.reconnected(fresh);
        this.screen?.reconnected(fresh);
        return;
      } catch (exception) {
        if (/refused/.test(exception.message)) {
          this.close();
          this.showConnect(saved, exception.message);
          return;
        }
      }
    }
  }

  showHome(home, focus = null) {
    this.show(home.element);

    if (focus) {
      home.start(focus);
    }
  }

  showNewWorkspace(connection, home) {
    const screen = new NewWorkspace(this, connection, home);
    this.show(screen.element, screen);
  }

  showSwarm(connection, home, taskId, workspaceId) {
    this.swarm = new SwarmScreen(this, connection, home, taskId, workspaceId);
    this.show(this.swarm.element, this.swarm);
  }

  // A notification can be clicked while another screen shows, which then gives way to the main one.
  async showWorkspace(home, workspaceId) {
    if (this.home !== home) {
      return;
    }

    const screen = this.screen;

    // Edits are sent as closing the screen would send them, and it stays when that fails.
    if (screen?.apply) {
      if (!(await screen.apply())) {
        return;
      }

      if (this.home !== home || this.screen !== screen && this.screen !== null) {
        return;
      }
    }

    const covered = this.root.firstChild !== home.element;

    if (covered) {
      this.swarm?.dispose();
      this.show(home.element);
    }

    // A screen that covered the workspace left it behind, which selecting it again catches up.
    if (covered && home.selected?.id === home.mainOf(workspaceId)) {
      home.select(home.selected);
    }

    home.show(workspaceId);
  }

  showEnvironment(connection, home) {
    const screen = new AiEnvironmentScreen(this, connection, home);
    this.show(screen.element, screen);
  }

  showMoveWorkspace(connection, home, workspace) {
    const screen = new MoveWorkspace(this, connection, home, workspace);
    this.show(screen.element, screen);
  }

  showCloneWorkspace(connection, home) {
    const screen = new CloneWorkspace(this, connection, home);
    this.show(screen.element, screen);
  }

  changeServer() {
    this.close();
    this.showConnect(this.saved(), null);
  }

  close() {
    this.home?.dispose();
    this.home = null;

    if (this.connection) {
      const old = this.connection;
      this.connection = null;
      old.close();
    }
  }
}

new App(document.getElementById("app")).start();
</script>
